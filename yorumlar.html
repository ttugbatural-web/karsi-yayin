<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Yorumlar — KARŞI Yönetim</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f2f0;
    color: #111;
}


/* =========================
   HEADER
========================= */

header {
    background: #111;
    color: white;
    border-bottom: 4px solid #c40000;
    padding: 18px 20px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.logo {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 36px;
    font-weight: bold;
    letter-spacing: -2px;
}

.back {
    color: white;
    text-decoration: none;

    border: 1px solid #555;

    padding: 8px 12px;

    font-size: 12px;
}

.back:hover {
    background: white;
    color: #111;
}


/* =========================
   MAIN
========================= */

main {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 18px;
}

.page-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 38px;
    margin-bottom: 8px;
}

.page-description {
    color: #666;
    font-size: 14px;
    margin-bottom: 30px;
}


/* =========================
   MESAJ
========================= */

.message {
    padding: 14px 16px;
    margin-bottom: 25px;

    font-size: 13px;

    display: none;
}

.message.success {
    display: block;

    background: #e7f4e7;
    color: #246024;

    border-left: 4px solid #2d8a2d;
}

.message.error {
    display: block;

    background: #f7e4e4;
    color: #8b0000;

    border-left: 4px solid #c40000;
}


/* =========================
   İSTATİSTİKLER
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;

    margin-bottom: 30px;
}

.stat {
    background: white;
    border: 1px solid #ddd;

    padding: 18px;
}

.stat-number {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    font-weight: bold;

    margin-bottom: 5px;
}

.stat-label {
    color: #777;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
}


/* =========================
   FİLTRE
========================= */

.filter-area {
    background: white;
    border: 1px solid #ddd;

    padding: 15px;

    margin-bottom: 20px;

    display: flex;
    align-items: center;

    gap: 10px;

    flex-wrap: wrap;
}

.filter-area label {
    font-size: 11px;
    font-weight: bold;
}

.filter-area select {
    border: 1px solid #ccc;

    padding: 9px 12px;

    font-size: 12px;

    background: white;
}


/* =========================
   YORUMLAR
========================= */

.comments {
    display: flex;
    flex-direction: column;

    gap: 15px;
}

.comment-card {
    background: white;

    border: 1px solid #ddd;

    padding: 20px;
}

.comment-top {
    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 15px;

    margin-bottom: 12px;
}

.comment-author {
    font-family: Georgia, "Times New Roman", serif;

    font-size: 19px;
    font-weight: bold;
}

.comment-email {
    color: #888;

    font-size: 11px;

    margin-top: 4px;
}

.comment-date {
    color: #888;

    font-size: 10px;

    white-space: nowrap;
}

.comment-target {
    display: inline-block;

    background: #eee;

    color: #555;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 1px;

    padding: 4px 7px;

    margin-bottom: 10px;
}

.comment-content {
    font-family: Georgia, "Times New Roman", serif;

    font-size: 14px;

    line-height: 1.6;

    color: #333;

    padding: 12px 0;

    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;

    margin-bottom: 14px;
}


/* =========================
   DURUM
========================= */

.status-badge {
    display: inline-block;

    padding: 4px 7px;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 1px;
}

.status-bekliyor {
    background: #fff3cd;
    color: #856404;
}

.status-onaylandi {
    background: #e7f4e7;
    color: #246024;
}

.status-reddedildi {
    background: #f7e4e4;
    color: #8b0000;
}


/* =========================
   BUTONLAR
========================= */

.comment-actions {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

.comment-actions button {
    border: none;

    padding: 9px 13px;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: .5px;

    cursor: pointer;
}

.approve-button {
    background: #111;
    color: white;
}

.approve-button:hover {
    background: #2d8a2d;
}

.reject-button {
    background: #eee;
    color: #8b0000;
}

.reject-button:hover {
    background: #c40000;
    color: white;
}

.delete-button {
    background: #eee;
    color: #555;
}

.delete-button:hover {
    background: #c40000;
    color: white;
}


/* =========================
   BOŞ
========================= */

.empty {
    background: white;

    border: 1px solid #ddd;

    padding: 30px;

    color: #777;

    font-size: 14px;

    text-align: center;
}


/* =========================
   FOOTER
========================= */

footer {
    margin-top: 60px;

    background: #111;

    color: #999;

    text-align: center;

    padding: 25px;

    font-size: 12px;
}


/* =========================
   MOBİL
========================= */

@media (max-width: 700px) {

    .page-title {
        font-size: 32px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .comment-top {
        flex-direction: column;
        gap: 8px;
    }

    .comment-date {
        white-space: normal;
    }

    .comment-card {
        padding: 16px;
    }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<div class="logo">
KARŞI
</div>

<a
    class="back"
    href="index.html"
>
← Yönetim Paneli
</a>

</div>

</header>


<main>


<h1 class="page-title">
Yorumlar
</h1>


<p class="page-description">
Okuyucu yorumlarını buradan inceleyebilir,
onaylayabilir veya kaldırabilirsin.
</p>


<div
    id="message"
    class="message"
></div>


<!-- =========================
     İSTATİSTİKLER
========================= -->

<section class="stats">

<div class="stat">

<div
    class="stat-number"
    id="bekleyenSayisi"
>
0
</div>

<div class="stat-label">
BEKLEYEN
</div>

</div>


<div class="stat">

<div
    class="stat-number"
    id="onaylananSayisi"
>
0
</div>

<div class="stat-label">
ONAYLANAN
</div>

</div>


<div class="stat">

<div
    class="stat-number"
    id="toplamSayisi"
>
0
</div>

<div class="stat-label">
TOPLAM
</div>

</div>

</section>


<!-- =========================
     FİLTRE
========================= -->

<div class="filter-area">

<label>
GÖSTER:
</label>

<select
    id="durumFilter"
    onchange="yorumlariGetir()"
>

<option value="bekliyor">
Bekleyenler
</option>

<option value="onaylandi">
Onaylananlar
</option>

<option value="reddedildi">
Reddedilenler
</option>

<option value="hepsi">
Tüm Yorumlar
</option>

</select>

</div>


<!-- =========================
     YORUMLAR
========================= -->

<section
    class="comments"
    id="commentsList"
>

<div class="empty">
Yorumlar yükleniyor...
</div>

</section>


</main>


<footer>

KARŞI — Yönetim Paneli

</footer>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
    "https://rfqiffvudbmphvklxetf.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==================================================
   GÜVENLİ METİN
================================================== */

function guvenliMetin(metin) {

    const div =
        document.createElement("div");

    div.textContent =
        metin == null
            ? ""
            : String(metin);

    return div.innerHTML;

}


/* ==================================================
   TARİH
================================================== */

function tarihFormatla(tarih) {

    if (!tarih) {
        return "";
    }

    const date =
        new Date(tarih);

    if (isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString(
        "tr-TR",
        {
            day: "numeric",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* ==================================================
   MESAJ
================================================== */

function mesajGoster(
    mesaj,
    tip
) {

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        mesaj;

    box.className =
        "message " + tip;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==================================================
   YORUM İSTATİSTİKLERİ
================================================== */

async function istatistikleriGetir() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("yorumlar")
            .select("durum");


        if (error) {
            throw error;
        }


        const yorumlar =
            data || [];


        const bekleyen =
            yorumlar.filter(
                y => y.durum === "bekliyor"
            ).length;


        const onaylanan =
            yorumlar.filter(
                y => y.durum === "onaylandi"
            ).length;


        document.getElementById(
            "bekleyenSayisi"
        ).textContent =
            bekleyen;


        document.getElementById(
            "onaylananSayisi"
        ).textContent =
            onaylanan;


        document.getElementById(
            "toplamSayisi"
        ).textContent =
            yorumlar.length;

    }

    catch (error) {

        console.error(
            "İstatistik hatası:",
            error
        );

    }

}


/* ==================================================
   YORUMLARI GETİR
================================================== */

async function yorumlariGetir() {

    const list =
        document.getElementById(
            "commentsList"
        );


    const filter =
        document.getElementById(
            "durumFilter"
        ).value;


    list.innerHTML = `

        <div class="empty">
            Yorumlar yükleniyor...
        </div>

    `;


    let sorgu =
        supabaseClient
            .from("yorumlar")
            .select(`
                id,
                ad_soyad,
                eposta,
                icerik,
                haber_id,
                kose_yazisi_id,
                durum,
                created_at,
                haberler (
                    baslik
                ),
                kose_yazilari (
                    baslik
                )
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (filter !== "hepsi") {

        sorgu =
            sorgu.eq(
                "durum",
                filter
            );

    }


    const {
        data,
        error
    } =
        await sorgu;


    if (error) {

        console.error(
            "Yorumları getirme hatası:",
            error
        );


        list.innerHTML = `

            <div class="empty">

                Yorumlar yüklenemedi.

                <br><br>

                ${guvenliMetin(
                    error.message
                )}

            </div>

        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                Bu kategoride yorum bulunmuyor.

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    data.forEach(
        function(yorum) {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "comment-card";


            let hedef = "KARŞI";


            if (
                yorum.haberler &&
                yorum.haberler.baslik
            ) {

                hedef =
                    "HABER: " +
                    yorum.haberler.baslik;

            }

            else if (
                yorum.kose_yazilari &&
                yorum.kose_yazilari.baslik
            ) {

                hedef =
                    "KÖŞE YAZISI: " +
                    yorum.kose_yazilari.baslik;

            }


            let statusClass =
                "status-bekliyor";


            if (
                yorum.durum ===
                "onaylandi"
            ) {

                statusClass =
                    "status-onaylandi";

            }

            else if (
                yorum.durum ===
                "reddedildi"
            ) {

                statusClass =
                    "status-reddedildi";

            }


            let statusText =
                "BEKLİYOR";


            if (
                yorum.durum ===
                "onaylandi"
            ) {

                statusText =
                    "ONAYLANDI";

            }

            else if (
                yorum.durum ===
                "reddedildi"
            ) {

                statusText =
                    "REDDEDİLDİ";

            }


            card.innerHTML = `

                <div class="comment-top">

                    <div>

                        <div class="comment-author">
                            ${guvenliMetin(
                                yorum.ad_soyad
                            )}
                        </div>

                        ${
                            yorum.eposta
                            ? `
                            <div class="comment-email">
                                ${guvenliMetin(
                                    yorum.eposta
                                )}
                            </div>
                            `
                            : ""
                        }

                    </div>


                    <div class="comment-date">

                        ${guvenliMetin(
                            tarihFormatla(
                                yorum.created_at
                            )
                        )}

                    </div>

                </div>


                <div class="comment-target">

                    ${guvenliMetin(
                        hedef
                    )}

                </div>


                <div class="comment-content">

                    ${guvenliMetin(
                        yorum.icerik
                    )}

                </div>


                <div style="margin-bottom:12px;">

                    <span
                        class="status-badge ${statusClass}"
                    >
                        ${statusText}
                    </span>

                </div>


                <div class="comment-actions">

                    ${
                        yorum.durum !==
                        "onaylandi"
                        ? `
                        <button
                            class="approve-button"
                            onclick="yorumDurumDegistir(
                                '${yorum.id}',
                                'onaylandi'
                            )"
                        >
                            ✓ ONAYLA
                        </button>
                        `
                        : ""
                    }


                    ${
                        yorum.durum !==
                        "reddedildi"
                        ? `
                        <button
                            class="reject-button"
                            onclick="yorumDurumDegistir(
                                '${yorum.id}',
                                'reddedildi'
                            )"
                        >
                            ✕ REDDET
                        </button>
                        `
                        : ""
                    }


                    <button
                        class="delete-button"
                        onclick="yorumSil(
                            '${yorum.id}'
                        )"
                    >
                        🗑 SİL
                    </button>

                </div>

            `;


            list.appendChild(
                card
            );

        }
    );

}


/* ==================================================
   DURUM DEĞİŞTİR
================================================== */

async function yorumDurumDegistir(
    id,
    yeniDurum
) {

    try {

        const {
            error
        } =
        await supabaseClient
            .from("yorumlar")
            .update({
                durum: yeniDurum
            })
            .eq(
                "id",
                id
            );


        if (error) {
            throw error;
        }


        mesajGoster(
            yeniDurum === "onaylandi"
                ? "Yorum onaylandı."
                : "Yorum reddedildi.",
            "success"
        );


        await istatistikleriGetir();

        await yorumlariGetir();

    }

    catch (error) {

        console.error(
            "Yorum durum değiştirme hatası:",
            error
        );


        mesajGoster(
            "İşlem başarısız: " +
            error.message,
            "error"
        );

    }

}


/* ==================================================
   YORUM SİL
================================================== */

async function yorumSil(id) {

    const onay =
        confirm(
            "Bu yorumu kalıcı olarak silmek istediğine emin misin?"
        );


    if (!onay) {
        return;
    }


    try {

        const {
            error
        } =
        await supabaseClient
            .from("yorumlar")
            .delete()
            .eq(
                "id",
                id
            );


        if (error) {
            throw error;
        }


        mesajGoster(
            "Yorum silindi.",
            "success"
        );


        await istatistikleriGetir();

        await yorumlariGetir();

    }

    catch (error) {

        console.error(
            "Yorum silme hatası:",
            error
        );


        mesajGoster(
            "Yorum silinemedi: " +
            error.message,
            "error"
        );

    }

}


/* ==================================================
   BAŞLAT
================================================== */

async function baslat() {

    await istatistikleriGetir();

    await yorumlariGetir();

}


baslat();

</script>


</body>

</html>
