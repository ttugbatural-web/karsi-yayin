<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site İçi Arama — KARŞIDAN</title>
  <meta name="description" content="KARŞIDAN'da haberleri, köşe yazılarını, dünya gündemini ve özel dosyaları arayın.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#111111">
  <link rel="canonical" href="https://karsidan.com.tr/arama.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KARŞIDAN">
  <meta property="og:title" content="Site İçi Arama — KARŞIDAN">
  <meta property="og:description" content="KARŞIDAN'ın haber ve yazı arşivinde arama yapın.">
  <meta property="og:url" content="https://karsidan.com.tr/arama.html">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f2f2f0;color:#171717;font-family:Arial,Helvetica,sans-serif;line-height:1.6}
    a{color:inherit}.site-header{background:#111;color:#fff;border-bottom:4px solid #c40000;padding:20px}
    .header-inner,main,footer .inner{width:min(1000px,100%);margin:0 auto}.header-inner{display:flex;align-items:center;justify-content:space-between;gap:18px}
    .logo{font:900 36px/1 Georgia,"Times New Roman",serif;letter-spacing:-2px;text-decoration:none}.home-link{color:#ddd;font-size:13px;text-decoration:none}
    main{padding:34px 20px 55px}.eyebrow{color:#c40000;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
    h1{font:700 clamp(32px,5vw,46px)/1.12 Georgia,"Times New Roman",serif;margin:5px 0 10px}
    .intro{color:#666;margin:0 0 24px;max-width:650px}
    .search-form{display:flex;gap:10px;margin:0 0 18px}.search-form input{min-width:0;flex:1;padding:15px 14px;border:1px solid #bbb;background:white;font:inherit;border-radius:0}
    .search-form button{padding:0 22px;border:0;background:#c40000;color:white;font-weight:800;cursor:pointer}.search-form button:hover{background:#990000}
    .status{font-size:14px;color:#666;margin:16px 0}.results{display:grid;gap:12px}.result{display:block;background:#fff;border:1px solid #ddd;padding:19px 21px;text-decoration:none;transition:border-color .15s}.result:hover,.result:focus-visible{border-color:#c40000}
    .result-type{font-size:11px;font-weight:800;letter-spacing:1px;color:#c40000;text-transform:uppercase}.result h2{font:700 22px/1.3 Georgia,"Times New Roman",serif;margin:5px 0 8px}.result p{color:#555;margin:0 0 8px;overflow-wrap:anywhere}.result-meta{font-size:12px;color:#777}
    .empty{background:#fff;border:1px solid #ddd;padding:24px;color:#666}.pager{display:flex;justify-content:center;gap:10px;margin-top:22px}.pager button{padding:10px 15px;background:#fff;border:1px solid #bbb;font-weight:700;cursor:pointer}.pager button:disabled{opacity:.4;cursor:not-allowed}
    footer{background:#111;color:#aaa;padding:25px 20px;text-align:center;font-size:13px}footer strong{color:#fff;font:700 20px Georgia,"Times New Roman",serif}
    :focus-visible{outline:3px solid #c40000;outline-offset:3px}
    @media(max-width:560px){.header-inner{align-items:flex-start}.logo{font-size:30px}.search-form{flex-direction:column}.search-form button{padding:13px}.result h2{font-size:20px}main{padding-top:26px}}
  </style>
</head>
<body>
<header class="site-header"><div class="header-inner"><a class="logo" href="index.html" aria-label="KARŞIDAN ana sayfa">KARŞIDAN</a><a class="home-link" href="index.html">← Ana sayfa</a></div></header>
<main>
  <div class="eyebrow">Arşiv</div>
  <h1>Ne arıyorsun?</h1>
  <p class="intro">Haberler, köşe yazıları, dünya gündemi ve özel dosyalar arasında ara. Sonuçlar yalnızca yayımlanmış içeriklerden gösterilir.</p>
  <form id="searchForm" class="search-form" role="search">
    <label for="searchInput" hidden>Aranacak kelime</label>
    <input id="searchInput" name="q" type="search" maxlength="120" autocomplete="off" placeholder="Başlık veya anahtar kelime…" required>
    <button type="submit">ARA</button>
  </form>
  <p id="status" class="status" role="status" aria-live="polite">Aramak için bir kelime yaz.</p>
  <section id="results" class="results" aria-label="Arama sonuçları"></section>
  <div class="pager" id="pager" hidden><button type="button" id="prev">← Önceki</button><button type="button" id="next">Sonraki →</button></div>
</main>
<footer><div class="inner"><strong>KARŞIDAN</strong><br><br>Gücün karşısında, gerçeğin yanında.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  const SUPABASE_URL="https://rfqiffvudbmphvklxetf.supabase.co";
  const SUPABASE_KEY="sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const form=document.getElementById("searchForm");
  const input=document.getElementById("searchInput");
  const status=document.getElementById("status");
  const results=document.getElementById("results");
  const pager=document.getElementById("pager");
  const prev=document.getElementById("prev");
  const next=document.getElementById("next");
  const pageSize=10;
  let allResults=[];
  let page=0;
  const params=new URLSearchParams(location.search);
  input.value=(params.get("q")||"").slice(0,120);
  function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=String(text);return el;}
  function dateText(value){if(!value)return "";const date=new Date(value);return Number.isNaN(date.getTime())?"":date.toLocaleDateString("tr-TR",{day:"2-digit",month:"long",year:"numeric"});}
  function normalized(value){return String(value||"").trim().toLocaleLowerCase("tr-TR");}
  async function queryTable(table,select,column,term,type,urlFor,summaryField,extra){
    const pattern="%"+term.replace(/[\\%_]/g," ").replace(/\s+/g," ").trim()+"%";
    const request=db.from(table).select(select).eq("durum","yayinda").ilike(column,pattern).order("yayin_tarihi",{ascending:false,nullsFirst:false}).limit(100);
    if(extra)extra(request);
    const {data,error}=await request;
    if(error){console.warn("Arama kaynağı okunamadı:",table,error.message);return [];}
    return (data||[]).map(item=>({id:table+":"+item.id,type,title:item.baslik||"Başlıksız içerik",summary:item[summaryField]||"",date:item.yayin_tarihi||item.created_at||"",url:urlFor(item),author:item.yazarlar&&item.yazarlar.ad_soyad||"",category:item.kategori||""})).filter(item=>item.url);
  }
  async function search(term){
    status.textContent="Arşiv taranıyor…";results.replaceChildren();pager.hidden=true;
    if(term.length<2){status.textContent="Arama için en az 2 karakter yaz.";return;}
    const encoded=encodeURIComponent;
    const jobs=[
      queryTable("kose_yazilari","id,baslik,ozet,slug,kategori,yayin_tarihi,yazarlar(ad_soyad)","baslik",term,"Köşe yazısı",x=>"kose-yazisi.html?slug="+encoded(x.slug||""),"ozet"),
      queryTable("kose_yazilari","id,baslik,ozet,slug,kategori,yayin_tarihi,yazarlar(ad_soyad)","ozet",term,"Köşe yazısı",x=>"kose-yazisi.html?slug="+encoded(x.slug||""),"ozet"),
      queryTable("haberler","id,baslik,spot,slug,kategori,yayin_tarihi","baslik",term,"Gündem",x=>"gundem-haber.html?slug="+encoded(x.slug||""),"spot"),
      queryTable("haberler","id,baslik,spot,slug,kategori,yayin_tarihi","spot",term,"Gündem",x=>"gundem-haber.html?slug="+encoded(x.slug||""),"spot"),
      queryTable("dunya_haberleri","id,baslik,ozet,slug,kategori,ulke,kaynak_adi,yayin_tarihi","baslik",term,"Dünya",x=>"dunya-haber.html?slug="+encoded(x.slug||""),"ozet"),
      queryTable("dunya_haberleri","id,baslik,ozet,slug,kategori,ulke,kaynak_adi,yayin_tarihi","ozet",term,"Dünya",x=>"dunya-haber.html?slug="+encoded(x.slug||""),"ozet"),
      queryTable("dosyalar","id,baslik,ozet,slug,kategori,yayin_tarihi,created_at","baslik",term,"Dosya",x=>"dosya.html?slug="+encoded(x.slug||""),"ozet"),
      queryTable("dosyalar","id,baslik,ozet,slug,kategori,yayin_tarihi,created_at","ozet",term,"Dosya",x=>"dosya.html?slug="+encoded(x.slug||""),"ozet")
    ];
    const batches=await Promise.all(jobs);
    const unique=new Map();
    batches.flat().forEach(item=>{if(item.url&&!unique.has(item.url))unique.set(item.url,item);});
    allResults=Array.from(unique.values()).sort((a,b)=>{const da=Date.parse(a.date)||0,db=Date.parse(b.date)||0;return db-da;});
    page=0;render();
  }
  function render(){
    results.replaceChildren();
    const total=allResults.length;
    if(!total){status.textContent="“"+input.value.trim()+"” için yayımlanmış içerik bulunamadı.";results.appendChild(node("div","empty","Başka bir kelime veya daha kısa bir ifade deneyebilirsin."));pager.hidden=true;return;}
    const pages=Math.ceil(total/pageSize);
    status.textContent=total+" sonuç bulundu. "+(page+1)+"/"+pages+". sayfa";
    allResults.slice(page*pageSize,(page+1)*pageSize).forEach(item=>{
      const link=node("a","result");link.href=item.url;
      link.appendChild(node("div","result-type",item.type+(item.category?" · "+item.category:"")));
      link.appendChild(node("h2","",item.title));
      if(item.summary)link.appendChild(node("p","",item.summary));
      const meta=[item.author,dateText(item.date)].filter(Boolean).join(" · ");
      if(meta)link.appendChild(node("div","result-meta",meta));
      results.appendChild(link);
    });
    pager.hidden=pages<2;prev.disabled=page===0;next.disabled=page>=pages-1;
  }
  form.addEventListener("submit",function(event){event.preventDefault();const term=input.value.trim().slice(0,120);history.replaceState(null,"","?q="+encodeURIComponent(term));search(term);});
  prev.addEventListener("click",function(){if(page>0){page--;render();window.scrollTo({top:0,behavior:"smooth"});}});
  next.addEventListener("click",function(){if((page+1)*pageSize<allResults.length){page++;render();window.scrollTo({top:0,behavior:"smooth"});}});
  if(input.value.trim())search(input.value.trim());
})();
</script>
</body>
</html>
