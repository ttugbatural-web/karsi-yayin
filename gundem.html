<main class="container">

</h1>

<div class="page-description">
Güncel haberler farklı kaynaklardan derlenir.
KARŞI'nın kendi haberleri ve yayınları da burada yer alır.

Haberler yükleniyor...
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
    "https://rfqiffvudbmphvklxetf.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==================================================
   TARİH
================================================== */

function tarihFormatla(tarih) {

    if (!tarih) {
        return "";
    }

    const date = new Date(tarih);

    if (isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString(
        "tr-TR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* ==================================================
   GÜVENLİ METİN
================================================== */

function guvenliMetin(metin) {

    const div =
        document.createElement("div");

    div.textContent =
        metin == null
            ? ""
            : String(metin);

    return div.innerHTML;

}


/* ==================================================
   GÜVENLİ URL
================================================== */

function guvenliUrl(url) {

    if (!url) {
        return "#";
    }

    try {

        const temiz =
            String(url).trim();

        const parsed =
            new URL(
                temiz,
                window.location.href
            );

        if (
            parsed.protocol === "http:" ||
            parsed.protocol === "https:"
        ) {

            return parsed.href;

        }

    }

    catch (error) {

        console.warn(
            "Geçersiz URL:",
            url
        );

    }

    return "#";

}


/* ==================================================
   DIŞ HABERLER
   data/haberler.json
================================================== */

async function jsonHaberleriGetir() {

    try {

        const cevap =
            await fetch(
                "data/haberler.json?v=" +
                Date.now()
            );


        if (!cevap.ok) {

            throw new Error(
                "haberler.json yüklenemedi"
            );

        }


        const veriler =
            await cevap.json();


        /*
         * JSON iki farklı yapıda olabilir:
         *
         * [...]
         *
         * veya
         *
         * {
         *   "haberler": [...]
         * }
         */

        const liste =
            Array.isArray(veriler)
                ? veriler
                : Array.isArray(veriler.haberler)
                    ? veriler.haberler
                    : [];


        return liste.map(
            function(haber) {

                return {

                    tip: "kaynak",

                    baslik:
                        haber.baslik ||
                        haber.title ||
                        "Başlıksız haber",

                    aciklama:
                        haber.aciklama ||
                        haber.spot ||
                        haber.ozet ||
                        haber.description ||
                        "",

                    kaynak:
                        haber.kaynak ||
                        haber.source ||
                        "Kaynak",

                    url:
                        haber.url ||
                        haber.link ||
                        "#",

                    tarih:
                        haber.tarih ||
                        haber.date ||
                        haber.yayin_tarihi ||
                        null

                };

            }
        );

    }

    catch (error) {

        console.error(
            "Dış haberler alınamadı:",
            error
        );

        return [];

    }

}


/* ==================================================
   KARŞI HABERLERİ
   SUPABASE
================================================== */

async function supabaseHaberleriGetir() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("haberler")
            .select(
                `
                id,
                baslik,
                spot,
                ozet,
                icerik,
                kategori,
                kaynak,
                kapak_fotografi_url,
                slug,
                durum,
                yayin_tarihi,
                created_at
                `
            )
            .eq(
                "durum",
                "yayinda"
            )
            .order(
                "yayin_tarihi",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "KARŞI haberleri alınamadı:",
            error
        );

        return [];

    }


    if (!data) {
        return [];
    }


    return data.map(
        function(haber) {

            return {

                tip: "karsi",

                id:
                    haber.id,

                baslik:
                    haber.baslik ||
                    "Başlıksız haber",

                aciklama:
                    haber.spot ||
                    haber.ozet ||
                    "",

                kaynak:
                    haber.kaynak ||
                    "KARŞI",

                kategori:
                    haber.kategori ||
                    "Gündem",

                fotograf:
                    haber.kapak_fotografi_url ||
                    null,

                slug:
                    haber.slug ||
                    "",

                url:
                    haber.slug
                        ? "haberler/" +
                          encodeURIComponent(
                              haber.slug
                          ) +
                          ".html"
                        : "#",

                tarih:
                    haber.yayin_tarihi ||
                    haber.created_at

            };

        }
    );

}


/* ==================================================
   TARİHE GÖRE SIRALA
================================================== */

function haberleriSirala(haberler) {

    return haberler.sort(
        function(a, b) {

            const tarihA =
                new Date(
                    a.tarih || 0
                ).getTime();

            const tarihB =
                new Date(
                    b.tarih || 0
                ).getTime();

            return tarihB - tarihA;

        }
    );

}


/* ==================================================
   HABERLERİ GÖSTER
================================================== */

function haberleriGoster(haberler) {

    const liste =
        document.getElementById(
            "haberler"
        );


    liste.innerHTML = "";


    if (
        !haberler ||
        haberler.length === 0
    ) {

        liste.innerHTML = `
            <div class="status">
                Henüz yayınlanmış haber bulunmuyor.
            </div>
        `;

        return;

    }


    haberler.forEach(
        function(haber) {

            const article =
                document.createElement(
                    "article"
                );


            article.className =
                "haber" +
                (
                    haber.tip === "karsi"
                        ? " karsi"
                        : ""
                );


            /* ======================================
               KARŞI HABER
            ====================================== */

            if (
                haber.tip === "karsi"
            ) {

                const haberUrl =
                    guvenliUrl(
                        haber.url
                    );


                const fotografHtml =
                    haber.fotograf
                        ? `
                            <img
                                class="haber-foto"
                                src="${guvenliUrl(
                                    haber.fotograf
                                )}"
                                alt="${guvenliMetin(
                                    haber.baslik
                                )}"
                            >
                          `
                        : "";


                article.innerHTML = `

                    ${fotografHtml}

                    <div class="karsi-badge">
                        KARŞI
                    </div>

                    <div class="kaynak">
                        ${guvenliMetin(
                            haber.kategori
                        )}
                    </div>

                    <h2>

                        <a href="${haberUrl}">

                            ${guvenliMetin(
                                haber.baslik
                            )}

                        </a>

                    </h2>

                    <div class="aciklama">

                        ${guvenliMetin(
                            haber.aciklama
                        )}

                    </div>

                    <div class="tarih">

                        ${tarihFormatla(
                            haber.tarih
                        )}

                    </div>

                `;

            }


            /* ======================================
               DIŞ KAYNAK HABER
            ====================================== */

            else {

                const haberUrl =
                    guvenliUrl(
                        haber.url
                    );


                article.innerHTML = `

                    <div class="kaynak">

                        ${guvenliMetin(
                            haber.kaynak
                        )}

                    </div>

                    <h2>

                        <a
                            href="${haberUrl}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >

                            ${guvenliMetin(
                                haber.baslik
                            )}

                        </a>

                    </h2>

                    <div class="aciklama">

                        ${guvenliMetin(
                            haber.aciklama
                        )}

                    </div>

                    <div class="tarih">

                        ${tarihFormatla(
                            haber.tarih
                        )}

                    </div>

                `;

            }


            liste.appendChild(
                article
            );

        }
    );

}


/* ==================================================
   ANA FONKSİYON
================================================== */

async function haberleriGetir() {

    const durum =
        document.getElementById(
            "durum"
        );


    try {

        durum.textContent =
            "Haberler yükleniyor...";


        /*
         * DIŞ HABERLER VE KARŞI HABERLER
         * AYNI ANDA GETİRİLİYOR.
         */

        const [
            disHaberler,
            karsiHaberler
        ] =
            await Promise.all([
                jsonHaberleriGetir(),
                supabaseHaberleriGetir()
            ]);


        /*
         * İKİ KAYNAĞI BİRLEŞTİR
         */

        const tumHaberler =
            [
                ...disHaberler,
                ...karsiHaberler
            ];


        /*
         * YENİDEN TARİHE GÖRE SIRALA
         */

        haberleriSirala(
            tumHaberler
        );


        /*
         * EKRANA BAS
         */

        haberleriGoster(
            tumHaberler
        );


        /*
         * DURUM
         */

        durum.textContent =
            tumHaberler.length +
            " haber gösteriliyor.";

    }

    catch (error) {

        console.error(
            "Haber sistemi hatası:",
            error
        );

        durum.textContent =
            "Haberler yüklenirken bir hata oluştu.";

    }

}


/* ==================================================
   BAŞLAT
================================================== */

haberleriGetir();

</script>

</body>

</html>
