<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
    "https://rfqiffvudbmphvklxetf.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==================================================
   GÜVENLİ METİN
================================================== */

function guvenliMetin(metin) {

    const div =
        document.createElement("div");

    div.textContent =
        metin == null
            ? ""
            : String(metin);

    return div.innerHTML;

}


/* ==================================================
   GÜVENLİ URL
================================================== */

function guvenliUrl(url) {

    if (!url) {
        return "#";
    }

    try {

        const temiz =
            String(url).trim();

        const parsed =
            new URL(
                temiz,
                window.location.href
            );


        if (
            parsed.protocol === "http:" ||
            parsed.protocol === "https:"
        ) {

            return parsed.href;

        }

    }

    catch (error) {

        console.warn(
            "Geçersiz URL:",
            url
        );

    }

    return "#";

}


/* ==================================================
   TARİH
================================================== */

function tarihFormatla(tarih) {

    if (!tarih) {
        return "";
    }

    const date =
        new Date(tarih);


    if (isNaN(date.getTime())) {
        return "";
    }


    return date.toLocaleString(
        "tr-TR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* ==================================================
   KARŞI HABERLERİNİ SUPABASE'DEN GETİR
================================================== */

async function karsiHaberleriGetir() {

    const durum =
        document.getElementById(
            "durum"
        );


    const liste =
        document.getElementById(
            "haberler"
        );


    try {

        durum.textContent =
            "KARŞI GÜNDEM yükleniyor...";


        /*
         * SADECE SUPABASE
         *
         * haberler.json BURADA YOK.
         */

        const {
            data,
            error
        } =
            await supabaseClient
                .from("haberler")
                .select(
                    `
                    id,
                    baslik,
                    spot,
                    ozet,
                    icerik,
                    kategori,
                    kaynak,
                    kapak_fotografi_url,
                    slug,
                    durum,
                    yayin_tarihi,
                    created_at
                    `
                )
                .eq(
                    "durum",
                    "yayinda"
                )
                .order(
                    "yayin_tarihi",
                    {
                        ascending: false
                    }
                );


        if (error) {

            throw error;

        }


        if (
            !data ||
            data.length === 0
        ) {

            durum.textContent =
                "KARŞI GÜNDEM";


            liste.innerHTML = `

                <div class="status">

                    Henüz yayınlanmış
                    KARŞI haberi bulunmuyor.

                </div>

            `;

            return;

        }


        liste.innerHTML = "";


        data.forEach(
            function(haber) {

                const article =
                    document.createElement(
                        "article"
                    );


                article.className =
                    "haber karsi";


                const slug =
                    haber.slug ||
                    "";


                /*
                 * Haber detay sayfası
                 */

                const haberUrl =
                    slug
                        ? "haber.html?slug=" +
                          encodeURIComponent(
                              slug
                          )
                        : "#";


                const baslik =
                    haber.baslik ||
                    "Başlıksız haber";


                const aciklama =
                    haber.spot ||
                    haber.ozet ||
                    "";


                const kategori =
                    haber.kategori ||
                    "KARŞI GÜNDEM";


                const tarih =
                    haber.yayin_tarihi ||
                    haber.created_at ||
                    null;


                article.innerHTML = `

                    <div class="karsi-badge">
                        KARŞI
                    </div>


                    <div class="kaynak">

                        ${guvenliMetin(
                            kategori
                        )}

                    </div>


                    <h2>

                        <a
                            href="${guvenliUrl(
                                haberUrl
                            )}"
                        >

                            ${guvenliMetin(
                                baslik
                            )}

                        </a>

                    </h2>


                    ${
                        aciklama
                            ? `
                              <div class="aciklama">

                                ${guvenliMetin(
                                    aciklama
                                )}

                              </div>
                              `
                            : ""
                    }


                    <div class="tarih">

                        ${tarihFormatla(
                            tarih
                        )}

                    </div>

                `;


                liste.appendChild(
                    article
                );

            }
        );


        durum.textContent =
            data.length +
            " KARŞI haberi yayınlanıyor.";


    }


    catch (error) {

        console.error(
            "KARŞI haberleri yüklenemedi:",
            error
        );


        durum.textContent =
            "KARŞI GÜNDEM";


        liste.innerHTML = `

            <div class="status">

                KARŞI haberleri yüklenemedi.

                <br><br>

                ${guvenliMetin(
                    error.message
                )}

            </div>

        `;

    }

}


/* ==================================================
   BAŞLAT
================================================== */

karsiHaberleriGetir();

</script>
