<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KARŞI — Gündem</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f3f3;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    background: #111;
    color: white;
    padding: 22px 20px;
    text-align: center;
}

.logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 8px;
    margin: 0;
}

.slogan {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0.8;
}

/* =========================
   NAVIGATION
========================= */

nav {
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: center;
    gap: 28px;
    padding: 14px 10px;
}

nav a {
    color: #111;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
}

nav a:hover {
    text-decoration: underline;
}

/* =========================
   MAIN
========================= */

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 35px 20px 60px;
}

.page-title {
    font-size: 34px;
    font-weight: 900;
    margin: 0 0 8px;
}

.page-description {
    color: #666;
    margin-bottom: 25px;
    line-height: 1.5;
}

.status {
    background: white;
    border-left: 5px solid #111;
    padding: 14px 16px;
    margin-bottom: 30px;
    font-size: 14px;
}

/* =========================
   HABER SÜTUNLARI
========================= */

.haber-sutunlari {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px;
    align-items: start;
}

.kaynak-sutunu {
    min-width: 0;
}

.kaynak-baslik {
    background: #111;
    color: white;
    padding: 14px 16px;
    margin-bottom: 15px;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-left: 5px solid #555;
}

.kaynak-aciklama {
    color: #777;
    font-size: 12px;
    margin: -7px 0 15px 5px;
}

/* =========================
   HABER KARTI
========================= */

.haber {
    background: white;
    border: 1px solid #ddd;
    margin-bottom: 15px;
    padding: 18px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.haber:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.haber .kaynak {
    display: none;
}

.haber h2 {
    margin: 0 0 9px;
    font-size: 18px;
    line-height: 1.35;
}

.haber h2 a {
    color: #111;
    text-decoration: none;
}

.haber h2 a:hover {
    text-decoration: underline;
}

.aciklama {
    color: #555;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 12px;
}

.tarih {
    color: #888;
    font-size: 11px;
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 30px 15px;
    background: #111;
    color: #aaa;
    font-size: 12px;
}

/* =========================
   MOBİL
========================= */

@media (max-width: 700px) {

    .logo {
        font-size: 34px;
        letter-spacing: 6px;
    }

    nav {
        gap: 15px;
        flex-wrap: wrap;
    }

    nav a {
        font-size: 12px;
    }

    .container {
        padding: 25px 14px 45px;
    }

    .page-title {
        font-size: 28px;
    }

    .haber-sutunlari {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .kaynak-baslik {
        margin-top: 15px;
    }

    .haber {
        padding: 16px;
    }

    .haber h2 {
        font-size: 18px;
    }
}
</style>

</head>

<body>

<header>
    <h1 class="logo">KARŞI</h1>
    <div class="slogan">SORU SOR. DÜŞÜN. KARŞI DUR.</div>
</header>

<nav>
    <a href="index.html">ANA SAYFA</a>
    <a href="gundem.html">GÜNDEM</a>
    <a href="kose-yazilari.html">KÖŞE YAZILARI</a>
</nav>

<main class="container">

```
<h1 class="page-title">KARŞI GÜNDEM</h1>

<div class="page-description">
    Aynı ülke, farklı manşetler.
</div>

<div id="durum" class="status">
    Haberler yükleniyor...
</div>

<section id="haberler" class="haber-sutunlari"></section>
```

</main>

<footer>
    KARŞI — Bağımsız yayın
</footer>

<script>

function tarihFormatla(tarih) {

    if (!tarih) {
        return "";
    }

    const date = new Date(tarih);

    if (isNaN(date.getTime())) {
        return tarih;
    }

    return date.toLocaleString("tr-TR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}


/* =========================
   HABERLERİ GETİR
========================= */

async function haberleriGetir() {

    const durum = document.getElementById("durum");
    const liste = document.getElementById("haberler");

    try {

        const cevap = await fetch(
            "data/haberler.json?v=" + Date.now()
        );

        if (!cevap.ok) {
            throw new Error("Haber dosyası bulunamadı.");
        }

        const veri = await cevap.json();

        const haberler = veri.haberler || [];

        if (haberler.length === 0) {

            durum.textContent =
                "Şu anda gösterilecek yeni haber bulunmuyor.";

            return;
        }

        durum.textContent =
            haberler.length + " haber bulundu.";

        liste.innerHTML = "";

        /* =========================
           KAYNAKLARI GRUPLA
        ========================= */

        const kaynaklar = {};

        haberler.forEach(haber => {

            const kaynak = haber.kaynak || "Diğer";

            if (!kaynaklar[kaynak]) {
                kaynaklar[kaynak] = [];
            }

            kaynaklar[kaynak].push(haber);
        });


        /* =========================
           HER KAYNAK İÇİN SÜTUN
        ========================= */

        Object.keys(kaynaklar).forEach(kaynak => {

            const sutun = document.createElement("div");

            sutun.className = "kaynak-sutunu";

            const baslik = document.createElement("div");

            baslik.className = "kaynak-baslik";

            baslik.textContent = kaynak;

            sutun.appendChild(baslik);


            const aciklama =
                document.createElement("div");

            aciklama.className =
                "kaynak-aciklama";

            aciklama.textContent =
                kaynaklar[kaynak].length +
                " haber";

            sutun.appendChild(aciklama);


            kaynaklar[kaynak].forEach(haber => {

                const article =
                    document.createElement("article");

                article.className = "haber";

                article.innerHTML = `

                    <h2>
                        <a href="${guvenliLink(haber.link)}"
                           target="_blank"
                           rel="noopener noreferrer">
                            ${guvenliMetin(haber.baslik)}
                        </a>
                    </h2>

                    ${
                        haber.aciklama
                        ? `<div class="aciklama">
                            ${guvenliMetin(haber.aciklama)}
                           </div>`
                        : ""
                    }

                    <div class="tarih">
                        ${tarihFormatla(haber.tarih)}
                    </div>
                `;

                sutun.appendChild(article);

            });

            liste.appendChild(sutun);

        });

    } catch (hata) {

        console.error(hata);

        durum.textContent =
            "Haberler şu anda yüklenemiyor. Lütfen daha sonra tekrar deneyin.";
    }
}


/* =========================
   GÜVENLİ METİN
========================= */

function guvenliMetin(metin) {

    if (!metin) {
        return "";
    }

    const div =
        document.createElement("div");

    div.textContent = metin;

    return div.innerHTML;
}


/* =========================
   GÜVENLİ LİNK
========================= */

function guvenliLink(link) {

    if (!link) {
        return "#";
    }

    try {

        const url =
            new URL(link);

        if (
            url.protocol === "http:" ||
            url.protocol === "https:"
        ) {
            return url.href;
        }

    } catch (e) {}

    return "#";
}


/* =========================
   BAŞLAT
========================= */

haberleriGetir();

</script>

</body>
</html>
