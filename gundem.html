<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KARŞI — Gündem</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f5;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    background: #111;
    color: white;
    padding: 22px 20px;
    text-align: center;
}

.logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 8px;
    margin: 0;
}

.slogan {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0.8;
}

nav {
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: center;
    gap: 28px;
    padding: 14px 10px;
}

nav a {
    color: #111;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
}

nav a:hover {
    text-decoration: underline;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 18px 50px;
}

.page-title {
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 8px;
}

.page-description {
    color: #666;
    margin-bottom: 28px;
}

.status {
    background: white;
    border-left: 5px solid #111;
    padding: 15px;
    margin-bottom: 20px;
    font-size: 14px;
}

.haber {
    background: white;
    border: 1px solid #ddd;
    margin-bottom: 18px;
    padding: 22px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.haber:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.kaynak {
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #777;
    margin-bottom: 9px;
}

.haber h2 {
    margin: 0 0 10px;
    font-size: 21px;
    line-height: 1.3;
}

.haber h2 a {
    color: #111;
    text-decoration: none;
}

.haber h2 a:hover {
    text-decoration: underline;
}

.aciklama {
    color: #555;
    font-size: 15px;
    line-height: 1.55;
    margin-bottom: 14px;
}

.tarih {
    color: #888;
    font-size: 12px;
}

footer {
    text-align: center;
    padding: 30px 15px;
    background: #111;
    color: #aaa;
    font-size: 12px;
}

@media (max-width: 600px) {

    .logo {
        font-size: 34px;
        letter-spacing: 6px;
    }

    nav {
        gap: 18px;
    }

    nav a {
        font-size: 13px;
    }

    .page-title {
        font-size: 26px;
    }

    .haber {
        padding: 18px;
    }

    .haber h2 {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<header>
    <h1 class="logo">KARŞI</h1>
    <div class="slogan">SORU SOR. DÜŞÜN. KARŞI DUR.</div>
</header>

<nav>
    <a href="index.html">ANA SAYFA</a>
    <a href="gundem.html">GÜNDEM</a>
    <a href="kose-yazilari.html">KÖŞE YAZILARI</a>
</nav>

<main class="container">

    <h1 class="page-title">Gündem</h1>

    <div class="page-description">
        Güncel haberler farklı kaynaklardan otomatik olarak derlenir.
    </div>

    <div id="durum" class="status">
        Haberler yükleniyor...
    </div>

    <section id="haberler"></section>

</main>

<footer>
    KARŞI — Bağımsız yayın
</footer>

<script>

function tarihFormatla(tarih) {

    if (!tarih) {
        return "";
    }

    const date = new Date(tarih);

    if (isNaN(date.getTime())) {
        return tarih;
    }

    return date.toLocaleString("tr-TR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}


async function haberleriGetir() {

    const durum = document.getElementById("durum");
    const liste = document.getElementById("haberler");

    try {

        const cevap = await fetch(
            "data/haberler.json?v=" + Date.now()
        );

        if (!cevap.ok) {
            throw new Error("Haber dosyası bulunamadı.");
        }

        const veri = await cevap.json();

        const haberler = veri.haberler || [];

        if (haberler.length === 0) {

            durum.textContent =
                "Şu anda gösterilecek yeni haber bulunmuyor.";

            return;
        }

        durum.textContent =
            haberler.length + " haber bulundu.";

        liste.innerHTML = "";

        haberler.forEach(haber => {

            const article = document.createElement("article");

            article.className = "haber";

            article.innerHTML = `

                <div class="kaynak">
                    ${guvenliMetin(haber.kaynak)}
                </div>

                <h2>
                    <a href="${guvenliLink(haber.link)}"
                       target="_blank"
                       rel="noopener noreferrer">
                        ${guvenliMetin(haber.baslik)}
                    </a>
                </h2>

                ${
                    haber.aciklama
                    ? `<div class="aciklama">
                        ${guvenliMetin(haber.aciklama)}
                       </div>`
                    : ""
                }

                <div class="tarih">
                    ${tarihFormatla(haber.tarih)}
                </div>
            `;

            liste.appendChild(article);
        });

    } catch (hata) {

        console.error(hata);

        durum.textContent =
            "Haberler şu anda yüklenemiyor. Lütfen daha sonra tekrar deneyin.";
    }
}


function guvenliMetin(metin) {

    if (!metin) {
        return "";
    }

    const div = document.createElement("div");

    div.textContent = metin;

    return div.innerHTML;
}


function guvenliLink(link) {

    if (!link) {
        return "#";
    }

    try {

        const url = new URL(link);

        if (
            url.protocol === "http:" ||
            url.protocol === "https:"
        ) {
            return url.href;
        }

    } catch (e) {}

    return "#";
}


haberleriGetir();

</script>

</body>
</html>
