  /* ==================================================
     SUPABASE
  ================================================== */

  const SUPABASE_URL =
    "https://rfqiffvudbmphvklxetf.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* ==================================================
     GÜVENLİ METİN
  ================================================== */

  function guvenliMetin(metin) {

    const div =
      document.createElement("div");

    div.textContent =
      metin == null
        ? ""
        : String(metin);

    return div.innerHTML;

  }


  /* ==================================================
     SEO METNİ TEMİZLE
  ================================================== */

  function seoMetniTemizle(metin) {

    if (!metin) {
      return "";
    }

    return String(metin)
      .replace(/<[^>]*>/g, " ")
      .replace(/\s+/g, " ")
      .trim();

  }


  /* ==================================================
     SEO DESCRIPTION SINIRLA
  ================================================== */

  function seoDescriptionOlustur(metin) {

    const temiz =
      seoMetniTemizle(
        metin
      );

    if (!temiz) {
      return "KARŞIDAN Gündem — bağımsız haberler, yorumlar ve gündeme dair gelişmeler.";
    }

    if (temiz.length <= 160) {
      return temiz;
    }

    return temiz.substring(
      0,
      157
    ).trim() + "...";

  }


  /* ==================================================
     TARİH
  ================================================== */

  function tarihiFormatla(tarih) {

    if (!tarih) {
      return "";
    }

    const date =
      new Date(tarih);

    if (isNaN(date.getTime())) {
      return "";
    }

    return date.toLocaleDateString(
      "tr-TR",
      {
        day: "2-digit",
        month: "long",
        year: "numeric"
      }
    );

  }


  /* ==================================================
     ISO TARİH
  ================================================== */

  function isoTarih(tarih) {

    if (!tarih) {
      return "";
    }

    const date =
      new Date(tarih);

    if (isNaN(date.getTime())) {
      return "";
    }

    return date.toISOString();

  }


  /* ==================================================
     SLUG AL
  ================================================== */

  function slugGetir() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    return params.get("slug");

  }


  /* ==================================================
     SEO META GÜNCELLE
  ================================================== */

  function seoMetaGuncelle(haber) {

    const siteAdi =
      haber.siteAdi ||
      "KARŞIDAN";


    const baslik =
      haber.baslik ||
      "Haber";


    const description =
      seoDescriptionOlustur(
        haber.spot ||
        haber.icerik ||
        baslik
      );


    const haberUrl =
      "https://karsidan.com.tr/gundem-haber.html?slug=" +
      encodeURIComponent(
        haber.slug
      );


    /* ==================================================
       TITLE
    ================================================== */

    document.title =
      baslik +
      " — " +
      siteAdi;


    /* ==================================================
       DESCRIPTION
    ================================================== */

    const descriptionMeta =
      document.querySelector(
        'meta[name="description"]'
      );

    if (descriptionMeta) {

      descriptionMeta.setAttribute(
        "content",
        description
      );

    }


    /* ==================================================
       CANONICAL
    ================================================== */

    const canonical =
      document.getElementById(
        "canonicalUrl"
      );

    if (canonical) {

      canonical.setAttribute(
        "href",
        haberUrl
      );

    }


    /* ==================================================
       OPEN GRAPH
    ================================================== */

    const ogTitle =
      document.getElementById(
        "ogTitle"
      );

    if (ogTitle) {

      ogTitle.setAttribute(
        "content",
        baslik +
        " — " +
        siteAdi
      );

    }


    const ogDescription =
      document.getElementById(
        "ogDescription"
      );

    if (ogDescription) {

      ogDescription.setAttribute(
        "content",
        description
      );

    }


    const ogUrl =
      document.getElementById(
        "ogUrl"
      );

    if (ogUrl) {

      ogUrl.setAttribute(
        "content",
        haberUrl
      );

    }


    const ogSiteName =
      document.getElementById(
        "ogSiteName"
      );

    if (ogSiteName) {

      ogSiteName.setAttribute(
        "content",
        siteAdi
      );

    }


    /* ==================================================
       GÖRSEL
    ================================================== */

    if (
      haber.kapak_fotografi_url
    ) {

      const ogImage =
        document.getElementById(
          "ogImage"
        );

      if (ogImage) {

        ogImage.setAttribute(
          "content",
          haber.kapak_fotografi_url
        );

      }


      const twitterImage =
        document.getElementById(
          "twitterImage"
        );

      if (twitterImage) {

        twitterImage.setAttribute(
          "content",
          haber.kapak_fotografi_url
        );

      }


      const imageAlt =
        document.getElementById(
          "ogImageAlt"
        );

      if (imageAlt) {

        imageAlt.setAttribute(
          "content",
          baslik
        );

      }


      const twitterImageAlt =
        document.getElementById(
          "twitterImageAlt"
        );

      if (twitterImageAlt) {

        twitterImageAlt.setAttribute(
          "content",
          baslik
        );

      }

    }


    /* ==================================================
       TWITTER
    ================================================== */

    const twitterTitle =
      document.getElementById(
        "twitterTitle"
      );

    if (twitterTitle) {

      twitterTitle.setAttribute(
        "content",
        baslik +
        " — " +
        siteAdi
      );

    }


    const twitterDescription =
      document.getElementById(
        "twitterDescription"
      );

    if (twitterDescription) {

      twitterDescription.setAttribute(
        "content",
        description
      );

    }


    /* ==================================================
       JSON-LD NEWSARTICLE
    ================================================== */

    const structuredData =
      document.getElementById(
        "structuredData"
      );


    if (!structuredData) {
      return;
    }


    const yayinTarihi =
      haber.yayin_tarihi ||
      haber.created_at;


    const articleData = {

      "@context":
        "https://schema.org",

      "@type":
        "NewsArticle",

      "headline":
        baslik,

      "description":
        description,

      "url":
        haberUrl,

      "inLanguage":
        "tr-TR",

      "isAccessibleForFree":
        true,

      "datePublished":
        isoTarih(
          yayinTarihi
        ),

      "dateModified":
        isoTarih(
          haber.updated_at ||
          yayinTarihi
        ),

      "author": {

        "@type":
          "Person",

        "name":
          haber.authorName ||
          siteAdi

      },

      "publisher": {

        "@type":
          "Organization",

        "name":
          siteAdi,

        "url":
          "https://karsidan.com.tr/"

      },

      "mainEntityOfPage": {

        "@type":
          "WebPage",

        "@id":
          haberUrl

      }

    };


    if (
      haber.kapak_fotografi_url
    ) {

      articleData.image = [
        haber.kapak_fotografi_url
      ];

    }


    if (
      haber.kategori
    ) {

      articleData.articleSection =
        haber.kategori;

    }


    if (
      haber.kaynak
    ) {

      articleData.isBasedOn =
        haber.kaynak;

    }


    structuredData.textContent =
      JSON.stringify(
        articleData
      );

  }


  /* ==================================================
     SİTE AYARLARI
  ================================================== */

  async function siteAyarlariGetir() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("ayarlar")
        .select(
          "site_adi, slogan, footer_yazisi, bakim_modu"
        )
        .eq(
          "id",
          1
        )
        .single();


    if (error || !data) {
      return null;
    }


    const siteAdi =
      data.site_adi ||
      "KARŞIDAN";


    const slogan =
      data.slogan ||
      "Gücün karşısında, gerçeğin yanında.";


    const footerYazisi =
      data.footer_yazisi ||
      siteAdi +
      " — " +
      slogan;


    document.getElementById(
      "siteLogo"
    ).textContent =
      siteAdi;


    document.getElementById(
      "siteFooter"
    ).textContent =
      footerYazisi;


    return {

      siteAdi:
        siteAdi,

      slogan:
        slogan,

      footerYazisi:
        footerYazisi,

      bakimModu:
        data.bakim_modu === true

    };

  }


  /* ==================================================
     HABERİ GETİR
  ================================================== */

  async function haberiGetir(
    siteAyarlari
  ) {

    const container =
      document.getElementById(
        "articleContainer"
      );


    const slug =
      slugGetir();


    if (!slug) {

      container.innerHTML = `

        <div class="not-found">

          <h1>
            Haber bulunamadı
          </h1>

          <p>
            Haber bağlantısında geçerli bir slug bulunmuyor.
          </p>

          <a
            class="back-button"
            href="gundem.html"
          >
            GÜNDEME DÖN
          </a>

        </div>

      `;

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("haberler")
        .select(`
          id,
          baslik,
          spot,
          icerik,
          kategori,
          kaynak,
          kapak_fotografi_url,
          slug,
          durum,
          yayin_tarihi,
          created_at,
          updated_at,
          yazar_id,
          yazarlar (
            ad_soyad
          )
        `)
        .eq(
          "slug",
          slug
        )
        .eq(
          "durum",
          "yayinda"
        )
        .maybeSingle();


    if (error) {

      console.error(
        "Haber yükleme hatası:",
        error
      );


      container.innerHTML = `

        <div class="error">

          Haber yüklenirken bir hata oluştu:

          <br><br>

          ${guvenliMetin(
            error.message
          )}

        </div>

      `;

      return;

    }


    if (!data) {

      container.innerHTML = `

        <div class="not-found">

          <h1>
            Haber bulunamadı
          </h1>

          <p>
            Aradığın haber yayında değil veya artık mevcut değil.
          </p>

          <a
            class="back-button"
            href="gundem.html"
          >
            GÜNDEME DÖN
          </a>

        </div>

      `;

      return;

    }


    const authorName =
      data.yazarlar &&
      data.yazarlar.ad_soyad
        ? data.yazarlar.ad_soyad
        : "KARŞIDAN";


    /* ==================================================
       SEO VERİLERİ
    ================================================== */

    seoMetaGuncelle({

      ...data,

      siteAdi:
        siteAyarlari &&
        siteAyarlari.siteAdi
          ? siteAyarlari.siteAdi
          : "KARŞIDAN",

      authorName:
        authorName

    });


    /* ==================================================
       FOTOĞRAF
    ================================================== */

    let photoHtml = "";


    if (
      data.kapak_fotografi_url
    ) {

      photoHtml = `

        <img
          class="article-photo"
          src="${guvenliMetin(
            data.kapak_fotografi_url
          )}"
          alt="${guvenliMetin(
            data.baslik
          )}"
          loading="eager"
          fetchpriority="high"
          decoding="async"
        >

      `;

    }


    /* ==================================================
       KAYNAK
    ================================================== */

    let sourceHtml = "";


    if (data.kaynak) {

      sourceHtml = `

        <div class="article-source">

          Kaynak:
          ${guvenliMetin(
            data.kaynak
          )}

        </div>

      `;

    }


    /* ==================================================
       HABER HTML
    ================================================== */

    container.innerHTML = `

      <article
        class="article"
        itemscope
        itemtype="https://schema.org/NewsArticle"
      >

        <div
          class="category"
          itemprop="articleSection"
        >

          ${guvenliMetin(
            data.kategori ||
            "Gündem"
          )}

        </div>


        <h1
          class="article-title"
          itemprop="headline"
        >

          ${guvenliMetin(
            data.baslik
          )}

        </h1>


        ${
          data.spot
            ? `
              <div
                class="article-spot"
                itemprop="description"
              >

                ${guvenliMetin(
                  data.spot
                )}

              </div>
            `
            : ""
        }


        <div class="article-meta">

          <span
            itemprop="author"
            itemscope
            itemtype="https://schema.org/Person"
          >

            Yazar:

            <span itemprop="name">

              ${guvenliMetin(
                authorName
              )}

            </span>

          </span>


          ${
            data.yayin_tarihi
              ? `
                <time
                  itemprop="datePublished"
                  datetime="${guvenliMetin(
                    isoTarih(
                      data.yayin_tarihi
                    )
                  )}"
                >

                  ${tarihiFormatla(
                    data.yayin_tarihi
                  )}

                </time>
              `
              : ""
          }


          ${
            data.kategori
              ? `
                <span>

                  ${guvenliMetin(
                    data.kategori
                  )}

                </span>
              `
              : ""
          }

        </div>


        ${photoHtml}


        <div
          class="article-content"
          itemprop="articleBody"
        >

          ${
            data.icerik ||
            "<p>Bu haber için henüz içerik eklenmemiş.</p>"
          }

        </div>


        ${sourceHtml}

      </article>

    `;

  }


  /* ==================================================
     BAŞLAT
  ================================================== */

  async function baslat() {

    try {

      const siteAyarlari =
        await siteAyarlariGetir();


      /*
       * Bakım modu açık olduğunda
       * haber göstermiyoruz.
       */

      if (
        siteAyarlari &&
        siteAyarlari.bakimModu
      ) {

        document.body.innerHTML = `

          <div style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#111;
            color:white;
            text-align:center;
            padding:30px;
            font-family:Arial,Helvetica,sans-serif;
          ">

            <div>

              <div style="
                font-family:Georgia,serif;
                font-size:52px;
                font-weight:bold;
                margin-bottom:25px;
              ">

                ${guvenliMetin(
                  siteAyarlari.siteAdi
                )}

              </div>

              <div style="
                color:#aaa;
                font-size:15px;
                line-height:1.6;
              ">

                Site şu anda bakımda.

                <br>

                Lütfen daha sonra tekrar deneyin.

              </div>

            </div>

          </div>

        `;

        return;

      }


      await haberiGetir(
        siteAyarlari
      );

    }

    catch (error) {

      console.error(
        "Beklenmeyen hata:",
        error
      );


      const container =
        document.getElementById(
          "articleContainer"
        );


      if (container) {

        container.innerHTML = `

          <div class="error">

            Haber yüklenirken
            beklenmeyen bir hata oluştu.

            <br><br>

            ${guvenliMetin(
              error.message ||
              "Bilinmeyen hata."
            )}

          </div>

        `;

      }

    }

  }


  baslat();

</script></body>
</html>
