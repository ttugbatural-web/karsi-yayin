<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Köşe Yazıları — KARŞI Yönetim</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f0;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      border-bottom: 4px solid #c40000;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: -2px;
    }

    .back {
      color: white;
      text-decoration: none;
      border: 1px solid #555;
      padding: 8px 12px;
      font-size: 12px;
    }

    .back:hover {
      background: white;
      color: #111;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .page-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      margin-bottom: 8px;
    }

    .page-description {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-box {
      background: white;
      border: 1px solid #ddd;
      padding: 25px;
      margin-bottom: 35px;
    }

    .form-box h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #ccc;
      padding: 12px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      outline: none;
    }

    .form-group textarea {
      min-height: 140px;
      resize: vertical;
    }

    .form-group textarea.icerik {
      min-height: 420px;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.7;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #111;
    }

    .photo-area {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .photo-preview {
      width: 150px;
      height: 95px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 30px;
      color: #777;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-info {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    .photo-info input {
      margin-top: 8px;
    }

    .slug-preview {
      margin-top: 7px;
      color: #777;
      font-size: 12px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .button {
      border: none;
      padding: 13px 20px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .save-button {
      background: #111;
      color: white;
    }

    .save-button:hover {
      background: #c40000;
    }

    .draft-button {
      background: #ddd;
      color: #111;
    }

    .draft-button:hover {
      background: #bbb;
    }

    .cancel-button {
      background: white;
      border: 1px solid #ccc;
      color: #555;
    }

    .cancel-button:hover {
      background: #eee;
    }

    .message {
      padding: 14px;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }

    .message.success {
      display: block;
      background: #e6f4e6;
      border-left: 4px solid #228b22;
      color: #145214;
    }

    .message.error {
      display: block;
      background: #f8e5e5;
      border-left: 4px solid #c40000;
      color: #7a0000;
    }

    .articles-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      margin-bottom: 15px;
    }

    .articles {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .article-card {
      background: white;
      border: 1px solid #ddd;
      padding: 20px;
    }

    .article-card h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .article-meta {
      color: #777;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .article-summary {
      color: #555;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .status-yayinda {
      background: #e3f2e3;
      color: #287028;
    }

    .status-taslak {
      background: #eee;
      color: #666;
    }

    .card-buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .card-button {
      border: 1px solid #ccc;
      background: white;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 11px;
    }

    .card-button:hover {
      background: #eee;
    }

    .delete-button {
      color: #a00000;
    }

    .empty {
      background: white;
      border: 1px solid #ddd;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }

    footer {
      margin-top: 60px;
      background: #111;
      color: #999;
      text-align: center;
      padding: 25px;
      font-size: 12px;
    }

    @media (max-width: 750px) {

      .page-title {
        font-size: 32px;
      }

      .form-box {
        padding: 20px;
      }

      .articles {
        grid-template-columns: 1fr;
      }

      .photo-area {
        align-items: flex-start;
        flex-direction: column;
      }

      .photo-preview {
        width: 100%;
        height: 160px;
      }

    }

  </style>

</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      KARŞI
    </div>

    <a
      class="back"
      href="index.html"
    >
      ← Yönetim Paneli
    </a>

  </div>

</header>

<main>

  <h1 class="page-title">
    Köşe Yazıları
  </h1>

  <p class="page-description">
    KARŞI köşe yazılarını buradan oluşturabilir,
    düzenleyebilir ve yayınlayabilirsin.
  </p>


  <div
    id="message"
    class="message"
  ></div>


  <section class="form-box">

    <h2 id="formTitle">
      Yeni Köşe Yazısı
    </h2>


    <div class="form-group">

      <label>
        BAŞLIK
      </label>

      <input
        type="text"
        id="articleTitle"
        placeholder="Örn. Diktatör Olmadan Önce Herkes Halkçıdır"
      >

    </div>


    <div class="form-group">

      <label>
        ÖZET / GİRİŞ
      </label>

      <textarea
        id="articleSummary"
        placeholder="Yazının kısa giriş metni..."
      ></textarea>

    </div>


    <div class="form-group">

      <label>
        YAZAR
      </label>

      <select id="articleAuthor">

        <option value="">
          Yazar seç
        </option>

      </select>

    </div>


    <div class="form-group">

      <label>
        KATEGORİ
      </label>

      <input
        type="text"
        id="articleCategory"
        value="Köşe Yazısı"
      >

    </div>


    <div class="form-group">

      <label>
        YAZI
      </label>

      <textarea
        id="articleContent"
        class="icerik"
        placeholder="Köşe yazısını buraya yaz..."
      ></textarea>

    </div>


    <div class="form-group">

      <label>
        KAPAK FOTOĞRAFI
      </label>

      <div class="photo-area">

        <div
          class="photo-preview"
          id="photoPreview"
        >
          📰
        </div>

        <div class="photo-info">

          Yazı için kapak fotoğrafı seç.

          <br>

          JPG veya PNG kullanabilirsin.

          <br>

          <input
            type="file"
            id="articlePhoto"
            accept="image/jpeg,image/png"
          >

        </div>

      </div>

    </div>


    <div class="form-group">

      <label>
        SLUG
      </label>

      <input
        type="text"
        id="articleSlug"
        placeholder="diktator-olmadan-once-herkes-halkcidir"
      >

      <div class="slug-preview">
        URL: /kose-yazilari/<span id="slugPreview"></span>
      </div>

    </div>


    <div class="form-group">

      <label>
        DURUM
      </label>

      <select id="articleStatus">

        <option value="taslak">
          Taslak
        </option>

        <option value="yayinda">
          Yayında
        </option>

      </select>

    </div>


    <div class="buttons">

      <button
        class="button save-button"
        id="saveButton"
        onclick="yaziKaydet()"
      >
        YAZIYI KAYDET
      </button>

      <button
        class="button cancel-button"
        id="cancelButton"
        onclick="formTemizle()"
        style="display:none;"
      >
        DÜZENLEMEYİ İPTAL ET
      </button>

    </div>

  </section>


  <h2 class="articles-title">
    Mevcut Köşe Yazıları
  </h2>


  <section
    class="articles"
    id="articlesList"
  >

    <div class="empty">
      Yazılar yükleniyor...
    </div>

  </section>

</main>


<footer>

  KARŞI — Yönetim Paneli

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* ==================================================
     SUPABASE
  ================================================== */

  const SUPABASE_URL =
    "https://rfqiffvudbmphvklxetf.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* ==================================================
     DEĞİŞKENLER
  ================================================== */

  let duzenlenenYaziId = null;

  let mevcutFotografUrl = null;


  const photoInput =
    document.getElementById("articlePhoto");

  const photoPreview =
    document.getElementById("photoPreview");

  const saveButton =
    document.getElementById("saveButton");


  /* ==================================================
     SLUG
  ================================================== */

  function slugOlustur(metin) {

    return metin

      .toLowerCase()

      .replace(/ğ/g, "g")
      .replace(/ü/g, "u")
      .replace(/ş/g, "s")
      .replace(/ı/g, "i")
      .replace(/ö/g, "o")
      .replace(/ç/g, "c")

      .replace(/[^a-z0-9\s-]/g, "")

      .trim()

      .replace(/\s+/g, "-")

      .replace(/-+/g, "-");

  }


  document
    .getElementById("articleTitle")
    .addEventListener(
      "input",
      function () {

        if (!duzenlenenYaziId) {

          const slug =
            slugOlustur(this.value);

          document
            .getElementById("articleSlug")
            .value = slug;

          document
            .getElementById("slugPreview")
            .textContent = slug;

        }

      }
    );


  document
    .getElementById("articleSlug")
    .addEventListener(
      "input",
      function () {

        const slug =
          slugOlustur(this.value);

        this.value = slug;

        document
          .getElementById("slugPreview")
          .textContent = slug;

      }
    );


  /* ==================================================
     FOTOĞRAF ÖNİZLEME
  ================================================== */

  photoInput.addEventListener(
    "change",
    function () {

      const file =
        this.files[0];

      if (!file) {
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        function (e) {

          photoPreview.innerHTML =
            `<img src="${e.target.result}" alt="Kapak fotoğrafı">`;

        };

      reader.readAsDataURL(file);

    }
  );


  /* ==================================================
     MESAJ
  ================================================== */

  function mesajGoster(
    text,
    type
  ) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* ==================================================
     YAZARLARI GETİR
  ================================================== */

  async function yazarlariGetir() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("yazarlar")
        .select("id, ad_soyad")
        .order(
          "ad_soyad",
          {
            ascending: true
          }
        );


    if (error) {

      mesajGoster(
        "Yazarlar yüklenemedi: " +
        error.message,
        "error"
      );

      return;

    }


    const select =
      document.getElementById(
        "articleAuthor"
      );


    data.forEach(
      function (author) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          author.id;

        option.textContent =
          author.ad_soyad;

        select.appendChild(
          option
        );

      }
    );

  }


  /* ==================================================
     YAZI KAYDET
  ================================================== */

  async function yaziKaydet() {

    const title =
      document
        .getElementById("articleTitle")
        .value
        .trim();


    const summary =
      document
        .getElementById("articleSummary")
        .value
        .trim();


    const authorId =
      document
        .getElementById("articleAuthor")
        .value;


    const category =
      document
        .getElementById("articleCategory")
        .value
        .trim();


    const content =
      document
        .getElementById("articleContent")
        .value
        .trim();


    const slug =
      document
        .getElementById("articleSlug")
        .value
        .trim();


    const status =
      document
        .getElementById("articleStatus")
        .value;


    const photoFile =
      photoInput.files[0];


    if (!title) {

      mesajGoster(
        "Lütfen yazının başlığını yaz.",
        "error"
      );

      return;

    }


    if (!content) {

      mesajGoster(
        "Lütfen yazının içeriğini yaz.",
        "error"
      );

      return;

    }


    if (!slug) {

      mesajGoster(
        "Lütfen slug oluştur.",
        "error"
      );

      return;

    }


    saveButton.disabled = true;

    saveButton.textContent =
      "KAYDEDİLİYOR...";


    try {

      let fotografUrl =
        mevcutFotografUrl;


      /* ==========================================
         FOTOĞRAF YÜKLE
      ========================================== */

      if (photoFile) {

        const uzanti =
          photoFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const dosyaAdi =
          slug +
          "-" +
          Date.now() +
          "." +
          uzanti;


        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("kose-yazilari")
            .upload(
              dosyaAdi,
              photoFile,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (uploadError) {

          throw uploadError;

        }


        const {
          data: publicUrlData
        } =
          supabaseClient
            .storage
            .from("kose-yazilari")
            .getPublicUrl(
              dosyaAdi
            );


        fotografUrl =
          publicUrlData.publicUrl;

      }


      /* ==========================================
         YENİ YAZI
      ========================================== */

      if (!duzenlenenYaziId) {

        const {
          error
        } =
          await supabaseClient
            .from("kose_yazilari")
            .insert({

              baslik: title,

              ozet:
                summary || null,

              icerik:
                content,

              yazar_id:
                authorId
                ? Number(authorId)
                : null,

              kapak_fotografi_url:
                fotografUrl,

              kategori:
                category || "Köşe Yazısı",

              slug:
                slug,

              durum:
                status,

              yayin_tarihi:
                status === "yayinda"
                  ? new Date().toISOString()
                  : null

            });


        if (error) {

          throw error;

        }

      }


      /* ==========================================
         MEVCUT YAZIYI GÜNCELLE
      ========================================== */

      else {

        const {
          error
        } =
          await supabaseClient
            .from("kose_yazilari")
            .update({

              baslik: title,

              ozet:
                summary || null,

              icerik:
                content,

              yazar_id:
                authorId
                ? Number(authorId)
                : null,

              kapak_fotografi_url:
                fotografUrl,

              kategori:
                category || "Köşe Yazısı",

              slug:
                slug,

              durum:
                status,

              yayin_tarihi:
                status === "yayinda"
                  ? new Date().toISOString()
                  : null

            })
            .eq(
              "id",
              duzenlenenYaziId
            );


        if (error) {

          throw error;

        }

      }


      mesajGoster(
        duzenlenenYaziId
          ? "Yazı başarıyla güncellendi."
          : "Yazı başarıyla kaydedildi.",
        "success"
      );


      formTemizle();

      await yazilariGetir();

    }

    catch (error) {

      console.error(
        "Yazı kaydetme hatası:",
        error
      );

      mesajGoster(
        "Yazı kaydedilemedi: " +
        error.message,
        "error"
      );

    }

    finally {

      saveButton.disabled = false;

      saveButton.textContent =
        "YAZIYI KAYDET";

    }

  }


  /* ==================================================
     YAZILARI GETİR
  ================================================== */

  async function yazilariGetir() {

    const list =
      document.getElementById(
        "articlesList"
      );


    const {
      data,
      error
    } =
      await supabaseClient
        .from("kose_yazilari")
        .select(`
          *,
          yazarlar (
            ad_soyad
          )
        `)
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (error) {

      list.innerHTML =
        `<div class="empty">
          Yazılar yüklenemedi:
          ${guvenliMetin(error.message)}
        </div>`;

      return;

    }


    if (!data || data.length === 0) {

      list.innerHTML =
        `<div class="empty">
          Henüz kayıtlı köşe yazısı bulunmuyor.
        </div>`;

      return;

    }


    list.innerHTML = "";


    data.forEach(
      function (article) {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "article-card";


        const statusClass =
          article.durum === "yayinda"
            ? "status-yayinda"
            : "status-taslak";


        const statusText =
          article.durum === "yayinda"
            ? "YAYINDA"
            : "TASLAK";


        const authorName =
          article.yazarlar
            ? article.yazarlar.ad_soyad
            : "Yazar belirtilmedi";


        card.innerHTML = `

          <div class="status-badge ${statusClass}">
            ${statusText}
          </div>

          <h3>
            ${guvenliMetin(article.baslik)}
          </h3>

          <div class="article-meta">
            ${guvenliMetin(authorName)}
          </div>

          <div class="article-summary">
            ${guvenliMetin(
              article.ozet || "Özet eklenmedi."
            )}
          </div>

          <div class="article-meta">
            /kose-yazilari/${guvenliMetin(article.slug)}
          </div>

          <div class="card-buttons">

            <button
              class="card-button"
              onclick="yaziDuzenle(${article.id})"
            >
              DÜZENLE
            </button>

            <button
              class="card-button delete-button"
              onclick="yaziSil(${article.id})"
            >
              SİL
            </button>

          </div>

        `;


        list.appendChild(card);

      }
    );

  }


  /* ==================================================
     YAZI DÜZENLE
  ================================================== */

  async function yaziDuzenle(id) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("kose_yazilari")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {

      mesajGoster(
        "Yazı yüklenemedi: " +
        error.message,
        "error"
      );

      return;

    }


    duzenlenenYaziId =
      data.id;


    mevcutFotografUrl =
      data.kapak_fotografi_url;


    document
      .getElementById("articleTitle")
      .value =
        data.baslik || "";


    document
      .getElementById("articleSummary")
      .value =
        data.ozet || "";


    document
      .getElementById("articleAuthor")
      .value =
        data.yazar_id || "";


    document
      .getElementById("articleCategory")
      .value =
        data.kategori || "Köşe Yazısı";


    document
      .getElementById("articleContent")
      .value =
        data.icerik || "";


    document
      .getElementById("articleSlug")
      .value =
        data.slug || "";


    document
      .getElementById("slugPreview")
      .textContent =
        data.slug || "";


    document
      .getElementById("articleStatus")
      .value =
        data.durum || "taslak";


    if (data.kapak_fotografi_url) {

      photoPreview.innerHTML =
        `<img
          src="${guvenliMetin(data.kapak_fotografi_url)}"
          alt="Kapak fotoğrafı"
        >`;

    }

    else {

      photoPreview.innerHTML =
        "📰";

    }


    document
      .getElementById("formTitle")
      .textContent =
        "Köşe Yazısını Düzenle";


    saveButton.textContent =
      "DEĞİŞİKLİKLERİ KAYDET";


    document
      .getElementById("cancelButton")
      .style.display =
        "inline-block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* ==================================================
     YAZI SİL
  ================================================== */

  async function yaziSil(id) {

    const onay =
      confirm(
        "Bu köşe yazısını silmek istediğine emin misin?"
      );


    if (!onay) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("kose_yazilari")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      mesajGoster(
        "Yazı silinemedi: " +
        error.message,
        "error"
      );

      return;

    }


    mesajGoster(
      "Yazı başarıyla silindi.",
      "success"
    );


    await yazilariGetir();

  }

     FORM TEMİZLE
  ================================================== */

      .getElementById("articleSummary")

    document
      .getElementById("articleAuthor")
      .value = "";


    document
      .getElementById("articleCategory")
      .value =
        "Köşe Yazısı";


    document
      .getElementById("articleContent")
      .value = "";


    document
      .getElementById("articleSlug")
      .value = "";


    document

    document

    photoInput.value = "";

    photoPreview.innerHTML =

    document
      .getElementById("formTitle")

  }


  /* ==================================================
     GÜVENLİ METİN
  ================================================== */

  function guvenliMetin(metin) {

    const div =
      document.createElement("div");

    div.textContent =
      metin == null
        ? ""
        : String(metin);

    return div.innerHTML;

  }


  /* ==================================================
     BAŞLANGIÇ
  ================================================== */

  yazarlariGetir();

  yazilariGetir();

</script>
