</main>

<script>
    /*
     * ==================================================
     * KARŞI — DÜNYA HABERLERİ YÖNETİM PANELİ
     * RSS tabanlı sistem
     * AI YOK
     * ==================================================
     */

    const db = window.supabaseClient;

    const durumEl =
        document.getElementById("durum");

    const haberlerEl =
        document.getElementById("haberler");

    const toplamHaberEl =
        document.getElementById("toplamHaber");

    const yayindaHaberEl =
        document.getElementById("yayindaHaber");

    const taslakHaberEl =
        document.getElementById("taslakHaber");

    const taraBtn =
        document.getElementById("taraBtn");

    const yenileBtn =
        document.getElementById("yenileBtn");

    const cikisBtn =
        document.getElementById("cikisBtn");


    /*
     * ==================================================
     * DURUM MESAJI
     * ==================================================
     */

    function durumGoster(
        mesaj,
        tip = ""
    ) {
        durumEl.innerHTML =
            `<strong>Durum</strong>
             <span class="${tip}">${mesaj}</span>`;
    }


    /*
     * ==================================================
     * HABERLERİ GETİR
     * ==================================================
     */

    async function haberleriGetir() {

        try {

            durumGoster(
                "Haberler yükleniyor..."
            );

            const {
                data,
                error
            } = await db
                .from("dunya_haberleri")
                .select(`
                    id,
                    baslik,
                    ozet,
                    icerik,
                    slug,
                    kategori,
                    ulke,
                    kaynak_adi,
                    kaynak_url,
                    kapak_fotografi_url,
                    durum,
                    yayin_tarihi,
                    ai_uretti,
                    ai_model,
                    ai_ozet,
                    created_at,
                    updated_at
                `)
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );

            if (error) {
                throw error;
            }

            const haberler =
                data || [];

            istatistikleriGuncelle(
                haberler
            );

            haberleriEkranaBas(
                haberler
            );

            durumGoster(
                `${haberler.length} haber başarıyla yüklendi.`,
                "basarili"
            );

        } catch (error) {

            console.error(
                "Haberler alınamadı:",
                error
            );

            durumGoster(
                "Haberler alınırken hata oluştu: " +
                (error.message || error),
                "hata"
            );

            haberlerEl.innerHTML = `
                <div class="bos hata">
                    Haberler yüklenemedi.
                    <br><br>
                    Tarayıcı konsolunu kontrol edin.
                </div>
            `;
        }
    }


    /*
     * ==================================================
     * İSTATİSTİKLER
     * ==================================================
     */

    function istatistikleriGuncelle(
        haberler
    ) {

        const toplam =
            haberler.length;

        const yayinda =
            haberler.filter(
                haber =>
                    haber.durum === "yayinda"
            ).length;

        const taslak =
            haberler.filter(
                haber =>
                    haber.durum === "taslak"
            ).length;

        toplamHaberEl.textContent =
            toplam;

        yayindaHaberEl.textContent =
            yayinda;

        taslakHaberEl.textContent =
            taslak;
    }


    /*
     * ==================================================
     * HABERLERİ EKRANA BAS
     * ==================================================
     */

    function haberleriEkranaBas(
        haberler
    ) {

        if (!haberler.length) {

            haberlerEl.innerHTML = `
                <div class="bos">
                    Henüz Dünya haberi bulunmuyor.
                </div>
            `;

            return;
        }

        haberlerEl.innerHTML =
            haberler.map(
                haber => {

                    const tarih =
                        haber.created_at
                            ? new Date(
                                haber.created_at
                            ).toLocaleString(
                                "tr-TR"
                            )
                            : "Tarih yok";

                    const kaynak =
                        haber.kaynak_url
                            ? `
                                <a
                                    href="${guvenliHtml(
                                        haber.kaynak_url
                                    )}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    Kaynağı aç
                                </a>
                              `
                            : "Kaynak bağlantısı yok";

                    return `
                        <article class="haber">

                            <h2>
                                ${guvenliHtml(
                                    haber.baslik ||
                                    "Başlıksız haber"
                                )}
                            </h2>

                            <div class="haber-meta">

                                <span class="etiket">
                                    ${guvenliHtml(
                                        haber.kategori ||
                                        "Dünya"
                                    )}
                                </span>

                                <span class="etiket">
                                    ${guvenliHtml(
                                        haber.ulke ||
                                        "Dünya"
                                    )}
                                </span>

                                <span class="etiket">
                                    ${guvenliHtml(
                                        haber.durum ||
                                        "taslak"
                                    )}
                                </span>

                                <span class="etiket">
                                    ${guvenliHtml(
                                        haber.kaynak_adi ||
                                        "Bilinmiyor"
                                    )}
                                </span>

                            </div>

                            <div class="haber-ozet">
                                ${guvenliHtml(
                                    haber.ozet ||
                                    "Özet bulunmuyor."
                                )}
                            </div>

                            <div class="haber-kaynak">
                                <strong>Eklenme:</strong>
                                ${tarih}
                                <br>
                                <strong>Kaynak:</strong>
                                ${kaynak}
                            </div>

                        </article>
                    `;
                }
            )
            .join("");
    }


    /*
     * ==================================================
     * HTML GÜVENLİĞİ
     * ==================================================
     */

    function guvenliHtml(
        deger
    ) {

        if (
            deger === null ||
            deger === undefined
        ) {
            return "";
        }

        return String(deger)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /*
     * ==================================================
     * DÜNYA HABERLERİNİ TARA
     * ==================================================
     */

    async function dunyayiTara() {

        taraBtn.disabled = true;

        taraBtn.textContent =
            "🌍 Taranıyor...";

        durumGoster(
            "RSS kaynakları taranıyor. Lütfen bekleyin..."
        );

        try {

            const {
                data,
                error
            } = await db.functions.invoke(
                "dunya-haberlerini-tara",
                {
                    method: "POST",
                    body: {}
                }
            );

            if (error) {
                throw error;
            }

            console.log(
                "RSS tarama sonucu:",
                data
            );

            if (
                !data ||
                data.success !== true
            ) {
                throw new Error(
                    data?.message ||
                    "RSS taraması başarısız oldu."
                );
            }

            durumGoster(
                data.message ||
                "RSS taraması tamamlandı.",
                "basarili"
            );

            await haberleriGetir();

        } catch (error) {

            console.error(
                "Dünya haber tarama hatası:",
                error
            );

            durumGoster(
                "RSS taraması başarısız: " +
                (
                    error?.message ||
                    String(error)
                ),
                "hata"
            );

        } finally {

            taraBtn.disabled = false;

            taraBtn.textContent =
                "🌍 Dünyayı Tara";
        }
    }


    /*
     * ==================================================
     * BUTONLAR
     * ==================================================
     */

    taraBtn.addEventListener(
        "click",
        dunyayiTara
    );

    yenileBtn.addEventListener(
        "click",
        haberleriGetir
    );

    cikisBtn.addEventListener(
        "click",
        async () => {

            await window.cikisYap();

        }
    );


    /*
     * ==================================================
     * SAYFA BAŞLANGICI
     * ==================================================
     */

    async function dunyaPanelBaslat() {

        if (!db) {

            durumGoster(
                "Supabase bağlantısı bulunamadı.",
                "hata"
            );

            return;
        }

        const session =
            await window.yoneticiOturumuKontrolEt();

        if (!session) {
            return;
        }

        await haberleriGetir();
    }


    dunyaPanelBaslat();

</script>
