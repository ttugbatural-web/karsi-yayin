<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="auth.js"></script>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
    "https://rfqiffvudbmphvklxetf.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==================================================
   DEĞİŞKENLER
================================================== */

let duzenlenenHaberId = null;


/* ==================================================
   ELEMENTLER
================================================== */

const saveButton =
    document.getElementById("saveButton");


/* ==================================================
   SLUG
================================================== */

function slugOlustur(metin) {

    return metin
        .toLowerCase()
        .replace(/ğ/g, "g")
        .replace(/ü/g, "u")
        .replace(/ş/g, "s")
        .replace(/ı/g, "i")
        .replace(/ö/g, "o")
        .replace(/ç/g, "c")
        .replace(/[^a-z0-9\s-]/g, "")
        .trim()
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-");

}


document
    .getElementById("articleTitle")
    .addEventListener(
        "input",
        function() {

            if (!duzenlenenHaberId) {

                const slug =
                    slugOlustur(this.value);

                document
                    .getElementById("articleSlug")
                    .value =
                    slug;

                document
                    .getElementById("slugPreview")
                    .textContent =
                    slug;

            }

        }
    );


document
    .getElementById("articleSlug")
    .addEventListener(
        "input",
        function() {

            const slug =
                slugOlustur(this.value);

            this.value =
                slug;

            document
                .getElementById("slugPreview")
                .textContent =
                slug;

        }
    );


/* ==================================================
   MESAJ
================================================== */

function mesajGoster(
    text,
    type
) {

    const message =
        document.getElementById("message");

    message.textContent =
        text;

    message.className =
        "message " + type;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==================================================
   HABER KAYDET
================================================== */

async function haberKaydet() {

    const title =
        document
            .getElementById("articleTitle")
            .value
            .trim();


    const summary =
        document
            .getElementById("articleSummary")
            .value
            .trim();


    const content =
        document
            .getElementById("articleContent")
            .value
            .trim();


    const category =
        document
            .getElementById("articleCategory")
            .value
            .trim();


    const country =
        document
            .getElementById("articleCountry")
            .value
            .trim();


    const source =
        document
            .getElementById("articleSource")
            .value
            .trim();


    const sourceUrl =
        document
            .getElementById("articleSourceUrl")
            .value
            .trim();


    const imageUrl =
        document
            .getElementById("articleImage")
            .value
            .trim();


    const slug =
        document
            .getElementById("articleSlug")
            .value
            .trim();


    const status =
        document
            .getElementById("articleStatus")
            .value;


    const aiUretti =
        document
            .getElementById("articleAI")
            .value === "true";


    /* =========================
       KONTROLLER
    ========================= */

    if (!title) {

        mesajGoster(
            "Lütfen haber başlığını yaz.",
            "error"
        );

        return;

    }


    if (!content) {

        mesajGoster(
            "Lütfen haber içeriğini yaz.",
            "error"
        );

        return;

    }


    if (!slug) {

        mesajGoster(
            "Lütfen slug oluştur.",
            "error"
        );

        return;

    }


    saveButton.disabled = true;

    saveButton.textContent =
        "KAYDEDİLİYOR...";


    try {

        const haberVerisi = {

            baslik:
                title,

            ozet:
                summary || null,

            icerik:
                content,

            slug:
                slug,

            kategori:
                category || "Dünya",

            ulke:
                country || null,

            kaynak_adi:
                source || null,

            kaynak_url:
                sourceUrl || null,

            kapak_fotografi_url:
                imageUrl || null,

            durum:
                status,

            ai_uretti:
                aiUretti

        };


        /* =========================
           YENİ HABER
        ========================= */

        if (!duzenlenenHaberId) {

            if (status === "yayinda") {

                haberVerisi.yayin_tarihi =
                    new Date().toISOString();

            }


            const {
                error
            } =
                await supabaseClient
                    .from("dunya_haberleri")
                    .insert(
                        haberVerisi
                    );


            if (error) {

                throw error;

            }

        }


        /* =========================
           GÜNCELLE
        ========================= */

        else {

            if (status === "yayinda") {

                haberVerisi.yayin_tarihi =
                    new Date().toISOString();

            }

            else {

                haberVerisi.yayin_tarihi =
                    null;

            }


            const {
                error
            } =
                await supabaseClient
                    .from("dunya_haberleri")
                    .update(
                        haberVerisi
                    )
                    .eq(
                        "id",
                        duzenlenenHaberId
                    );


            if (error) {

                throw error;

            }

        }


        mesajGoster(
            duzenlenenHaberId
                ? "Haber başarıyla güncellendi."
                : "Haber başarıyla kaydedildi.",
            "success"
        );


        formTemizle();

        await haberleriGetir();

    }

    catch (error) {

        console.error(
            "Haber kaydetme hatası:",
            error
        );

        mesajGoster(
            "Haber kaydedilemedi: " +
            error.message,
            "error"
        );

    }

    finally {

        saveButton.disabled = false;

        saveButton.textContent =
            "HABERİ KAYDET";

    }

}


/* ==================================================
   HABERLERİ GETİR
================================================== */

async function haberleriGetir() {

    const list =
        document.getElementById(
            "articlesList"
        );


    const {
        data,
        error
    } =
        await supabaseClient
            .from("dunya_haberleri")
            .select("*")
            .order(
                "id",
                {
                    ascending: false
                }
            );


    if (error) {

        list.innerHTML =
            `<div class="empty">
                Haberler yüklenemedi:
                ${guvenliMetin(error.message)}
            </div>`;

        return;

    }


    if (!data || data.length === 0) {

        list.innerHTML =
            `<div class="empty">
                Henüz kayıtlı dünya haberi bulunmuyor.
            </div>`;

        return;

    }


    list.innerHTML = "";


    data.forEach(
        function(haber) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "article-card";


            const statusClass =
                haber.durum === "yayinda"
                    ? "status-yayinda"
                    : "status-taslak";


            const statusText =
                haber.durum === "yayinda"
                    ? "YAYINDA"
                    : "TASLAK";


            card.innerHTML = `

                <div class="status-badge ${statusClass}">
                    ${statusText}
                </div>

                ${
                    haber.ai_uretti
                        ? `
                            <div class="ai-badge">
                                🤖 AI
                            </div>
                          `
                        : ""
                }

                <h3>
                    ${guvenliMetin(
                        haber.baslik
                    )}
                </h3>

                <div class="article-meta">
                    ${guvenliMetin(
                        haber.kategori ||
                        "Dünya"
                    )}

                    ${
                        haber.ulke
                            ? " · " +
                              guvenliMetin(
                                  haber.ulke
                              )
                            : ""
                    }
                </div>

                <div class="article-summary">
                    ${guvenliMetin(
                        haber.ozet ||
                        "Özet eklenmedi."
                    )}
                </div>

                <div class="source">

                    <strong>
                        Kaynak:
                    </strong>

                    ${guvenliMetin(
                        haber.kaynak_adi ||
                        "Belirtilmedi"
                    )}

                    ${
                        haber.kaynak_url
                            ? `
                                <br>
                                <a
                                    href="${guvenliMetin(
                                        haber.kaynak_url
                                    )}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    Kaynağı aç
                                </a>
                              `
                            : ""
                    }

                </div>

                <div class="article-meta">
                    /dunya/${guvenliMetin(
                        haber.slug
                    )}
                </div>

                <div class="card-buttons">

                    <button
                        class="card-button"
                        onclick="haberDuzenle(${haber.id})"
                    >
                        DÜZENLE
                    </button>

                    <button
                        class="card-button delete-button"
                        onclick="haberSil(${haber.id})"
                    >
                        SİL
                    </button>

                </div>

            `;


            list.appendChild(
                card
            );

        }
    );

}


/* ==================================================
   HABER DÜZENLE
================================================== */

async function haberDuzenle(id) {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("dunya_haberleri")
            .select("*")
            .eq(
                "id",
                id
            )
            .single();


    if (error) {

        mesajGoster(
            "Haber yüklenemedi: " +
            error.message,
            "error"
        );

        return;

    }


    duzenlenenHaberId =
        data.id;


    document
        .getElementById("articleTitle")
        .value =
        data.baslik || "";


    document
        .getElementById("articleSummary")
        .value =
        data.ozet || "";


    document
        .getElementById("articleContent")
        .value =
        data.icerik || "";


    document
        .getElementById("articleCategory")
        .value =
        data.kategori || "Dünya";


    document
        .getElementById("articleCountry")
        .value =
        data.ulke || "";


    document
        .getElementById("articleSource")
        .value =
        data.kaynak_adi || "";


    document
        .getElementById("articleSourceUrl")
        .value =
        data.kaynak_url || "";


    document
        .getElementById("articleImage")
        .value =
        data.kapak_fotografi_url || "";


    document
        .getElementById("articleSlug")
        .value =
        data.slug || "";


    document
        .getElementById("slugPreview")
        .textContent =
        data.slug || "";


    document
        .getElementById("articleStatus")
        .value =
        data.durum || "taslak";


    document
        .getElementById("articleAI")
        .value =
        data.ai_uretti
            ? "true"
            : "false";


    document
        .getElementById("formTitle")
        .textContent =
        "Dünya Haberini Düzenle";


    saveButton.textContent =
        "DEĞİŞİKLİKLERİ KAYDET";


    document
        .getElementById("cancelButton")
        .style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==================================================
   HABER SİL
================================================== */

async function haberSil(id) {

    const onay =
        confirm(
            "Bu dünya haberini silmek istediğine emin misin?"
        );


    if (!onay) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("dunya_haberleri")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        mesajGoster(
            "Haber silinemedi: " +
            error.message,
            "error"
        );

        return;

    }


    mesajGoster(
        "Haber başarıyla silindi.",
        "success"
    );


    await haberleriGetir();

}


/* ==================================================
   FORM TEMİZLE
