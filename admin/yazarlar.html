<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const photoInput =
    document.getElementById(
      "authorPhoto"
    );


  const photoPreview =

    );


  const saveButton =

    );


  let duzenlenenYazarId = null;

  let mevcutFotografUrl = null;


  /*
   * ==================================================
   * FOTOĞRAF ÖNİZLEME
   * ==================================================
   */

  photoInput.addEventListener(
    "change",
    function () {

      const file =
        this.files[0];

      if (!file) {
        return;
      }


      if (
        file.type !== "image/jpeg" &&
        file.type !== "image/png"
      ) {

        mesajGoster(
          "Sadece JPG veya PNG fotoğraf kullanabilirsin.",
          "error"
        );

        this.value = "";

        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function (e) {

          photoPreview.innerHTML =
            `<img
              src="${e.target.result}"
              alt="Fotoğraf önizleme"
            >`;

        };


      reader.readAsDataURL(file);

    }
  );


  /*
   * ==================================================
   * YAZAR KAYDET
   * ==================================================
   */

  async function yazarKaydet() {

    const name =
      document
        .getElementById("authorName")
        .value
        .trim();


    const bio =
      document
        .getElementById("authorBio")
        .value
        .trim();


    const photoFile =
      photoInput.files[0];


    if (!name) {

      mesajGoster(
        "Lütfen yazarın adını yaz.",
        "error"
      );

      return;

    }


    const slug =
      slugOlustur(name);


    saveButton.disabled = true;

    saveButton.textContent =
      "KAYDEDİLİYOR...";


    try {

      let fotografUrl =
        mevcutFotografUrl;


      /*
       * ==========================================
       * YENİ FOTOĞRAF YÜKLE
       * ==========================================
       */

      if (photoFile) {

        const uzanti =
          photoFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const dosyaAdi =
          slug +
          "-" +
          Date.now() +
          "." +
          uzanti;


        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("yazar-fotograflari")
            .upload(
              dosyaAdi,
              photoFile,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (uploadError) {

          throw uploadError;

        }


        const {
          data: publicUrlData
        } =
          supabaseClient
            .storage
            .from("yazar-fotograflari")
            .getPublicUrl(
              dosyaAdi
            );


        fotografUrl =
          publicUrlData.publicUrl;

      }


      /*
       * ==========================================
       * DÜZENLEME
       * ==========================================
       */

      if (duzenlenenYazarId) {

        const {
          error
        } =
          await supabaseClient
            .from("yazarlar")
            .update({

              ad_soyad: name,

              biyografi:
                bio || null,

              fotograf_url:
                fotografUrl,

              slug:
                slug

            })
            .eq(
              "id",
              duzenlenenYazarId
            );


        if (error) {

          throw error;

        }


        /*
         * Eski fotoğrafı Storage'dan sil
         * ancak yeni fotoğraf yüklenmişse.
         */

        if (
          photoFile &&
          mevcutFotografUrl &&
          mevcutFotografUrl !== fotografUrl
        ) {

          await eskiFotografiSil(
            mevcutFotografUrl
          );

        }


        mesajGoster(
          "Yazar başarıyla güncellendi.",
          "success"
        );

      }


      /*
       * ==========================================
       * YENİ KAYIT
       * ==========================================
       */

      else {

        const {
          error
        } =
          await supabaseClient
            .from("yazarlar")
            .insert({

              ad_soyad: name,

              biyografi:
                bio || null,

              fotograf_url:
                fotografUrl,

              slug:
                slug

            });


        if (error) {

          throw error;

        }


        mesajGoster(
          "Yazar başarıyla kaydedildi.",
          "success"
        );

      }


      formuTemizle();

      await yazarlariGetir();

    }

    catch (error) {

      console.error(
        "Yazar kaydetme hatası:",
        error
      );


      mesajGoster(
        "Yazar kaydedilemedi: " +
        error.message,
        "error"
      );

    }

    finally {

      saveButton.disabled = false;

      saveButton.textContent =
        "YAZARI KAYDET";

    }

  }


  /*
   * ==================================================
   * YAZARLARI GETİR
   * ==================================================
   */

  async function yazarlariGetir() {

    const list =
      document.getElementById(
        "authorsList"
      );


    const {
      data,
      error
    } =
      await supabaseClient
        .from("yazarlar")
        .select("*")
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        "Yazarları getirme hatası:",
        error
      );


      list.innerHTML =
        `<div class="empty">
          Yazarlar yüklenemedi:
          ${guvenliMetin(error.message)}
        </div>`;

      return;

    }


    if (!data || data.length === 0) {

      list.innerHTML =
        `<div class="empty">
          Henüz kayıtlı yazar bulunmuyor.
        </div>`;

      return;

    }


    list.innerHTML = "";


    data.forEach(
      function (author) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "author-card";


        const image =
          author.fotograf_url

          ? `<img
               src="${guvenliMetin(
                 author.fotograf_url
               )}"
               alt="${guvenliMetin(
                 author.ad_soyad
               )}"
             >`

          : "👤";


        card.innerHTML = `

          <div class="author-top">

            <div class="author-photo">
              ${image}
            </div>

            <div class="author-info">

              <h3>
                ${guvenliMetin(
                  author.ad_soyad
                )}
              </h3>

              <p>
                ${guvenliMetin(
                  author.biyografi ||
                  "Biyografi eklenmedi."
                )}
              </p>

              <div class="author-slug">
                /${guvenliMetin(
                  author.slug || ""
                )}
              </div>

            </div>

          </div>


          <div class="author-actions">

            <button
              class="edit-button"
              onclick="yazarDuzenle(
                '${guvenliJavascript(
                  author.id
                )}'
              )"
            >
              DÜZENLE
            </button>


            <button
              class="delete-button"
              onclick="yazarSil(
                '${guvenliJavascript(
                  author.id
                )}',
                '${guvenliJavascript(
                  author.ad_soyad
                )}',
                '${guvenliJavascript(
                  author.fotograf_url || ""
                )}'
              )"
            >
              SİL
            </button>

          </div>

        `;


        list.appendChild(card);

      }
    );

  }


  /*
   * ==================================================
   * YAZAR DÜZENLE
   * ==================================================
   */

  async function yazarDuzenle(id) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("yazarlar")
        .select("*")
        .eq(
          "id",
          id
        )
        .single();


    if (error) {

      mesajGoster(
        "Yazar bilgileri alınamadı: " +
        error.message,
        "error"
      );

      return;

    }


    duzenlenenYazarId =
      data.id;


    mevcutFotografUrl =
      data.fotograf_url;


    document
      .getElementById(
        "authorName"
      )
      .value =
      data.ad_soyad || "";


    document
      .getElementById(
        "authorBio"
      )
      .value =
      data.biyografi || "";


    if (data.fotograf_url) {

      photoPreview.innerHTML =
        `<img
          src="${guvenliMetin(
            data.fotograf_url
          )}"
          alt="Mevcut fotoğraf"
        >`;

    } else {

      photoPreview.innerHTML =
        "👤";

    }


    formTitle.textContent =
      "Yazarı Düzenle";


    saveButton.textContent =
      "DEĞİŞİKLİKLERİ KAYDET";


    cancelButton.style.display =
      "inline-block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /*
   * ==================================================
   * DÜZENLEMEYİ İPTAL
   * ==================================================
   */

  function duzenlemeyiIptalEt() {

    formuTemizle();

  }


  /*
   * ==================================================
   * FORMU TEMİZLE
   * ==================================================
   */

  function formuTemizle() {

    document
      .getElementById(
        "authorName"
      )
      .value = "";


    document
      .getElementById(
        "authorBio"
      )
      .value = "";


    photoInput.value = "";


    photoPreview.innerHTML =
      "👤";


    duzenlenenYazarId =
      null;


    mevcutFotografUrl =
      null;


    formTitle.textContent =
      "Yeni Yazar Ekle";


    saveButton.textContent =
      "YAZARI KAYDET";


    cancelButton.style.display =
      "none";

  }


  /*
   * ==================================================
   * YAZAR SİL
   * ==================================================
   */

  async function yazarSil(
    id,
    name,
    fotografUrl
  ) {

    const onay =
      confirm(
        `"${name}" adlı yazarı silmek istediğine emin misin?\n\nBu işlem geri alınamaz.`
      );


    if (!onay) {
      return;
    }


    try {

      /*
       * Önce veritabanından sil.
       */

      const {
        error
      } =
        await supabaseClient
          .from("yazarlar")
          .delete()
          .eq(
            "id",
            id
          );


      if (error) {

        throw error;

      }


      /*
       * Sonra fotoğrafı Storage'dan sil.
       */

      if (fotografUrl) {

        await eskiFotografiSil(
          fotografUrl
        );

      }


      mesajGoster(
        "Yazar başarıyla silindi.",
        "success"
      );


      await yazarlariGetir();

    }

    catch (error) {

      console.error(
        "Yazar silme hatası:",
        error
      );


      mesajGoster(
        "Yazar silinemedi: " +
        error.message,
        "error"
      );

    }

  }


  /*
   * ==================================================
   * STORAGE FOTOĞRAF SİL
   * ==================================================
   */

  async function eskiFotografiSil(
    fotografUrl
  ) {

    try {

      const url =
        new URL(
          fotografUrl
        );


      const marker =
        "/storage/v1/object/public/yazar-fotograflari/";


      const index =
        url.pathname.indexOf(
          marker
        );


      if (index === -1) {

        return;

      }


      const dosyaYolu =
        decodeURIComponent(
          url.pathname.substring(
            index + marker.length
          )
        );


      await supabaseClient
        .storage
        .from("yazar-fotograflari")
        .remove([
          dosyaYolu
        ]);

    }

    catch (error) {

      console.error(
        "Eski fotoğraf silinemedi:",
        error
      );

    }

  }


  /*
   * ==================================================
   * SLUG OLUŞTUR
   * ==================================================
   */

  function slugOlustur(
    metin
  ) {

    return metin
      .toLowerCase()
      .trim()

      .replace(
        /ğ/g,
        "g"
      )

      .replace(
        /ü/g,
        "u"
      )

      .replace(
        /ş/g,
        "s"
      )

      .replace(
        /ı/g,
        "i"
      )

      .replace(
        /ö/g,
        "o"
      )

      .replace(
        /ç/g,
        "c"
      )

      .replace(
        /[^a-z0-9]+/g,
        "-"
      )

      .replace(
        /^-+|-+$/g,
        ""
      );

  }


  /*
   * ==================================================
   * GÜVENLİ METİN
   * ==================================================
   */

  function guvenliMetin(
    metin
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      metin == null
        ? ""
        : String(metin);


    return div.innerHTML;

  }


  /*
   * ==================================================
   * JAVASCRIPT İÇİN GÜVENLİ METİN
   * ==================================================
   */

  function guvenliJavascript(
    metin
  ) {

    return String(
      metin == null
        ? ""
        : metin
    )
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      )
      .replace(
        /"/g,
