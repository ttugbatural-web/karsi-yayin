<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yazarlar — KARŞI Yönetim</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f0;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      border-bottom: 4px solid #c40000;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .logo {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: -2px;
    }

    .back {
      color: white;
      text-decoration: none;

      border: 1px solid #555;

      padding: 8px 12px;

      font-size: 12px;
    }

    .back:hover {
      background: white;
      color: #111;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .page-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      margin-bottom: 8px;
    }

    .page-description {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-box {
      background: white;
      border: 1px solid #ddd;
      padding: 25px;
      margin-bottom: 35px;
    }

    .form-box h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      border: 1px solid #ccc;
      padding: 12px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      outline: none;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #111;
    }

    .photo-area {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .photo-preview {
      width: 90px;
      height: 90px;

      border-radius: 50%;

      background: #ddd;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      flex-shrink: 0;

      font-size: 30px;
      color: #777;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-info {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    .photo-info input {
      margin-top: 8px;
    }

    .button-area {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .save-button {
      background: #111;
      color: white;
      border: none;

      padding: 13px 20px;

      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;

      cursor: pointer;
    }

    .save-button:hover {
      background: #c40000;
    }

    .cancel-button {
      background: #ddd;
      color: #111;

      border: none;

      padding: 13px 20px;

      font-size: 12px;
      font-weight: bold;

      cursor: pointer;

      display: none;
    }

    .cancel-button:hover {
      background: #bbb;
    }

    .message {
      padding: 14px 16px;
      margin-bottom: 25px;

      font-size: 13px;

      display: none;
    }

    .message.success {
      display: block;

      background: #e7f4e7;
      color: #246024;

      border-left: 4px solid #2d8a2d;
    }

    .message.error {
      display: block;

      background: #f7e4e4;
      color: #8b0000;

      border-left: 4px solid #c40000;
    }

    .authors-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      margin-bottom: 15px;
    }

    .authors {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .author-card {
      background: white;
      border: 1px solid #ddd;
      padding: 20px;

      display: flex;
      gap: 15px;

      align-items: flex-start;
    }

    .author-photo {
      width: 80px;
      height: 80px;

      border-radius: 50%;

      background: #ddd;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      flex-shrink: 0;

      font-size: 28px;
      color: #777;
    }

    .author-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .author-info {
      flex: 1;
      min-width: 0;
    }

    .author-info h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      margin-bottom: 6px;
    }

    .author-info p {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 7px;
    }

    .author-slug {
      color: #999;
      font-size: 11px;
      margin-bottom: 12px;
    }

    .author-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .edit-button,
    .delete-button {
      border: none;
      padding: 8px 11px;

      font-size: 11px;
      font-weight: bold;

      cursor: pointer;
    }

    .edit-button {
      background: #111;
      color: white;
    }

    .edit-button:hover {
      background: #444;
    }

    .delete-button {
      background: #eee;
      color: #a00000;
    }

    .delete-button:hover {
      background: #c40000;
      color: white;
    }

    .empty {
      background: white;
      border: 1px solid #ddd;
      padding: 25px;

      color: #777;
      font-size: 14px;
    }

    footer {
      margin-top: 60px;

      background: #111;
      color: #999;

      text-align: center;

      padding: 25px;

      font-size: 12px;
    }

    @media (max-width: 750px) {

      .authors {
        grid-template-columns: 1fr;
      }

      .page-title {
        font-size: 32px;
      }

      .form-box {
        padding: 20px;
      }

      .author-card {
        padding: 16px;
      }

      .photo-area {
        align-items: flex-start;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="header-inner">

    <div class="logo">
      KARŞI
    </div>

    <a
      class="back"
      href="index.html"
    >
      ← Yönetim Paneli
    </a>

  </div>

</header>


<main>


  <h1 class="page-title">
    Yazarlar
  </h1>


  <p class="page-description">
    KARŞI'da yazacak yazarları buradan yöneteceğiz.
  </p>


  <div
    id="message"
    class="message"
  ></div>


  <section class="form-box">

    <h2 id="formTitle">
      Yeni Yazar Ekle
    </h2>


    <div class="form-group">

      <label>
        AD SOYAD
      </label>

      <input
        type="text"
        id="authorName"
        placeholder="Örn. Taylan Özgür Tural"
      >

    </div>


    <div class="form-group">

      <label>
        KISA BİYOGRAFİ
      </label>

      <textarea
        id="authorBio"
        placeholder="Yazar hakkında kısa bilgi..."
      ></textarea>

    </div>


    <div class="form-group">

      <label>
        FOTOĞRAF
      </label>


      <div class="photo-area">

        <div
          class="photo-preview"
          id="photoPreview"
        >
          👤
        </div>


        <div class="photo-info">

          Profil fotoğrafını seç.

          <br>

          JPG veya PNG kullanabilirsin.

          <br>

          <input
            type="file"
            id="authorPhoto"
            accept="image/jpeg,image/png"
          >

        </div>

      </div>

    </div>


    <div class="button-area">

      <button
        class="save-button"
        id="saveButton"
        onclick="yazarKaydet()"
      >
        YAZARI KAYDET
      </button>


      <button
        class="cancel-button"
        id="cancelButton"
        onclick="duzenlemeyiIptalEt()"
      >
        İPTAL
      </button>

    </div>

  </section>


  <h2 class="authors-title">
    Mevcut Yazarlar
  </h2>


  <section
    class="authors"
    id="authorsList"
  >

    <div class="empty">
      Yazarlar yükleniyor...
    </div>

  </section>


</main>


<footer>

  KARŞI — Yönetim Paneli

</footer>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  /* ==================================================
     SUPABASE
  ================================================== */

  const SUPABASE_URL =
    "https://rfqiffvudbmphvklxetf.supabase.co";


  const SUPABASE_ANON_KEY =
    "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* ==================================================
     ELEMENTLER
  ================================================== */

  const photoInput =
    document.getElementById(
      "authorPhoto"
    );


  const photoPreview =
    document.getElementById(
      "photoPreview"
    );


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  const cancelButton =
    document.getElementById(
      "cancelButton"
    );


  const formTitle =
    document.getElementById(
      "formTitle"
    );


  const messageBox =
    document.getElementById(
      "message"
    );


  let duzenlenenYazarId = null;


  /* ==================================================
     MESAJ
  ================================================== */

  function mesajGoster(
    mesaj,
    tip
  ) {

    messageBox.textContent =
      mesaj;

    messageBox.className =
      "message " + tip;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* ==================================================
     SLUG OLUŞTUR
  ================================================== */

  function slugOlustur(
    metin
  ) {

    return metin

      .toLocaleLowerCase(
        "tr-TR"
      )

      .replace(/ğ/g, "g")
      .replace(/ü/g, "u")
      .replace(/ş/g, "s")
      .replace(/ı/g, "i")
      .replace(/ö/g, "o")
      .replace(/ç/g, "c")

      .replace(
        /[^a-z0-9]+/g,
        "-"
      )

      .replace(
        /^-+|-+$/g,
        ""
      );

  }


  /* ==================================================
     GÜVENLİ METİN
  ================================================== */

  function guvenliMetin(
    metin
  ) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      metin == null
        ? ""
        : String(metin);

    return div.innerHTML;

  }


  /* ==================================================
     FOTOĞRAF ÖNİZLEME
  ================================================== */

  photoInput.addEventListener(
    "change",
    function () {

      const file =
        this.files[0];

      if (!file) {
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function (e) {

          photoPreview.innerHTML =
            `<img
              src="${e.target.result}"
              alt="Yazar fotoğrafı"
            >`;

        };


      reader.readAsDataURL(
        file
      );

    }
  );


  /* ==================================================
     FOTOĞRAF YÜKLE
  ================================================== */

  async function fotografYukle(
    file,
    slug
  ) {

    const uzanti =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const dosyaAdi =
      slug +
      "-" +
      Date.now() +
      "." +
      uzanti;


    const {
      error
    } =
      await supabaseClient
        .storage
        .from(
          "yazar-fotograflari"
        )
        .upload(
          dosyaAdi,
          file,
          {
            cacheControl:
              "3600",

            upsert:
              false
          }
        );


    if (error) {

      throw error;

    }


    const {
      data
    } =
      supabaseClient
        .storage
        .from(
          "yazar-fotograflari"
        )
        .getPublicUrl(
          dosyaAdi
        );


    return {
      url:
        data.publicUrl,

      path:
        dosyaAdi

    };

  }


  /* ==================================================
     FOTOĞRAF YOLUNU BUL
  ================================================== */

  function fotografYoluBul(
    url
  ) {

    if (!url) {
      return null;
    }


    const marker =
      "/storage/v1/object/public/yazar-fotograflari/";


    const index =
      url.indexOf(
        marker
      );


    if (index === -1) {
      return null;
    }


    return decodeURIComponent(
      url.substring(
        index +
        marker.length
      )
    );

  }


  /* ==================================================
     FOTOĞRAF SİL
  ================================================== */

  async function fotografSil(
    url
  ) {

    const path =
      fotografYoluBul(
        url
      );


    if (!path) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .storage
        .from(
          "yazar-fotograflari"
        )
        .remove([
          path
        ]);


    if (error) {

      console.warn(
        "Eski fotoğraf silinemedi:",
        error
      );

    }

  }


  /* ==================================================
     YAZAR KAYDET / GÜNCELLE
  ================================================== */

  async function yazarKaydet() {

    const name =
      document
        .getElementById(
          "authorName"
        )
        .value
        .trim();


    const bio =
      document
        .getElementById(
          "authorBio"
        )
        .value
        .trim();


    const photoFile =
      photoInput.files[0];


    if (!name) {

      mesajGoster(
        "Lütfen yazarın adını yaz.",
        "error"
      );

      return;

    }


    const slug =
      slugOlustur(
        name
      );


    saveButton.disabled =
      true;


    saveButton.textContent =
      duzenlenenYazarId
        ? "GÜNCELLENİYOR..."
        : "KAYDEDİLİYOR...";


    try {

      /* ==========================================
         YENİ YAZAR
      ========================================== */

      if (!duzenlenenYazarId) {

        let fotografUrl =
          null;


        if (photoFile) {

          const foto =
            await fotografYukle(
              photoFile,
              slug
            );


          fotografUrl =
            foto.url;

        }


        const {
          error
        } =
          await supabaseClient
            .from(
              "yazarlar"
            )
            .insert({

              ad_soyad:
                name,

              biyografi:
                bio || null,

              fotograf_url:
                fotografUrl,

              slug:
                slug

            });


        if (error) {

          throw error;

        }


        mesajGoster(
          "Yazar başarıyla kaydedildi.",
          "success"
        );

      }


      /* ==========================================
         MEVCUT YAZAR GÜNCELLE
      ========================================== */

      else {

        const {
          data: mevcutYazar,
          error: getError
        } =
          await supabaseClient
            .from(
              "yazarlar"
            )
            .select(
              "*"
            )
            .eq(
              "id",
              duzenlenenYazarId
            )
            .single();


        if (getError) {

          throw getError;

        }


        let fotografUrl =
          mevcutYazar.fotograf_url;


        /* Yeni fotoğraf seçildiyse */

        if (photoFile) {

          const yeniFoto =
            await fotografYukle(
              photoFile,
              slug
            );


          fotografUrl =
            yeniFoto.url;


          /* Eski fotoğrafı sil */

          if (
            mevcutYazar.fotograf_url
          ) {

            await fotografSil(
              mevcutYazar.fotograf_url
            );

          }

        }


        const {
          error: updateError
        } =
          await supabaseClient
            .from(
              "yazarlar"
            )
            .update({

              ad_soyad:
                name,

              biyografi:
                bio || null,

              fotograf_url:
                fotografUrl,

              slug:
                slug

            })
            .eq(
              "id",
              duzenlenenYazarId
            );


        if (updateError) {

          throw updateError;

        }


        mesajGoster(
          "Yazar başarıyla güncellendi.",
          "success"
        );

      }


      formuTemizle();

      await yazarlariGetir();

    }


    catch (error) {

      console.error(
        "Yazar kaydetme hatası:",
        error
      );


      mesajGoster(
        "İşlem başarısız: " +
        error.message,
        "error"
      );

    }


    finally {

      saveButton.disabled =
        false;


      saveButton.textContent =
        "YAZARI KAYDET";

    }

  }


  /* ==================================================
     YAZARLARI GETİR
  ================================================== */

  async function yazarlariGetir() {

    const list =
      document.getElementById(
        "authorsList"
      );


    const {
      data,
      error
    } =
      await supabaseClient
        .from(
          "yazarlar"
        )
        .select(
          "*"
        )
        .order(
          "id",
          {
            ascending:
              false
          }
        );


    if (error) {

      console.error(
        "Yazarları getirme hatası:",
        error
      );


      list.innerHTML =
        `<div class="empty">
          Yazarlar yüklenemedi:
          ${guvenliMetin(error.message)}
        </div>`;

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      list.innerHTML =
        `<div class="empty">
          Henüz kayıtlı yazar bulunmuyor.
        </div>`;

      return;

    }


    list.innerHTML =
      "";


    data.forEach(
      function (author) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "author-card";


        const image =
          author.fotograf_url

          ? `<img
               src="${guvenliMetin(
                 author.fotograf_url
               )}"
               alt="${guvenliMetin(
                 author.ad_soyad
               )}"
             >`

          : "👤";


        card.innerHTML = `

          <div class="author-photo">

            ${image}

          </div>


          <div class="author-info">

            <h3>
              ${guvenliMetin(
                author.ad_soyad
              )}
            </h3>


            <p>
              ${guvenliMetin(
                author.biyografi ||
                "Biyografi eklenmedi."
              )}
            </p>


            <div class="author-slug">
              /${guvenliMetin(
                author.slug || ""
              )}
            </div>


            <div class="author-actions">

              <button
                class="edit-button"
                onclick="yazarDuzenle(${author.id})"
              >
                DÜZENLE
              </button>


              <button
                class="delete-button"
                onclick="yazarSil(${author.id})"
              >
                SİL
              </button>

            </div>

          </div>

        `;


        list.appendChild(
          card
        );

      }
    );

  }


  /* ==================================================
     YAZAR DÜZENLE
  ================================================== */

  async function yazarDuzenle(
    id
  ) {

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "yazarlar"
          )
          .select(
            "*"
          )
          .eq(
            "id",
            id
          )
          .single();


      if (error) {

        throw error;

      }


      duzenlenenYazarId =
        id;


      document
        .getElementById(
          "authorName"
        )
        .value =
          data.ad_soyad || "";


      document
        .getElementById(
          "authorBio"
        )
        .value =
          data.biyografi || "";


      if (
        data.fotograf_url
      ) {

        photoPreview.innerHTML =
          `<img
            src="${guvenliMetin(
              data.fotograf_url
            )}"
            alt="Yazar fotoğrafı"
          >`;

      }

      else {

        photoPreview.innerHTML =
          "👤";

      }


      photoInput.value =
        "";


      formTitle.textContent =
        "Yazarı Düzenle";


      saveButton.textContent =
        "DEĞİŞİKLİKLERİ KAYDET";


      cancelButton.style.display =
        "block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    catch (error) {

      console.error(
        "Yazar düzenleme hatası:",
        error
      );


      mesajGoster(
        "Yazar bilgileri alınamadı: " +
        error.message,
        "error"
      );

    }

  }


  /* ==================================================
     YAZAR SİL
  ================================================== */

  async function yazarSil(
    id
  ) {

    const onay =
      confirm(
        "Bu yazarı silmek istediğine emin misin?\n\nYazar ve profil fotoğrafı silinecek."
      );


    if (!onay) {
      return;
    }


    try {

      const {
        data,
        error: getError
      } =
        await supabaseClient
          .from(
            "yazarlar"
          )
          .select(
            "fotograf_url"
          )
          .eq(
            "id",
            id
          )
          .single();


      if (getError) {

        throw getError;

      }


      const {
        error: deleteError
      } =
        await supabaseClient
          .from(
            "yazarlar"
          )
          .delete()
          .eq(
            "id",
            id
          );


      if (deleteError) {

        throw deleteError;

      }


      if (
        data &&
        data.fotograf_url
      ) {

        await fotografSil(
          data.fotograf_url
        );

      }


      mesajGoster(
        "Yazar başarıyla silindi.",
        "success"
      );


      await yazarlariGetir();

    }


    catch (error) {

      console.error(
        "Yazar silme hatası:",
        error
      );


      mesajGoster(
        "Yazar silinemedi: " +
        error.message,
        "error"
      );

    }

  }


  /* ==================================================
     FORM TEMİZLE
  ================================================== */

  function formuTemizle() {

    duzenlenenYazarId =
      null;


    document
      .getElementById(
        "authorName"
      )
      .value =
        "";
