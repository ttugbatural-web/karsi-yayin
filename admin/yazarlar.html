<header>

    <a

      href="index.html"

      ← Yönetim Paneli
    </a>

  </div>

</header>


<main>

  <h1 class="page-title">
    Yazarlar
  </h1>

  <p class="page-description">
    KARŞI'da yazacak yazarları buradan yöneteceğiz.
  </p>


  <!-- =========================
       YENİ YAZAR
  ========================= -->

  <section class="form-box">

    <h2>
      Yeni Yazar Ekle
    </h2>


    <div class="form-group">

      <label>
        AD SOYAD
      </label>

      <input
        type="text"
        id="authorName"
        placeholder="Örn. Taylan Özgür Tural"
      >

    </div>


    <div class="form-group">

      <label>
        KISA BİYOGRAFİ
      </label>

      <textarea
        id="authorBio"
        placeholder="Yazar hakkında kısa bilgi..."
      ></textarea>

    </div>


    <div class="form-group">

      <label>
        FOTOĞRAF
      </label>

      <div class="photo-area">

        <div
          class="photo-preview"
          id="photoPreview"
        >
          👤
        </div>

        <div class="photo-info">

          Profil fotoğrafını seç.

          <br>

          JPG veya PNG kullanabilirsin.

          <br>

          <input
            type="file"
            id="authorPhoto"
            accept="image/jpeg,image/png"
          >

        </div>

      </div>

    </div>


    <button
      class="save-button"
      id="saveButton"
      onclick="yazarEkle()"
    >
      YAZARI KAYDET
    </button>

      id="message"
      class="message"
    ></div>

  </section>


  <!-- =========================

  ========================= -->

    Mevcut Yazarlar
  </h2>

  <section
    class="authors"
    id="authorsList"
  >

    <div class="empty">

    </div>

<footer>

  KARŞI — Yönetim Paneli

</footer>


<script>

  /* ==================================================
     SUPABASE AYARLARI
  ================================================== */

  const SUPABASE_URL =
    "https://rfqiffvudbmphvklxetf.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* ==================================================
     ELEMENTLER
  ================================================== */

  const photoInput =
    document.getElementById("authorPhoto");

  const photoPreview =
    document.getElementById("photoPreview");

  const saveButton =
    document.getElementById("saveButton");

  const message =
    document.getElementById("message");


  /* ==================================================
     FOTOĞRAF ÖNİZLEME
  ================================================== */

  photoInput.addEventListener(
    "change",
    function () {

      const file = this.files[0];

      if (!file) {
        photoPreview.innerHTML = "👤";
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        function (e) {

          photoPreview.innerHTML =
            `<img src="${e.target.result}" alt="Yazar fotoğrafı">`;

        };

      reader.readAsDataURL(file);

    }
  );


  /* ==================================================
     SLUG OLUŞTUR
  ================================================== */

  function slugOlustur(metin) {

    return metin
      .toLowerCase()
      .replace(/ğ/g, "g")
      .replace(/ü/g, "u")
      .replace(/ş/g, "s")
      .replace(/ı/g, "i")
      .replace(/ö/g, "o")
      .replace(/ç/g, "c")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");

  }


  /* ==================================================
     MESAJ
  ================================================== */

  function mesajGoster(
    text,
    type
  ) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  /* ==================================================
     YAZAR EKLE
  ================================================== */

  async function yazarEkle() {

    const name =
      document
        .getElementById("authorName")
        .value
        .trim();


    const bio =
      document
        .getElementById("authorBio")
        .value
        .trim();


    const photoFile =
      photoInput.files[0];


    if (!name) {

      mesajGoster(
        "Lütfen yazarın adını yaz.",
        "error"
      );

      return;

    }


    const slug =
      slugOlustur(name);


    saveButton.disabled = true;

    saveButton.textContent =
      "KAYDEDİLİYOR...";


    try {

      let fotografUrl = null;


      /* ==========================================
         FOTOĞRAF YÜKLE
      ========================================== */

      if (photoFile) {

        const dosyaUzantisi =
          photoFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const dosyaAdi =
          slug +
          "-" +
          Date.now() +
          "." +
          dosyaUzantisi;


        const dosyaYolu =
          dosyaAdi;


        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("yazar-fotograflari")
            .upload(
              dosyaYolu,
              photoFile,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (uploadError) {

          throw uploadError;

        }


        /* ======================================
           PUBLIC FOTOĞRAF URL
        ====================================== */

        const {
          data: publicUrlData
        } =
          supabaseClient
            .storage
            .from("yazar-fotograflari")
            .getPublicUrl(
              dosyaYolu
            );


        fotografUrl =
          publicUrlData.publicUrl;

      }


      /* ==========================================
         VERİTABANINA YAZAR KAYDI
      ========================================== */

      const {
        error: insertError
      } =
        await supabaseClient
          .from("yazarlar")
          .insert({

            ad_soyad: name,

            biyografi:
              bio || null,

            fotograf_url:
              fotografUrl,

            slug:
              slug

          });


      if (insertError) {

        throw insertError;

      }


      /* ==========================================
         BAŞARILI
      ========================================== */

      mesajGoster(
        "Yazar başarıyla kaydedildi.",
        "success"
      );


      document
        .getElementById("authorName")
        .value = "";


      document
        .getElementById("authorBio")
        .value = "";


      photoInput.value = "";


      photoPreview.innerHTML =
        "👤";


      await yazarlariGetir();


    }

    catch (error) {

      console.error(
        "Yazar kaydetme hatası:",
        error
      );


      mesajGoster(
        "Yazar kaydedilemedi: " +
        error.message,
        "error"
      );

    }

    finally {

      saveButton.disabled = false;

      saveButton.textContent =
        "YAZARI KAYDET";

    }

  }


  /* ==================================================
     YAZARLARI GETİR
  ================================================== */

  async function yazarlariGetir() {

    const list =
      document.getElementById(
        "authorsList"
      );


    const {
      data,
      error
    } =
      await supabaseClient
        .from("yazarlar")
        .select("*")
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        "Yazarları getirme hatası:",
        error
      );


      list.innerHTML =
        `<div class="empty">
          Yazarlar yüklenemedi: ${guvenliMetin(error.message)}
        </div>`;

      return;

    }


    if (!data || data.length === 0) {

      list.innerHTML =
        `<div class="empty">
          Henüz kayıtlı yazar bulunmuyor.
        </div>`;

      return;

    }


    list.innerHTML = "";


    data.forEach(
      function (author) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "author-card";


        const image =
          author.fotograf_url

          ? `<img
               src="${guvenliMetin(author.fotograf_url)}"
               alt="${guvenliMetin(author.ad_soyad)}"
             >`

          : "👤";


        card.innerHTML = `

          <div class="author-photo">
            ${image}
          </div>

          <div class="author-info">

            <h3>
              ${guvenliMetin(author.ad_soyad)}
            </h3>

            <p>
              ${guvenliMetin(
                author.biyografi ||
                "Biyografi eklenmedi."
              )}
            </p>

            <div class="author-slug">
              /${guvenliMetin(author.slug || "")}
            </div>

          </div>

        `;


        list.appendChild(card);

      }
    );

  }


  /* ==================================================
     GÜVENLİ METİN
  ================================================== */

  function guvenliMetin(
    metin
  ) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      metin == null
        ? ""
        : String(metin);

    return div.innerHTML;

  }


  /* ==================================================
     SAYFA AÇILDIĞINDA
     YAZARLARI GETİR
  ================================================== */

  yazarlariGetir();

</script>

</body>
</html>
