<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  /* =====================================
     SUPABASE AYARLARI
  ===================================== */

  const SUPABASE_URL =
    "https://rfqiffvudbmphvklxetf.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================
     FOTOĞRAF ÖNİZLEME
  ===================================== */

  const photoInput =
    document.getElementById("authorPhoto");

  const photoPreview =
    document.getElementById("photoPreview");


  photoInput.addEventListener(
    "change",
    function () {

      const file = this.files[0];

      if (!file) {
        photoPreview.innerHTML = "👤";
        return;
      }

      if (
        file.type !== "image/jpeg" &&
        file.type !== "image/png"
      ) {

        alert("Lütfen JPG veya PNG dosyası seç.");

        this.value = "";

        photoPreview.innerHTML = "👤";

        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function (e) {

          photoPreview.innerHTML =
            `<img
              src="${e.target.result}"
              alt="Yazar fotoğrafı"
            >`;

        };


      reader.readAsDataURL(file);

    }
  );


  /* =====================================
     SLUG OLUŞTUR
  ===================================== */

  function slugOlustur(metin) {

    return metin
      .toLowerCase()

      .replace(/ğ/g, "g")
      .replace(/ü/g, "u")
      .replace(/ş/g, "s")
      .replace(/ı/g, "i")
      .replace(/ö/g, "o")
      .replace(/ç/g, "c")

      .replace(/[^a-z0-9]+/g, "-")

      .replace(/^-+|-+$/g, "");

  }


  /* =====================================
     MESAJ
  ===================================== */

  function mesajGoster(
    metin,
    tip
  ) {

    const message =
      document.getElementById("message");

    message.textContent = metin;

    message.className =
      "message " + tip;

  }


  /* =====================================
     YAZAR EKLE
  ===================================== */

  async function yazarEkle() {

    const name =
      document
        .getElementById("authorName")
        .value
        .trim();


    const bio =
      document
        .getElementById("authorBio")
        .value
        .trim();


    const photoFile =
      document
        .getElementById("authorPhoto")
        .files[0];


    if (!name) {

      mesajGoster(
        "Lütfen yazarın adını yaz.",
        "error"
      );

      return;
    }


    const saveButton =
      document.getElementById("saveButton");


    saveButton.disabled = true;

    saveButton.textContent =
      "KAYDEDİLİYOR...";


    try {

      let photoUrl = null;


      /* =================================
         FOTOĞRAF YÜKLE
      ================================= */

      if (photoFile) {

        const extension =
          photoFile.type === "image/png"
          ? "png"
          : "jpg";


        const slug =
          slugOlustur(name);


        const fileName =
          slug +
          "-" +
          Date.now() +
          "." +
          extension;


        const filePath =
          fileName;


        const uploadResult =
          await supabaseClient
            .storage
            .from("yazar-fotograflari")
            .upload(
              filePath,
              photoFile,
              {
                cacheControl: "3600",
                upsert: false,
                contentType: photoFile.type
              }
            );


        if (uploadResult.error) {

          throw uploadResult.error;

        }


        const publicResult =
          supabaseClient
            .storage
            .from("yazar-fotograflari")
            .getPublicUrl(filePath);


        photoUrl =
          publicResult.data.publicUrl;

      }


      /* =================================
         VERİTABANINA KAYDET
      ================================= */

      const slug =
        slugOlustur(name);


      const insertResult =
        await supabaseClient
          .from("yazarlar")
          .insert([
            {
              ad_soyad: name,
              biyografi: bio,
              fotograf_url: photoUrl,
              slug: slug
            }
          ])
          .select();


      if (insertResult.error) {

        throw insertResult.error;

      }


      mesajGoster(
        "Yazar başarıyla kaydedildi.",
        "success"
      );


      /* =================================
         FORMU TEMİZLE
      ================================= */

      document
        .getElementById("authorName")
        .value = "";


      document
        .getElementById("authorBio")
        .value = "";


      photoInput.value = "";


      photoPreview.innerHTML =
        "👤";


      /* =================================
         LİSTEYİ YENİLE
      ================================= */

      yazarlarYukle();

    }


    catch (error) {

      console.error(error);

      mesajGoster(
        "Kayıt sırasında bir hata oluştu: " +
        error.message,
        "error"
      );

    }


    finally {

      saveButton.disabled = false;

      saveButton.textContent =
        "YAZARI KAYDET";

    }

  }


  /* =====================================
     YAZARLARI SUPABASE'DEN ÇEK
  ===================================== */

  async function yazarlarYukle() {

    const list =
      document.getElementById(
        "authorsList"
      );


    list.innerHTML =
      "<p>Yazarlar yükleniyor...</p>";


    const result =
      await supabaseClient
        .from("yazarlar")
        .select(
          "ad_soyad,biyografi,fotograf_url,slug"
        )
        .order(
          "ad_soyad",
          {
            ascending: true
          }
        );


    if (result.error) {

      console.error(result.error);

      list.innerHTML =
        "<p>Yazarlar yüklenirken hata oluştu.</p>";

      return;

    }


    list.innerHTML = "";


    if (!result.data.length) {

      list.innerHTML =
        "<p>Henüz yazar eklenmemiş.</p>";

      return;

    }


    result.data.forEach(
      function (author) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "author-card";


        const photo =
          author.fotograf_url
          ? `<img
              src="${author.fotograf_url}"
              alt="${guvenliMetin(author.ad_soyad)}"
            >`
          : "👤";


        card.innerHTML = `

          <div class="author-photo">

            ${photo}

          </div>

          <div class="author-info">

            <h3>
              ${guvenliMetin(
                author.ad_soyad
              )}
            </h3>

            <p>
              ${guvenliMetin(
                author.biyografi ||
                "Biyografi eklenmedi."
              )}
            </p>

          </div>

        `;


        list.appendChild(card);

      }
    );

  }


  /* =====================================
     GÜVENLİ METİN
  ===================================== */

  function guvenliMetin(metin) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      metin || "";

    return div.innerHTML;

  }


  /* =====================================
     SAYFA AÇILINCA YAZARLARI GETİR
  ===================================== */

  yazarlarYukle();

</script>

</body>
</html>
