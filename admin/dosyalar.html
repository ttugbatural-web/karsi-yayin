<script>

    /* ==========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL = "https://rfqiffvudbmphvklxetf.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";

    const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    /* ==========================================
       ELEMENTLER
    ========================================== */

    const liste = document.getElementById("dosyalarListesi");
    const mesaj = document.getElementById("mesaj");
    const modal = document.getElementById("modal");
    const dosyaForm = document.getElementById("dosyaForm");


    let mevcutDosyalar = [];


    /* ==========================================
       HTML GÜVENLİĞİ
    ========================================== */

    function escapeHtml(metin) {

        if (
            metin === null ||
            metin === undefined
        ) {
            return "";
        }

        return String(metin)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* ==========================================
       SLUG OLUŞTUR
    ========================================== */

    function slugOlustur(metin) {

        return String(metin || "")
            .toLowerCase()
            .trim()
            .replace(/ğ/g, "g")
            .replace(/ü/g, "u")
            .replace(/ş/g, "s")
            .replace(/ı/g, "i")
            .replace(/ö/g, "o")
            .replace(/ç/g, "c")
            .replace(/[^a-z0-9\s-]/g, "")
            .replace(/\s+/g, "-")
            .replace(/-+/g, "-");
    }


    /* ==========================================
       TARİH
    ========================================== */

    function tarihFormatla(tarih) {

        if (!tarih) {
            return "";
        }

        const d = new Date(tarih);

        if (Number.isNaN(d.getTime())) {
            return "";
        }

        return d.toLocaleDateString(
            "tr-TR",
            {
                day: "2-digit",
                month: "long",
                year: "numeric"
            }
        );
    }


    /* ==========================================
       MESAJ
    ========================================== */

    function mesajGoster(metin, tip = "basarili") {

        mesaj.textContent = metin;
        mesaj.className = "mesaj " + tip;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        setTimeout(() => {

            mesaj.className = "mesaj";

        }, 4000);
    }


    /* ==========================================
       DOSYALARI GETİR
    ========================================== */

    async function dosyalariGetir() {

        liste.innerHTML = `
            <div class="yukleniyor">
                Dosyalar yükleniyor...
            </div>
        `;


        const {
            data,
            error
        } = await db
            .from("dosyalar")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (error) {

            console.error(
                "Dosyalar yüklenemedi:",
                error
            );

            liste.innerHTML = `
                <div class="bos">
                    <strong>Dosyalar yüklenemedi.</strong>
                    ${escapeHtml(error.message)}
                </div>
            `;

            return;
        }


        mevcutDosyalar = data || [];


        if (mevcutDosyalar.length === 0) {

            liste.innerHTML = `
                <div class="bos">
                    <strong>Henüz dosya oluşturulmamış.</strong>
                    İlk dosyanı oluşturmak için
                    "+ Yeni Dosya" butonunu kullan.
                </div>
            `;

            return;
        }


        liste.innerHTML = mevcutDosyalar
            .map(dosya => {

                const yayinda =
                    dosya.durum === "yayinda";

                return `

                    <article
                        class="dosya ${yayinda ? "yayinda" : "taslak"}"
                    >

                        <div class="dosya-ust">

                            <div class="dosya-baslik">

                                <div class="kategori">
                                    ${escapeHtml(
                                        dosya.kategori || "Dosya"
                                    )}
                                </div>

                                <h2>
                                    ${escapeHtml(
                                        dosya.baslik
                                    )}
                                </h2>

                                ${
                                    dosya.ozet
                                    ? `
                                        <p class="ozet">
                                            ${escapeHtml(
                                                dosya.ozet
                                            )}
                                        </p>
                                    `
                                    : ""
                                }

                            </div>


                            <div
                                class="durum ${
                                    yayinda
                                    ? "yayinda"
                                    : "taslak"
                                }"
                            >
                                ${
                                    yayinda
                                    ? "YAYINDA"
                                    : "TASLAK"
                                }
                            </div>

                        </div>


                        <div class="meta">

                            ${
                                dosya.yayin_tarihi
                                ? "Yayın: " +
                                  tarihFormatla(
                                      dosya.yayin_tarihi
                                  )
                                : "Yayın tarihi yok"
                            }

                            &nbsp; • &nbsp;

                            Slug:
                            ${escapeHtml(
                                dosya.slug || "-"
                            )}

                        </div>


                        <div class="islemler">

                            <button
                                type="button"
                                class="btn-duzenle"
                                onclick="dosyaDuzenle('${dosya.id}')"
                            >
                                ✏️ Düzenle
                            </button>


                            ${
                                yayinda
                                ? `
                                    <button
                                        type="button"
                                        class="btn-taslak"
                                        onclick="durumDegistir(
                                            '${dosya.id}',
                                            'taslak'
                                        )"
                                    >
                                        ↩ Taslağa Al
                                    </button>
                                `
                                : `
                                    <button
                                        type="button"
                                        class="btn-yayinla"
                                        onclick="durumDegistir(
                                            '${dosya.id}',
                                            'yayinda'
                                        )"
                                    >
                                        ✓ Yayınla
                                    </button>
                                `
                            }


                            <button
                                type="button"
                                class="btn-sil"
                                onclick="dosyaSil('${dosya.id}')"
                            >
                                🗑️ Sil
                            </button>

                        </div>

                    </article>

                `;

            })
            .join("");
    }


    /* ==========================================
       YENİ DOSYA
    ========================================== */

    function yeniDosya() {

        dosyaForm.reset();

        document.getElementById("dosyaId").value = "";

        document.getElementById("durum").value =
            "taslak";

        document.getElementById("modalBaslik")
            .textContent = "Yeni Dosya";


        modal.classList.add("acik");

        document.getElementById("baslik").focus();
    }


    /* ==========================================
       DOSYA DÜZENLE
    ========================================== */

    function dosyaDuzenle(id) {

        const dosya = mevcutDosyalar.find(
            item => String(item.id) === String(id)
        );


        if (!dosya) {
            mesajGoster(
                "Dosya bulunamadı.",
                "hata"
            );
            return;
        }


        document.getElementById("dosyaId").value =
            dosya.id;

        document.getElementById("baslik").value =
            dosya.baslik || "";

        document.getElementById("ozet").value =
            dosya.ozet || "";

        document.getElementById("icerik").value =
            dosya.icerik || "";

        document.getElementById("kategori").value =
            dosya.kategori || "Dosya";

        document.getElementById("durum").value =
            dosya.durum || "taslak";

        document.getElementById("slug").value =
            dosya.slug || "";

        document.getElementById("kapak").value =
            dosya.kapak_fotografi_url || "";


        if (dosya.yayin_tarihi) {

            const tarih =
                new Date(dosya.yayin_tarihi);

            const yerelTarih =
                new Date(
                    tarih.getTime() -
                    tarih.getTimezoneOffset() * 60000
                )
                .toISOString()
                .slice(0, 16);

            document.getElementById(
                "yayinTarihi"
            ).value = yerelTarih;

        } else {

            document.getElementById(
                "yayinTarihi"
            ).value = "";

        }


        document.getElementById("modalBaslik")
            .textContent = "Dosyayı Düzenle";


        modal.classList.add("acik");

        document.getElementById("baslik").focus();
    }


    /* ==========================================
       DOSYA KAYDET
    ========================================== */

    async function dosyaKaydet() {

        const id =
            document.getElementById("dosyaId").value;

        const baslik =
            document.getElementById("baslik").value.trim();

        const ozet =
            document.getElementById("ozet").value.trim();

        const icerik =
            document.getElementById("icerik").value.trim();

        const kategori =
            document.getElementById("kategori").value;

        const durum =
            document.getElementById("durum").value;

        let slug =
            document.getElementById("slug").value.trim();

        const kapak =
            document.getElementById("kapak").value.trim();

        const yayinTarihi =
            document.getElementById("yayinTarihi").value;


        if (!baslik) {

            alert("Lütfen dosya başlığını gir.");

            return;
        }


        if (!slug) {
            slug = slugOlustur(baslik);
        }


        if (!slug) {

            alert("Geçerli bir slug oluşturulamadı.");

            return;
        }


        let yayinISO = null;

        if (yayinTarihi) {

            yayinISO =
                new Date(
                    yayinTarihi
                ).toISOString();

        }


        const kayit = {

            baslik: baslik,

            ozet: ozet || null,

            icerik: icerik || null,

            kategori: kategori || "Dosya",

            slug: slug,

            durum: durum,

            kapak_fotografi_url:
                kapak || null,

            yayin_tarihi:
                yayinISO,

            updated_at:
                new Date().toISOString()

        };


        /*
         * Yeni kayıt yayınlanıyorsa ve
         * tarih boşsa şu anı kullan.
         */

        if (
            !id &&
            durum === "yayinda" &&
            !yayinISO
        ) {

            kayit.yayin_tarihi =
                new Date().toISOString();

        }


        const kaydetBtn =
            document.getElementById("kaydetBtn");

        kaydetBtn.disabled = true;
        kaydetBtn.textContent = "Kaydediliyor...";


        let sonuc;


        if (id) {

            sonuc = await db
                .from("dosyalar")
                .update(kayit)
                .eq("id", id);

        } else {

            sonuc = await db
                .from("dosyalar")
                .insert(kayit);

        }


        kaydetBtn.disabled = false;
        kaydetBtn.textContent = "💾 Kaydet";


        if (sonuc.error) {

            console.error(
                "Dosya kaydedilemedi:",
                sonuc.error
            );

            mesajGoster(
                "Dosya kaydedilemedi: " +
                sonuc.error.message,
                "hata"
            );

            return;
        }


        modalKapat();

        mesajGoster(
            id
            ? "Dosya başarıyla güncellendi."
            : "Dosya başarıyla oluşturuldu."
        );

        await dosyalariGetir();
    }


    /* ==========================================
       DURUM DEĞİŞTİR
    ========================================== */

    async function durumDegistir(
        id,
        yeniDurum
    ) {

        const onay =
            yeniDurum === "yayinda"
            ? "Bu dosyayı yayınlamak istediğine emin misin?"
            : "Bu dosyayı taslağa almak istediğine emin misin?";


        if (!confirm(onay)) {
            return;
        }


        const guncelleme = {

            durum: yeniDurum,

            updated_at:
                new Date().toISOString()

        };


        if (yeniDurum === "yayinda") {

            guncelleme.yayin_tarihi =
                new Date().toISOString();

        }


        const {
            error
        } = await db
            .from("dosyalar")
            .update(guncelleme)
            .eq("id", id);


        if (error) {

            console.error(
                "Durum değiştirilemedi:",
                error
            );

            mesajGoster(
                "Durum değiştirilemedi: " +
                error.message,
                "hata"
            );

            return;
        }


        mesajGoster(
            yeniDurum === "yayinda"
            ? "Dosya yayınlandı."
            : "Dosya taslağa alındı."
        );


        await dosyalariGetir();
    }


    /* ==========================================
       DOSYA SİL
    ========================================== */

    async function dosyaSil(id) {

        const onay = confirm(
            "Bu dosyayı kalıcı olarak silmek istediğine emin misin?\n\nBu işlem geri alınamaz."
        );


        if (!onay) {
            return;
        }


        const {
            error
        } = await db
            .from("dosyalar")
            .delete()
            .eq("id", id);


        if (error) {

            console.error(
                "Dosya silinemedi:",
                error
            );

            mesajGoster(
                "Dosya silinemedi: " +
                error.message,
                "hata"
            );

            return;
        }


        mesajGoster(
            "Dosya başarıyla silindi."
        );


        await dosyalariGetir();
    }


    /* ==========================================
       MODAL KAPAT
    ========================================== */

    function modalKapat() {

        modal.classList.remove("acik");

        dosyaForm.reset();

        document.getElementById("dosyaId")
            .value = "";
    }


    /* ==========================================
       BUTONLAR
    ========================================== */

    document
        .getElementById("yeniBtn")
        .addEventListener(
            "click",
            yeniDosya
        );


    document
        .getElementById("yenileBtn")
        .addEventListener(
            "click",
            dosyalariGetir
        );


    document
        .getElementById("kaydetBtn")
        .addEventListener(
            "click",
            dosyaKaydet
        );


    document
        .getElementById("modalKapat")
        .addEventListener(
            "click",
            modalKapat
        );


    document
        .getElementById("modalIptal")
        .addEventListener(
            "click",
            modalKapat
        );


    document
        .getElementById("yonetimBtn")
        .addEventListener(
            "click",
            () => {
                window.location.href =
                    "/admin/";
            }
        );


    /* ==========================================
       BAŞLIK → OTOMATİK SLUG
       Sadece yeni dosyada ve slug boşsa
    ========================================== */

    document
        .getElementById("baslik")
        .addEventListener(
            "input",
            function () {

                const id =
                    document.getElementById(
                        "dosyaId"
                    ).value;

                const slugInput =
                    document.getElementById(
                        "slug"
                    );


                if (
                    !id &&
                    !slugInput.value.trim()
                ) {

                    slugInput.value =
                        slugOlustur(
                            this.value
                        );

                }

            }
        );


    /* ==========================================
       ESC → MODAL KAPAT
    ========================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape" &&
                modal.classList.contains("acik")
            ) {

                modalKapat();

            }

        }
    );


    /* ==========================================
       DIŞARI TIKLAYINCA MODAL KAPAT
    ========================================== */

    modal.addEventListener(
        "click",
        function (event) {

            if (
                event.target === modal
            ) {

                modalKapat();

            }

        }
    );


    /* ==========================================
       BAŞLAT
    ========================================== */

    dosyalariGetir();

</script>
