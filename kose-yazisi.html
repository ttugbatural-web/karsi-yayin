  /* ==================================================
     SEO METİN TEMİZLEME
  ================================================== */

  function seoMetniTemizle(metin) {

    if (metin == null) {
      return "";
    }

    const div =
      document.createElement("div");

    div.innerHTML =
      String(metin);

    return (
      div.textContent ||
      div.innerText ||
      ""
    )
      .replace(/\s+/g, " ")
      .trim();

  }


  /* ==================================================
     SEO DESCRIPTION OLUŞTUR
  ================================================== */

  function seoDescriptionOlustur(metin) {

    const temiz =
      seoMetniTemizle(
        metin
      );

    if (!temiz) {

      return "KARŞIDAN köşe yazıları: gündeme, siyasete, topluma ve dünyaya dair bağımsız düşünceler ve yorumlar.";

    }

    if (temiz.length <= 160) {
      return temiz;
    }

    return (
      temiz
        .substring(0, 157)
        .replace(/\s+\S*$/, "")
        .trim() +
      "..."
    );

  }


  /* ==================================================
     GÜVENLİ METİN
  ================================================== */

  function guvenliMetin(metin) {

    const div =
      document.createElement("div");

    div.textContent =
      metin == null
        ? ""
        : String(metin);

    return div.innerHTML;

  }


  /* ==================================================
     GÜVENLİ URL
  ================================================== */

  function guvenliUrl(url) {

    if (!url) {
      return "#";
    }

    try {

      const parsed =
        new URL(
          String(url),
          window.location.origin
        );

      if (
        parsed.protocol === "http:" ||
        parsed.protocol === "https:"
      ) {
        return parsed.href;
      }

    }

    catch (error) {

      console.warn(
        "Geçersiz URL:",
        url
      );

    }

    return "#";

  }


  /* ==================================================
     GÜVENLİ CSS DEĞERİ
  ================================================== */

  function guvenliStyleDegeri(deger) {

    if (!deger) {
      return "";
    }

    const value =
      String(deger)
        .trim();

    if (
      /javascript\s*:/i.test(value) ||
      /expression\s*\(/i.test(value) ||
      /url\s*\(/i.test(value) ||
      /@import/i.test(value)
    ) {
      return "";
    }

    if (
      /[<>]/.test(value)
    ) {
      return "";
    }

    return value;

  }


  /* ==================================================
     GÜVENLİ HTML
  ================================================== */

  function guvenliHTML(html) {

    if (
      html == null ||
      String(html).trim() === ""
    ) {
      return "";
    }


    const container =
      document.createElement("div");


    container.innerHTML =
      String(html);


    const izinVerilenEtiketler =
      new Set([
        "P",
        "BR",
        "STRONG",
        "B",
        "EM",
        "I",
        "U",
        "S",
        "UL",
        "OL",
        "LI",
        "BLOCKQUOTE",
        "A",
        "SPAN",
        "DIV",
        "H2",
        "H3",
        "FONT"
      ]);


    const izinVerilenStiller =
      new Set([
        "color",
        "background-color",
        "font-family",
        "font-size",
        "font-weight",
        "font-style",
        "text-decoration",
        "text-align"
      ]);


    function fontEtiketiniSpanYap(font) {

      const span =
        document.createElement("span");


      const color =
        font.getAttribute("color");

      const face =
        font.getAttribute("face");

      const size =
        font.getAttribute("size");


      const stiller = [];


      if (color) {

        const guvenliColor =
          guvenliStyleDegeri(color);

        if (guvenliColor) {

          stiller.push(
            "color:" +
            guvenliColor
          );

        }

      }


      if (face) {

        const guvenliFace =
          guvenliStyleDegeri(face);

        if (guvenliFace) {

          stiller.push(
            "font-family:" +
            guvenliFace
          );

        }

      }


      if (size) {

        const boyutlar = {

          "1": "13px",
          "2": "16px",
          "3": "19px",
          "4": "24px",
          "5": "30px",
          "6": "36px",
          "7": "42px"

        };


        if (boyutlar[size]) {

          stiller.push(
            "font-size:" +
            boyutlar[size]
          );

        }

      }


      if (stiller.length) {

        span.setAttribute(
          "style",
          stiller.join(";")
        );

      }


      while (font.firstChild) {

        span.appendChild(
          font.firstChild
        );

      }


      font.parentNode.replaceChild(
        span,
        font
      );

    }


    Array.from(
      container.querySelectorAll("FONT")
    ).forEach(
      fontEtiketiniSpanYap
    );


    const tehlikeliEtiketler = [
      "SCRIPT",
      "STYLE",
      "IFRAME",
      "OBJECT",
      "EMBED",
      "FORM",
      "INPUT",
      "BUTTON",
      "TEXTAREA",
      "SELECT",
      "OPTION",
      "VIDEO",
      "AUDIO",
      "SOURCE",
      "META",
      "LINK",
      "BASE",
      "SVG",
      "MATH"
    ];


    tehlikeliEtiketler.forEach(
      function(tagName) {

        container
          .querySelectorAll(tagName)
          .forEach(
            function(element) {

              element.remove();

            }
          );

      }
    );


    function temizleElement(element) {

      Array.from(
        element.children
      ).forEach(
        function(child) {

          const tagName =
            child.tagName.toUpperCase();


          if (
            !izinVerilenEtiketler.has(
              tagName
            )
          ) {

            while (child.firstChild) {

              element.insertBefore(
                child.firstChild,
                child
              );

            }

            child.remove();

            return;

          }


          Array.from(
            child.attributes
          ).forEach(
            function(attribute) {

              const attributeName =
                attribute.name.toLowerCase();


              if (
                attributeName.startsWith("on") ||
                attributeName === "srcdoc"
              ) {

                child.removeAttribute(
                  attribute.name
                );

                return;

              }


              if (
                attributeName === "style"
              ) {

                const temizStiller = [];

                const styleMetni =
                  attribute.value;


                styleMetni
                  .split(";")
                  .forEach(
                    function(deklarasyon) {

                      const ikiNokta =
                        deklarasyon.indexOf(":");


                      if (
                        ikiNokta === -1
                      ) {
                        return;
                      }


                      const property =
                        deklarasyon
                          .slice(
                            0,
                            ikiNokta
                          )
                          .trim()
                          .toLowerCase();


                      const value =
                        deklarasyon
                          .slice(
                            ikiNokta + 1
                          )
                          .trim();


                      if (
                        !izinVerilenStiller.has(
                          property
                        )
                      ) {
                        return;
                      }


                      const guvenliValue =
                        guvenliStyleDegeri(
                          value
                        );


                      if (!guvenliValue) {
                        return;
                      }


                      temizStiller.push(
                        property +
                        ":" +
                        guvenliValue
                      );

                    }
                  );


                if (
                  temizStiller.length
                ) {

                  child.setAttribute(
                    "style",
                    temizStiller.join(";")
                  );

                }

                else {

                  child.removeAttribute(
                    "style"
                  );

                }


                return;

              }


              if (
                attributeName === "class"
              ) {

                const siniflar =
                  String(
                    attribute.value
                  )
                    .split(/\s+/)
                    .filter(
                      function(sinif) {

                        return (
                          sinif ===
                            "vurgulu-metin" ||
                          sinif ===
                            "vurgulu-kutu"
                        );

                      }
                    );


                if (
                  siniflar.length
                ) {

                  child.setAttribute(
                    "class",
                    siniflar.join(" ")
                  );

                }

                else {

                  child.removeAttribute(
                    "class"
                  );

                }


                return;

              }


              if (
                tagName === "A" &&
                attributeName === "href"
              ) {

                const href =
                  String(
                    attribute.value
                  ).trim();


                const hrefLower =
                  href.toLowerCase();


                if (
                  hrefLower.startsWith(
                    "javascript:"
                  ) ||
                  hrefLower.startsWith(
                    "data:"
                  ) ||
                  hrefLower.startsWith(
                    "vbscript:"
                  )
                ) {

                  child.removeAttribute(
                    "href"
                  );

                  return;

                }


                if (
                  !(
                    hrefLower.startsWith(
                      "http://"
                    ) ||
                    hrefLower.startsWith(
                      "https://"
                    ) ||
                    hrefLower.startsWith(
                      "mailto:"
                    )
                  )
                ) {

                  child.removeAttribute(
                    "href"
                  );

                  return;

                }


                child.setAttribute(
                  "target",
                  "_blank"
                );

                child.setAttribute(
                  "rel",
                  "noopener noreferrer"
                );


                return;

              }


              if (
                !(
                  attributeName === "href" &&
                  tagName === "A"
                )
              ) {

                child.removeAttribute(
                  attribute.name
                );

              }

            }
          );


          temizleElement(child);

        }
      );

    }


    temizleElement(
      container
    );


    return container.innerHTML;

  }

  function seoMetaGuncelle({
    baslik,
    aciklama,
    url,
    fotograf,
    kategori,
    tarih
  }) {

    const title =
      baslik
        ? baslik + " — KARŞIDAN"

    document.title =
      title;


    const description =
      seoDescriptionOlustur(
        aciklama
      );


    const canonical =
      document.querySelector(
        'link[rel="canonical"]'
      );


    if (canonical) {

      canonical.setAttribute(
        "href",
        url
      );

    }


    const descriptionMeta =
      document.querySelector(
        'meta[name="description"]'
      );


    if (descriptionMeta) {

      descriptionMeta.setAttribute(
        "content",
        description
      );

    }


    const ogTitle =
      document.querySelector(
        'meta[property="og:title"]'
      );


    if (ogTitle) {

      ogTitle.setAttribute(
        "content",
        title
      );

    }


    const ogDescription =
      document.querySelector(
        'meta[property="og:description"]'
      );


    if (ogDescription) {

      ogDescription.setAttribute(
        "content",
        description
      );

    }


    const ogUrl =
      document.querySelector(
        'meta[property="og:url"]'
      );


    if (ogUrl) {

      ogUrl.setAttribute(
        "content",
        url
      );

    }


    const twitterTitle =
      document.querySelector(
        'meta[name="twitter:title"]'
      );


    if (twitterTitle) {

      twitterTitle.setAttribute(
        "content",
        title
      );

    }


    const twitterDescription =
      document.querySelector(
        'meta[name="twitter:description"]'
      );


    if (twitterDescription) {

      twitterDescription.setAttribute(
        "content",
        description
      );

    }


    const twitterImage =
      document.querySelector(
        'meta[name="twitter:image"]'
      );


    if (
      twitterImage &&
      fotograf
    ) {

      twitterImage.setAttribute(
        "content",
        fotograf
      );

    }


    let ogImage =
      document.querySelector(
        'meta[property="og:image"]'
      );


    if (
      fotograf
    ) {

      if (!ogImage) {

        ogImage =
          document.createElement("meta");

        ogImage.setAttribute(
          "property",
          "og:image"
        );

        document.head.appendChild(
          ogImage
        );

      }

      ogImage.setAttribute(
        "content",
        fotograf
      );

    }


    let ogArticleSection =
      document.querySelector(
        'meta[property="article:section"]'
      );


    if (
      kategori
    ) {

      if (!ogArticleSection) {

        ogArticleSection =
          document.createElement("meta");

        ogArticleSection.setAttribute(
          "property",
          "article:section"
        );

        document.head.appendChild(
          ogArticleSection
        );

      }

      ogArticleSection.setAttribute(
        "content",
        kategori
      );

    }


    let ogPublishedTime =
      document.querySelector(
        'meta[property="article:published_time"]'
      );


    if (
      tarih
    ) {

      if (!ogPublishedTime) {

        ogPublishedTime =
          document.createElement("meta");

        ogPublishedTime.setAttribute(
          "property",
          "article:published_time"
        );

        document.head.appendChild(
          ogPublishedTime
        );

      }

      ogPublishedTime.setAttribute(
        "content",
        tarih
      );

    }

  }


  /* ==================================================
     ISO TARİH
  ================================================== */

  function isoTarih(tarih) {

    if (!tarih) {
      return null;
    }

    const date =
      new Date(
        tarih
      );

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return null;
    }

    return date.toISOString();

  }


  /* ==================================================
     YAPILANDIRILMIŞ VERİYİ GÜNCELLE
  ================================================== */

  function structuredDataGuncelle({
    baslik,
    aciklama,
    url,
    fotograf,
    kategori,
    authorName,
    authorBio,
    yayinTarihi,
    updatedTarihi
  }) {

    const headline =
      baslik ||
      "Yazı — KARŞIDAN";


    const description =
      seoDescriptionOlustur(
        aciklama
      );


    const articleData = {

      "@context":
        "https://schema.org",

      "@type":
        "BlogPosting",

      "headline":
        headline,

      "description":
        description,

      "url":
        url,

      "inLanguage":
        "tr-TR",

      "isAccessibleForFree":
        true,

      "publisher": {

        "@type":
          "Organization",

        "name":
          "KARŞIDAN",

        "url":
          "https://karsidan.com.tr/"

      },

      "mainEntityOfPage": {

        "@type":
          "WebPage",

        "@id":
          url

      }

    };


    if (fotograf) {

      articleData.image =
        [fotograf];

    }


    if (kategori) {

      articleData.articleSection =
        kategori;

    }


    if (authorName) {

      articleData.author = {

        "@type":
          "Person",

        "name":
          authorName

      };


      if (authorBio) {

        articleData.author.description =
          seoMetniTemizle(
            authorBio
          );

      }

    }


    const published =
      isoTarih(
        yayinTarihi
      );


    if (published) {

      articleData.datePublished =
        published;

    }


    const modified =
      isoTarih(
        updatedTarihi
      );


    if (modified) {

      articleData.dateModified =
        modified;

    }

    else if (published) {

      articleData.dateModified =
        published;

    }


    const structuredData =
      document.getElementById(
        "structuredData"
      );


    if (structuredData) {

      structuredData.textContent =
        JSON.stringify(
          articleData,
          null,
          2
        );

    }

  }


  /* ==================================================
     BREADCRUMB YAPILANDIRILMIŞ VERİSİ
  ================================================== */

  function breadcrumbStructuredDataGuncelle({
    baslik,
    url
  }) {

    let breadcrumb =
      document.getElementById(
        "breadcrumbStructuredData"
      );


    if (!breadcrumb) {

      breadcrumb =
        document.createElement(
          "script"
        );

      breadcrumb.type =
        "application/ld+json";

      breadcrumb.id =
        "breadcrumbStructuredData";

      document.head.appendChild(
        breadcrumb
      );

    }


    const data = {

      "@context":
        "https://schema.org",

      "@type":
        "BreadcrumbList",

      "itemListElement": [

        {

          "@type":
            "ListItem",

          "position":
            1,

          "name":
            "KARŞIDAN",

          "item":
            "https://karsidan.com.tr/"

        },

        {

          "@type":
            "ListItem",

          "position":
            2,

          "name":
            "Köşe Yazıları",

          "item":
            "https://karsidan.com.tr/kose-yazilari.html"

        },

        {

          "@type":
            "ListItem",

          "position":
            3,

          "name":
            baslik ||
            "Yazı",

          "item":
            url

        }

      ]

    };


    breadcrumb.textContent =
      JSON.stringify(
        data,
        null,
        2
      );

  }


  /* ==================================================
     SLUG'I URL'DEN AL
  ================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const slug =
    params.get("slug");


  /* ==================================================
     YAZIYI GETİR
  ================================================== */

  async function yaziGetir() {

    const area =
      document.getElementById(
        "articleArea"
      );


    if (!slug) {

      area.innerHTML = `
        <div class="error-box">
          Yazı bulunamadı.
        </div>
      `;

      return;

    }


    try {

      const {
        data,
        error
      } =
        await supabaseClient

          .from("kose_yazilari")

          .select(`
            *,
            yazarlar (
              ad_soyad,
              biyografi,
              fotograf_url
            )
          `)

          .eq(
            "slug",
            slug
          )

          .eq(
            "durum",
            "yayinda"
          )

          .single();


      if (error || !data) {

        console.error(
          "Yazı yükleme hatası:",
          error
        );


        area.innerHTML = `
          <div class="error-box">
            Bu yazı bulunamadı veya henüz yayınlanmadı.
          </div>
        `;

        return;

      }


      /* ==========================================
         YAZAR
      ========================================== */

      const authorName =
        data.yazarlar &&
        data.yazarlar.ad_soyad
          ? data.yazarlar.ad_soyad
          : "KARŞIDAN";


      const authorBio =
        data.yazarlar &&
        data.yazarlar.biyografi
          ? data.yazarlar.biyografi
          : "";


      /* ==========================================
         TARİH
      ========================================== */

      let tarih = "";

      let isoYayinTarihi = null;

      let isoUpdatedTarihi = null;


      if (data.yayin_tarihi) {

        const date =
          new Date(
            data.yayin_tarihi
          );


        if (
          !Number.isNaN(
            date.getTime()
          )
        ) {

          tarih =
            date.toLocaleDateString(
              "tr-TR",
              {
                day: "numeric",
                month: "long",
                year: "numeric"
              }
            );

          isoYayinTarihi =
            date.toISOString();

        }

      }


      if (data.updated_at) {

        const updated =
          new Date(
            data.updated_at
          );


        if (
          !Number.isNaN(
            updated.getTime()
          )
        ) {

          isoUpdatedTarihi =
            updated.toISOString();

        }

      }


      /* ==========================================
         SEO URL
      ========================================== */

      const canonicalUrl =
        "https://karsidan.com.tr/kose-yazisi.html?slug=" +
        encodeURIComponent(
          String(slug)
        );


      /* ==========================================
         SEO AÇIKLAMASI
      ========================================== */

      const seoAciklama =
        seoDescriptionOlustur(
          data.ozet ||
          data.icerik ||
          data.baslik ||
          ""
        );


      /* ==========================================
         FOTOĞRAF
      ========================================== */

      let fotograf = "";

      let seoFotograf = "";


      if (
        data.kapak_fotografi_url
      ) {

        const guvenliFotograf =
          guvenliUrl(
            data.kapak_fotografi_url
          );


        if (
          guvenliFotograf !== "#"
        ) {

          seoFotograf =
            guvenliFotograf;


          fotograf = `
            <img
              class="cover-image"
              src="${guvenliMetin(guvenliFotograf)}"
              alt="${guvenliMetin(data.baslik || "KARŞIDAN köşe yazısı")}"
              loading="eager"
              decoding="async"
            >
          `;

        }

      }


      /* ==========================================
         İÇERİK
      ========================================== */

      const guvenliIcerik =
        guvenliHTML(
          data.icerik
        );


      /* ==========================================
         SAYFAYI OLUŞTUR
      ========================================== */

      area.innerHTML = `

        <article
          itemscope
          itemtype="https://schema.org/BlogPosting"
        >

          <div
            class="article-category"
            itemprop="articleSection"
          >

            ${guvenliMetin(
              data.kategori ||
              "KARŞIDAN / YORUM"
            )}

          </div>


          <h1
            class="article-title"
            itemprop="headline"
          >

            ${guvenliMetin(
              data.baslik
            )}

          </h1>


          <div
            class="article-meta"
            itemprop="author"
            itemscope
            itemtype="https://schema.org/Person"
          >

            Yazan:

            <strong itemprop="name">

              ${guvenliMetin(
                authorName
              )}

            </strong>

            ${
              tarih
                ? `
                  ·
                  <time
                    itemprop="datePublished"
                    datetime="${guvenliMetin(
                      isoYayinTarihi || ""
                    )}"
                  >
                    ${guvenliMetin(tarih)}
                  </time>
                `
                : ""
            }

          </div>


          ${fotograf}


          <div
            class="article-content"
            itemprop="articleBody"
          >

            ${guvenliIcerik}

          </div>

        </article>

      `;


      /* ==========================================
         SEO META
      ========================================== */

      seoMetaGuncelle({

        baslik:
          data.baslik,

        aciklama:
          seoAciklama,

        url:
          canonicalUrl,

        fotograf:
          seoFotograf,

        kategori:
          data.kategori,

        tarih:
          isoYayinTarihi

      });


      /* ==========================================
         STRUCTURED DATA
      ========================================== */

      structuredDataGuncelle({

        baslik:
          data.baslik,

        aciklama:
          seoAciklama,

        url:
          canonicalUrl,

        fotograf:
          seoFotograf,

        kategori:
          data.kategori,

        authorName:
          authorName,

        authorBio:
          authorBio,

        yayinTarihi:
          data.yayin_tarihi,

        updatedTarihi:
          data.updated_at

      });


      /* ==========================================
         BREADCRUMB
      ========================================== */

      breadcrumbStructuredDataGuncelle({

        baslik:
          data.baslik,

        url:
          canonicalUrl

      });


      /* ==========================================
         SAYFA BAŞLIĞI
      ========================================== */

      document.title =
        (
          data.baslik ||
          "Yazı"
        ) +
        " — KARŞIDAN";

    }

    catch (error) {

      console.error(
        "Yazı yükleme beklenmeyen hata:",
        error
      );


      area.innerHTML = `
        <div class="error-box">
          Yazı yüklenirken bir hata oluştu.
        </div>
      `;

    }

  }


  /* ==================================================
     BAŞLAT
  ================================================== */

  yaziGetir();

</script></body>
</html>
