    * {

    <div class="error-box">

    class="back-to-list"
  >

  </a>

</main>


<footer>

  <strong>

  </strong>

  <br><br>

  Bağımsız düşüncenin tarafı.

  <br><br>

  © 2026 KARŞI

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  /* ==================================================
     SUPABASE
  ================================================== */

  const SUPABASE_URL =
    "https://rfqiffvudbmphvklxetf.supabase.co";


  const SUPABASE_ANON_KEY =
    "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* ==================================================
     GÜVENLİ METİN
  ================================================== */

  function guvenliMetin(metin) {

    const div =
      document.createElement("div");

    div.textContent =
      metin == null
        ? ""
        : String(metin);

    return div.innerHTML;

  }


  /* ==================================================
     SLUG'I URL'DEN AL
  ================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const slug =
    params.get("slug");


  /* ==================================================
     YAZIYI GETİR
  ================================================== */

  async function yaziGetir() {

    const area =
      document.getElementById(
        "articleArea"
      );


    if (!slug) {

      area.innerHTML = `
        <div class="error-box">
          Yazı bulunamadı.
        </div>
      `;

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient

        .from("kose_yazilari")

        .select(`
          *,
          yazarlar (
            ad_soyad,
            biyografi,
            fotograf_url
          )
        `)

        .eq(
          "slug",
          slug
        )

        .eq(
          "durum",
          "yayinda"
        )

        .single();


    if (error || !data) {

      console.error(
        "Yazı yükleme hatası:",
        error
      );


      area.innerHTML = `
        <div class="error-box">
          Bu yazı bulunamadı veya henüz yayınlanmadı.
        </div>
      `;

      return;

    }


    /* ==========================================
       YAZAR
    ========================================== */

    const authorName =
      data.yazarlar &&
      data.yazarlar.ad_soyad
        ? data.yazarlar.ad_soyad
        : "KARŞI";


    /* ==========================================
       TARİH
    ========================================== */

    let tarih = "";

    if (data.yayin_tarihi) {

      const date =
        new Date(
          data.yayin_tarihi
        );

      tarih =
        date.toLocaleDateString(
          "tr-TR",
          {
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

    }


    /* ==========================================
       FOTOĞRAF
    ========================================== */

    const fotograf =
      data.kapak_fotografi_url
        ? `
          <img
            class="cover-image"
            src="${guvenliMetin(data.kapak_fotografi_url)}"
            alt="${guvenliMetin(data.baslik)}"
          >
        `
        : "";


    /* ==========================================
       İÇERİK
    ========================================== */

    area.innerHTML = `

      <div class="article-category">

        ${guvenliMetin(
          data.kategori || "KARŞI / YORUM"
        )}

      </div>


      <h1 class="article-title">

        ${guvenliMetin(
          data.baslik
        )}

      </h1>


      <div class="article-meta">

        Yazan:
        <strong>
          ${guvenliMetin(
            authorName
          )}
        </strong>

        ${
          tarih
            ? " · " + guvenliMetin(tarih)
            : ""
        }

      </div>


      ${fotograf}


      <div class="article-content">

        ${guvenliMetin(
          data.icerik
        )}

      </div>

    `;


    /* ==========================================
       SAYFA BAŞLIĞI
    ========================================== */

    document.title =
      data.baslik +
      " — KARŞI";

  }


  /* ==================================================
     BAŞLAT
  ================================================== */

  yaziGetir();

</script>


</body>
</html>
