<main>

    <div class="page-title">
        <h1>KARŞI DOSYALAR</h1>
        <p>Araştırmalar, incelemeler ve özel dosyalar.</p>

    </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    /* ==========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL = "https://rfqiffvudbmphvklxetf.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";

    const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    /* ==========================================
       YARDIMCI FONKSİYONLAR
    ========================================== */

    function escapeHtml(metin) {

        if (metin === null || metin === undefined) {
            return "";
        }

        return String(metin)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function escapeAttribute(metin) {

        return escapeHtml(metin);
    }


    function tarihFormatla(tarih) {

        if (!tarih) {
            return "";
        }

        const d = new Date(tarih);

        if (Number.isNaN(d.getTime())) {
            return "";
        }

        return d.toLocaleDateString("tr-TR", {
            day: "2-digit",
            month: "long",
            year: "numeric"
        });
    }


    function slugdanSayfaOlustur(slug) {

        return "dosya-" + encodeURIComponent(slug) + ".html";
    }


    /* ==========================================
       DOSYALARI GETİR
    ========================================== */

    async function dosyalariGetir() {

        const liste = document.getElementById("dosyalarListesi");

        const { data, error } = await db
            .from("dosyalar")
            .select("*")
            .eq("durum", "yayinda")
            .order("yayin_tarihi", {
                ascending: false,
                nullsFirst: false
            })
            .order("created_at", {
                ascending: false
            });


        if (error) {

            console.error("Dosyalar yüklenemedi:", error);

            liste.innerHTML = `
                <div class="bos">
                    <strong>Dosyalar yüklenemedi.</strong>
                    Lütfen daha sonra tekrar deneyin.
                </div>
            `;

            return;
        }


        if (!data || data.length === 0) {

            liste.innerHTML = `
                <div class="bos">
                    <strong>Henüz yayınlanmış dosya bulunmuyor.</strong>
                    KARŞI'nın araştırma ve özel dosyaları burada yayınlanacak.
                </div>
            `;

            return;
        }


        liste.innerHTML = data.map(dosya => {

            const baslik = escapeHtml(dosya.baslik);
            const ozet = escapeHtml(dosya.ozet || "");
            const kategori = escapeHtml(dosya.kategori || "Dosya");

            const tarih = tarihFormatla(
                dosya.yayin_tarihi || dosya.created_at
            );

            const slug = dosya.slug || dosya.id;

            const sayfa = slugdanSayfaOlustur(slug);


            let fotograf = "";

            if (dosya.kapak_fotografi_url) {

                const url = escapeAttribute(
                    dosya.kapak_fotografi_url
                );

                fotograf = `
                    <div class="dosya-foto">
                        <img
                            src="${url}"
                            alt="${escapeAttribute(dosya.baslik)}"
                            loading="lazy"
                        >
                    </div>
                `;

            }


            return `
                <article class="dosya">

                    ${fotograf}

                    <div class="dosya-icerik">

                        <div class="kategori">
                            ${kategori}
                        </div>

                        <h2>
                            <a href="${sayfa}">
                                ${baslik}
                            </a>
                        </h2>

                        ${
                            ozet
                            ? `<p class="dosya-ozet">${ozet}</p>`
                            : ""
                        }

                        ${
                            tarih
                            ? `<div class="tarih">${tarih}</div>`
                            : ""
                        }

                        <a
                            class="oku"
                            href="${sayfa}"
                        >
                            DOSYAYI OKU →
                        </a>

                    </div>

                </article>
            `;

        }).join("");

    }


    /* ==========================================
       BAŞLAT
    ========================================== */

    dosyalariGetir();

</script>

</body>
