name: KARŞI Haber Motoru

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  haberleri-topla:
    runs-on: ubuntu-latest

    steps:
      - name: KARŞI repository indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: RSS ve web haberlerini çek
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import os
          import html
          import re
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          haberler = []

          # ==================================================
          # SÖZCÜ RSS KAYNAKLARI
          # ==================================================

          rss_kaynaklari = [
              {
                  "ad": "Sözcü",
                  "rss": "https://www.sozcu.com.tr/feeds-haberler",
                  "limit": 30
              },
              {
                  "ad": "Sözcü Gündem",
                  "rss": "https://www.sozcu.com.tr/feeds-rss-category-gundem",
                  "limit": 25
              }
          ]

          for kaynak in rss_kaynaklari:

              kaynak_haberleri = []

              try:

                  request = urllib.request.Request(
                      kaynak["rss"],
                      headers={
                          "User-Agent": "Mozilla/5.0 (KarsiHaberMotoru/1.0)"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:

                      data = response.read()

                  root = ET.fromstring(data)

                  for item in root.findall(".//item"):

                      title = item.findtext("title", "")
                      link = item.findtext("link", "")
                      pub_date = item.findtext("pubDate", "")
                      description = item.findtext("description", "")

                      if not title or not link:
                          continue

                      description = html.unescape(description)

                      description = re.sub(
                          r"<[^>]+>",
                          "",
                          description
                      )

                      description = re.sub(
                          r"\s+",
                          " ",
                          description
                      ).strip()

                      kaynak_haberleri.append({
                          "baslik": title.strip(),
                          "aciklama": description[:300],
                          "kaynak": kaynak["ad"],
                          "link": link.strip(),
                          "tarih": pub_date.strip()
                      })

                  # Önce bu kaynağın kendi haberlerini tarihe göre sırala
                  def rss_tarih(haber):

                      try:
                          return parsedate_to_datetime(
                              haber["tarih"]
                          ).timestamp()
                      except:
                          return 0

                  kaynak_haberleri.sort(
                      key=rss_tarih,
                      reverse=True
                  )

                  # Kaynak başına limit
                  kaynak_haberleri = kaynak_haberleri[
                      :kaynak["limit"]
                  ]

                  haberler.extend(kaynak_haberleri)

                  print(
                      f"{kaynak['ad']} başarıyla okundu: "
                      f"{len(kaynak_haberleri)} haber."
                  )

              except Exception as e:

                  print(
                      f"{kaynak['ad']} okunamadı: {e}"
                  )


          # ==================================================
          # NEFES GÜNDEM
          # ==================================================

          class NefesParser(HTMLParser):

              def __init__(self):

                  super().__init__()

                  self.in_link = False
                  self.current_link = ""
                  self.current_text = ""
                  self.links = []

              def handle_starttag(self, tag, attrs):

                  if tag != "a":
                      return

                  attributes = dict(attrs)

                  href = attributes.get("href", "")

                  if not href:
                      return

                  if href.startswith("/"):
                      href = urljoin(
                          "https://www.nefes.com.tr",
                          href
                      )

                  if "nefes.com.tr" not in href:
                      return

                  self.in_link = True
                  self.current_link = href
                  self.current_text = ""

              def handle_data(self, data):

                  if self.in_link:
                      self.current_text += data

              def handle_endtag(self, tag):

                  if tag != "a":
                      return

                  if not self.in_link:
                      return

                  title = re.sub(
                      r"\s+",
                      " ",
                      self.current_text
                  ).strip()

                  link = self.current_link.strip()

                  if (
                      title
                      and len(title) >= 20
                      and link.startswith(
                          "https://www.nefes.com.tr/"
                      )
                      and link.rstrip("/").count("/") >= 3
                  ):

                      self.links.append(
                          (title, link)
                      )

                  self.in_link = False
                  self.current_link = ""
                  self.current_text = ""


          try:

              nefes_url = "https://www.nefes.com.tr/gundem"

              request = urllib.request.Request(
                  nefes_url,
                  headers={
                      "User-Agent":
                      "Mozilla/5.0 "
                      "(compatible; KarsiHaberMotoru/1.0)"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  nefes_html = response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

              parser = NefesParser()

              parser.feed(nefes_html)

              gorulen_linkler = set()

              for title, link in parser.links:

                  if link in gorulen_linkler:
                      continue

                  gorulen_linkler.add(link)

                  haberler.append({
                      "baslik": title,
                      "aciklama": "",
                      "kaynak": "Nefes",
                      "link": link,
                      "tarih": ""
                  })

                  if len(gorulen_linkler) >= 25:
                      break

              print(
                  f"Nefes: "
                  f"{len(gorulen_linkler)} haber bulundu."
              )

          except Exception as e:

              print(
                  f"Nefes okunamadı: {e}"
              )


          # ==================================================
          # TEKRARLARI TEMİZLE
          # ==================================================

          benzersiz = {}

          for haber in haberler:

              link = haber["link"].strip()

              if not link:
                  continue

              if link not in benzersiz:
                  benzersiz[link] = haber

          haberler = list(
              benzersiz.values()
          )


          # ==================================================
          # TARİHE GÖRE SIRALA
          # ==================================================

          def haber_tarihi(haber):

              tarih = haber.get("tarih", "")

              if not tarih:
                  return 0

              try:

                  return parsedate_to_datetime(
                      tarih
                  ).timestamp()

              except:

                  return 0


          haberler.sort(
              key=haber_tarihi,
              reverse=True
          )


          # ==================================================
          # EN FAZLA 75 HABER
          # ==================================================

          haberler = haberler[:75]


          # ==================================================
          # JSON DOSYASI
          # ==================================================

          veri = {
              "guncelleme":
                  datetime.now(timezone.utc).isoformat(),

              "haberler":
                  haberler
          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/haberler.json",
              "w",
              encoding="utf-8"
          ) as dosya:

              json.dump(
                  veri,
                  dosya,
                  ensure_ascii=False,
                  indent=2
              )


          # ==================================================
          # SONUÇ
          # ==================================================

          kaynak_sayilari = {}

          for haber in haberler:

              kaynak = haber["kaynak"]

              kaynak_sayilari[kaynak] = (
                  kaynak_sayilari.get(kaynak, 0) + 1
              )

          print("")
          print("========== KARŞI HABER MOTORU ==========")
          print(
              f"Toplam: {len(haberler)} haber"
          )

          for kaynak, sayi in kaynak_sayilari.items():

              print(
                  f"{kaynak}: {sayi}"
              )

          print("=========================================")

          PY

      - name: Haberleri GitHub'a kaydet
        run: |
          git config user.name "KARŞI Haber Botu"
          git config user.email "actions@users.noreply.github.com"

          git add data/haberler.json

          if git diff --cached --quiet; then
            echo "Yeni haber yok."
          else
            git commit -m "KARŞI haber akışını güncelle"
            git push
          fi
