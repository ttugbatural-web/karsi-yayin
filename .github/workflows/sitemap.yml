name: KARŞIDAN Sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sitemap from published content
        env:
          KARSI_SUPABASE_URL: https://rfqiffvudbmphvklxetf.supabase.co
          KARSI_SUPABASE_ANON_KEY: sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65
        run: python scripts/generate_sitemap.py

      - name: Commit sitemap if changed
        run: |
          git config user.name "KARŞIDAN Sitemap Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "Sitemap already up to date."
          else
            git commit -m "Update sitemap for published content"
            git push
          fi
