<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>KARŞIDAN Gündem — Yönetim</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f2f0;
    color: #111;
}

/* =========================
   HEADER
========================= */

header {
    background: #111;
    color: white;
    border-bottom: 4px solid #c40000;
    padding: 18px 20px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.logo {
    position: relative;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 36px;
    font-weight: bold;
    letter-spacing: -2px;
}

.logo::after {
    content: "";

    position: absolute;

    height: 4px;
    width: 115%;

    background: #c40000;

    left: -7%;
    top: 53%;

    transform: rotate(-4deg);
}

.back {
    color: white;
    text-decoration: none;

    border: 1px solid #555;

    padding: 8px 12px;

    font-size: 12px;
}

.back:hover {
    background: white;
    color: #111;
}


/* =========================
   MAIN
========================= */

main {
    max-width: 1100px;
    margin: 35px auto;

    padding: 0 18px;
}

.page-title {
    font-family: Georgia, "Times New Roman", serif;

    font-size: 38px;

    margin-bottom: 8px;
}

.page-description {
    color: #666;

    font-size: 14px;

    margin-bottom: 30px;
}


/* =========================
   MESAJ
========================= */

.message {
    padding: 14px 16px;

    margin-bottom: 25px;

    font-size: 13px;

    display: none;
}

.message.success {
    display: block;

    background: #e7f4e7;

    color: #246024;

    border-left: 4px solid #2d8a2d;
}

.message.error {
    display: block;

    background: #f7e4e4;

    color: #8b0000;

    border-left: 4px solid #c40000;
}


/* =========================
   FORM
========================= */

.form-box {
    background: white;

    border: 1px solid #ddd;

    padding: 25px;

    margin-bottom: 35px;
}

.form-box h2 {
    font-family: Georgia, "Times New Roman", serif;

    font-size: 25px;

    margin-bottom: 22px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;

    font-size: 12px;

    font-weight: bold;

    margin-bottom: 7px;
}

.form-group input,
.form-group textarea,
.form-group select {

    width: 100%;

    border: 1px solid #ccc;

    padding: 12px;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 14px;

    outline: none;

    background: white;
}

.form-group textarea {

    min-height: 220px;

    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {

    border-color: #111;
}


/* =========================
   İKİLİ ALAN
========================= */

.form-row {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 18px;
}


/* =========================
   FOTOĞRAF
========================= */

.photo-area {

    display: flex;

    align-items: flex-start;

    gap: 20px;

    margin-bottom: 20px;
}

.photo-preview {

    width: 180px;
    height: 110px;

    background: #ddd;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    flex-shrink: 0;

    font-family: Georgia, serif;

    font-size: 25px;

    color: #777;
}

.photo-preview img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.photo-info {

    font-size: 12px;

    color: #666;

    line-height: 1.5;
}

.photo-info input {

    margin-top: 10px;
}


/* =========================
   BUTONLAR
========================= */

.button-area {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}

.save-button {

    background: #111;

    color: white;

    border: none;

    padding: 13px 20px;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;
}

.save-button:hover {

    background: #c40000;
}

.save-button:disabled {

    opacity: 0.6;

    cursor: wait;
}

.cancel-button {

    background: #ddd;

    color: #111;

    border: none;

    padding: 13px 20px;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;

    display: none;
}

.cancel-button:hover {

    background: #bbb;
}


/* =========================
   LİSTE
========================= */

.articles-title {

    font-family: Georgia, "Times New Roman", serif;

    font-size: 27px;

    margin-bottom: 15px;
}

.articles {

    display: flex;

    flex-direction: column;

    gap: 15px;
}

.article-card {

    background: white;

    border: 1px solid #ddd;

    padding: 18px;

    display: flex;

    gap: 18px;

    align-items: flex-start;
}

.article-image {

    width: 180px;
    height: 115px;

    background: #ddd;

    overflow: hidden;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family: Georgia, serif;

    font-size: 24px;

    color: #777;
}

.article-image img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.article-info {

    flex: 1;

    min-width: 0;
}

.article-info h3 {

    font-family: Georgia, "Times New Roman", serif;

    font-size: 21px;

    line-height: 1.25;

    margin-bottom: 7px;
}

.article-summary {

    color: #555;

    font-size: 13px;

    line-height: 1.45;

    margin-bottom: 9px;
}

.article-meta {

    color: #777;

    font-size: 11px;

    margin-bottom: 12px;
}

.article-meta strong {

    color: #111;
}

.status-badge {

    display: inline-block;

    padding: 4px 7px;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 1px;

    margin-right: 7px;
}

.status-yayinda {

    background: #e7f4e7;

    color: #246024;
}

.status-taslak {

    background: #eee;

    color: #777;
}

.article-actions {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}

.edit-button,
.delete-button {

    border: none;

    padding: 8px 11px;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;
}

.edit-button {

    background: #111;

    color: white;
}

.edit-button:hover {

    background: #444;
}

.delete-button {

    background: #eee;

    color: #a00000;
}

.delete-button:hover {

    background: #c40000;

    color: white;
}

.empty {

    background: white;

    border: 1px solid #ddd;

    padding: 25px;

    color: #777;

    font-size: 14px;
}


/* =========================
   MOBİL
========================= */

@media (max-width: 700px) {

    .page-title {
        font-size: 32px;
    }

    .form-box {
        padding: 20px;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

    .photo-area {
        flex-direction: column;
    }

    .photo-preview {
        width: 100%;
        height: 180px;
    }

    .article-card {
        flex-direction: column;
    }

    .article-image {
        width: 100%;
        height: 190px;
    }

}

</style>

</head>

<body>


<header>

<div class="header-inner">

<div class="logo">
KARŞIDAN
</div>

<a
    class="back"
    href="index.html"
>
← Yönetim Paneli
</a>

</div>

</header>


<main>


<h1 class="page-title">
KARŞIDAN Gündem
</h1>

<p class="page-description">
KARŞIDAN'ın kendi haberlerini, gündem yazılarını
ve özgün içeriklerini buradan yönet.
</p>


<div
    id="message"
    class="message"
></div>


<!-- =========================
     FORM
========================= -->

<section class="form-box">

<h2 id="formTitle">
Yeni KARŞIDAN Gündem İçeriği
</h2>


<div class="form-group">

<label>
BAŞLIK
</label>

<input
    type="text"
    id="articleTitle"
    placeholder="İçeriğin başlığını yaz..."
>

</div>


<div class="form-group">

<label>
ÖZET
</label>

<textarea
    id="articleSummary"
    style="min-height:100px;"
    placeholder="Ana sayfada ve haber listelerinde görünecek kısa özet..."
></textarea>

<div class="form-group">

<label>
İÇERİK
</label>

<textarea
    id="articleContent"
    placeholder="KARŞIDAN Gündem içeriğini buraya yaz..."
></textarea>

</div>


<div class="form-row">


<div class="form-group">

<label>
KATEGORİ
</label>

<input
    type="text"
    id="articleCategory"
    placeholder="Örn. Gündem, Politika, Ekonomi..."
>

</div>


<div class="form-group">

<label>
YAZAR
</label>

<select id="articleAuthor">

<option value="">
Yazar seç...
</option>

</select>

</div>


</div>


<div class="form-group">

<label>
DURUM
</label>

<select id="articleStatus">

<option value="taslak">
Taslak
</option>

<option value="yayinda">
Yayında
</option>

</select>

<div class="form-group">

<label>
KAPAK FOTOĞRAFI
</label>


<div class="photo-area">


<div
    class="photo-preview"
    id="photoPreview"
>
KARŞIDAN
</div>

Kapak fotoğrafını seç.

<br>

JPG veya PNG kullanabilirsin.

<input

</main>


<footer>

</footer>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
    "https://rfqiffvudbmphvklxetf.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_FZQzfS0NBm0wZCSzV6dyvg_7mNUW-65";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==================================================
   ELEMENTLER
================================================== */

const photoInput =
    document.getElementById(
        "articlePhoto"
    );

const photoPreview =
    document.getElementById(
        "photoPreview"
    );

const saveButton =
    document.getElementById(
        "saveButton"
    );

const cancelButton =
    document.getElementById(
        "cancelButton"
    );

const formTitle =
    document.getElementById(
        "formTitle"
    );

const messageBox =
    document.getElementById(
        "message"
    );

const authorSelect =
    document.getElementById(
        "articleAuthor"
    );


let duzenlenenIcerikId =
    null;


/* ==================================================
   MESAJ
================================================== */

function mesajGoster(
    mesaj,
    tip
) {

    messageBox.textContent =
        mesaj;

    messageBox.className =
        "message " + tip;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==================================================
   GÜVENLİ METİN
================================================== */

function guvenliMetin(
    metin
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        metin == null
            ? ""
            : String(metin);

    return div.innerHTML;

}


/* ==================================================
   SLUG
================================================== */

function slugOlustur(
    metin
) {

    return metin

        .toLocaleLowerCase(
            "tr-TR"
        )

        .replace(/ğ/g, "g")
        .replace(/ü/g, "u")
        .replace(/ş/g, "s")
        .replace(/ı/g, "i")
        .replace(/ö/g, "o")
        .replace(/ç/g, "c")

        .replace(
            /[^a-z0-9]+/g,
            "-"
        )

        .replace(
            /^-+|-+$/g,
            ""
        );

}


/* ==================================================
   TARİH
================================================== */

function tarihFormatla(
    tarih
) {

    if (!tarih) {
        return "";
    }

    const date =
        new Date(tarih);

    if (
        isNaN(
            date.getTime()
        )
    ) {
        return "";
    }

    return date.toLocaleDateString(
        "tr-TR",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* ==================================================
   FOTOĞRAF ÖNİZLEME
================================================== */

photoInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];

        if (!file) {
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(e) {

                photoPreview.innerHTML =

                    `<img
                        src="${e.target.result}"
                        alt="Kapak fotoğrafı"
                    >`;

            };

        reader.readAsDataURL(
            file
        );

    }
);


/* ==================================================
   FOTOĞRAF YÜKLE
================================================== */

async function fotografYukle(
    file,
    slug
) {

    const uzanti =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const dosyaAdi =
        slug +
        "-" +
        Date.now() +
        "." +
        uzanti;


    const {
        error
    } =
        await supabaseClient
            .storage
            .from(
                "yazar-fotograflari"
            )
            .upload(
                dosyaAdi,
                file,
                {
                    cacheControl:
                        "3600",

                    upsert:
                        false
                }
            );


    if (error) {

        throw error;

    }


    const {
        data
    } =
        supabaseClient
            .storage
            .from(
                "yazar-fotograflari"
            )
            .getPublicUrl(
                dosyaAdi
            );


    return {

        url:
            data.publicUrl,

        path:
            dosyaAdi

    };

}


/* ==================================================
   FOTOĞRAF YOLU
================================================== */

function fotografYoluBul(
    url
) {

    if (!url) {
        return null;
    }


    const marker =
        "/storage/v1/object/public/yazar-fotograflari/";


    const index =
        url.indexOf(
            marker
        );


    if (index === -1) {
        return null;
    }


    return decodeURIComponent(
        url.substring(
            index +
            marker.length
        )
    );

}


/* ==================================================
   FOTOĞRAF SİL
================================================== */

async function fotografSil(
    url
) {

    const path =
        fotografYoluBul(
            url
        );

    if (!path) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .storage
            .from(
                "yazar-fotograflari"
            )
            .remove([
                path
            ]);


    if (error) {

        console.warn(
            "Fotoğraf silinemedi:",
            error
        );

    }

}


/* ==================================================
   YAZARLARI GETİR
================================================== */

async function yazarlariGetir() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from(
                "yazarlar"
            )
            .select(
                "id, ad_soyad, aktif"
            )
            .eq(
                "aktif",
                true
            )
            .order(
                "ad_soyad",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Yazarlar alınamadı:",
            error
        );

        mesajGoster(
            "Yazarlar yüklenemedi: " +
            error.message,
            "error"
        );

        return;

    }


    authorSelect.innerHTML = `

        <option value="">
            Yazar seç...
        </option>

    `;


    data.forEach(
        function(author) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                author.id;

            option.textContent =
                author.ad_soyad;

            authorSelect.appendChild(
                option
            );

        }
    );

}


/* ==================================================
   İÇERİK KAYDET
================================================== */

async function icerikKaydet() {

    const baslik =
        document
            .getElementById(
                "articleTitle"
            )
            .value
            .trim();


    const ozet =
        document
            .getElementById(
                "articleSummary"
            )
            .value
            .trim();


    const icerik =
        document
            .getElementById(
                "articleContent"
            )
            .value
            .trim();


    const kategori =
        document
            .getElementById(
                "articleCategory"
            )
            .value
            .trim();


    const yazarId =
        authorSelect.value;


    const durum =
        document
            .getElementById(
                "articleStatus"
            )
            .value;


    const photoFile =
        photoInput.files[0];


    if (!baslik) {

        mesajGoster(
            "Lütfen bir başlık yaz.",
            "error"
        );

        return;

    }


    if (!icerik) {

        mesajGoster(
            "Lütfen içerik metnini yaz.",
            "error"
        );

        return;

    }


    if (!yazarId) {

        mesajGoster(
            "Lütfen bir yazar seç.",
            "error"
        );

        return;

    }


    const slug =
        slugOlustur(
            baslik
        );


    saveButton.disabled =
        true;


    saveButton.textContent =
        duzenlenenIcerikId
            ? "GÜNCELLENİYOR..."
            : "KAYDEDİLİYOR...";


    try {


        /* ==========================================
           YENİ İÇERİK
        ========================================== */

        if (!duzenlenenIcerikId) {

            let fotografUrl =
                null;


            if (photoFile) {

                const foto =
                    await fotografYukle(
                        photoFile,
                        slug
                    );

                fotografUrl =
                    foto.url;

            }


            const {
                error
            } =
                await supabaseClient
                    .from(
                        "karsi_gundem"
                    )
                    .insert({

                        baslik:
                            baslik,

                        ozet:
                            ozet || null,

                        icerik:
                            icerik,

                        yazar_id:
                            yazarId,

                        kapak_fotografi_url:
                            fotografUrl,

                        kategori:
                            kategori || null,

                        slug:
                            slug,

                        durum:
                            durum

                    });


            if (error) {

                throw error;

            }


            mesajGoster(
                "KARŞIDAN Gündem içeriği başarıyla kaydedildi.",
                "success"
            );

        }


        /* ==========================================
           GÜNCELLE
        ========================================== */

        else {

            const {
                data: mevcut,
                error: getError
            } =
                await supabaseClient
                    .from(
                        "karsi_gundem"
                    )
                    .select(
                        "*"
                    )
                    .eq(
                        "id",
                        duzenlenenIcerikId
                    )
                    .single();


            if (getError) {

                throw getError;

            }


            let fotografUrl =
                mevcut.kapak_fotografi_url;


            if (photoFile) {

                const yeniFoto =
                    await fotografYukle(
                        photoFile,
                        slug
                    );


                fotografUrl =
                    yeniFoto.url;


                if (
                    mevcut.kapak_fotografi_url
                ) {

                    await fotografSil(
                        mevcut.kapak_fotografi_url
                    );

                }

            }


            const {
                error: updateError
            } =
                await supabaseClient
                    .from(
                        "karsi_gundem"
                    )
                    .update({

                        baslik:
                            baslik,

                        ozet:
                            ozet || null,

                        icerik:
                            icerik,

                        yazar_id:
                            yazarId,

                        kapak_fotografi_url:
                            fotografUrl,

                        kategori:
                            kategori || null,

                        slug:
                            slug,

                        durum:
                            durum,

                        updated_at:
                            new Date()
                                .toISOString()

                    })
                    .eq(
                        "id",
                        duzenlenenIcerikId
                    );


            if (updateError) {

                throw updateError;

            }


            mesajGoster(
                "KARŞIDAN Gündem içeriği başarıyla güncellendi.",
                "success"
            );

        }


        formuTemizle();

        await icerikleriGetir();

    }


    catch (error) {

        console.error(
            "İçerik kaydetme hatası:",
            error
        );


        mesajGoster(
            "İşlem başarısız: " +
            error.message,
            "error"
        );

    }


    finally {

        saveButton.disabled =
            false;

        saveButton.textContent =
            "İÇERİĞİ KAYDET";

    }

}


/* ==================================================
   İÇERİKLERİ GETİR
================================================== */

async function icerikleriGetir() {

    const list =
        document.getElementById(
            "articlesList"
        );


    const {
        data,
        error
    } =
        await supabaseClient
            .from(
                "karsi_gundem"
            )
            .select(`
                *,
                yazarlar (
                    ad_soyad
                )
            `)
            .order(
                "created_at",
                {
                    ascending:
                        false
                }
            );


    if (error) {

        console.error(
            "İçerikler alınamadı:",
            error
        );


        list.innerHTML = `

            <div class="empty">

                İçerikler yüklenemedi:

                <br><br>

                ${guvenliMetin(
                    error.message
                )}

            </div>

        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                Henüz KARŞIDAN Gündem
                içeriği bulunmuyor.

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    data.forEach(
        function(article) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "article-card";


            let imageHtml = "KARŞIDAN";


            if (
                article.kapak_fotografi_url
            ) {

                imageHtml = `

                    <img
                        src="${guvenliMetin(
                            article.kapak_fotografi_url
                        )}"
                        alt="${guvenliMetin(
                            article.baslik
                        )}"
                    >

                `;

            }


            const authorName =
                article.yazarlar &&
                article.yazarlar.ad_soyad

                    ? article.yazarlar.ad_soyad

                    : "Yazar bulunamadı";


            const statusClass =
                article.durum === "yayinda"

                    ? "status-yayinda"

                    : "status-taslak";


            const statusText =
                article.durum === "yayinda"

                    ? "YAYINDA"

                    : "TASLAK";


            card.innerHTML = `

                <div class="article-image">

                    ${imageHtml}

                </div>


                <div class="article-info">

                    <h3>
                        ${guvenliMetin(
                            article.baslik
                        )}
                    </h3>


                    ${
                        article.ozet
                        ? `
                            <div class="article-summary">
                                ${guvenliMetin(
                                    article.ozet
                                )}
                            </div>
                        `
                        : ""
                    }


                    <div class="article-meta">

                        <span
                            class="status-badge ${statusClass}"
                        >
                            ${statusText}
                        </span>


                        ${
                            article.kategori
                            ? `
                                ${guvenliMetin(
                                    article.kategori
                                )}
                                ·
                            `
                            : ""
                        }


                        Yazar:

                        <strong>
                            ${guvenliMetin(
                                authorName
                            )}
                        </strong>


                        ${
                            article.created_at
                            ? `
                                ·
                                ${guvenliMetin(
                                    tarihFormatla(
                                        article.created_at
                                    )
                                )}
                            `
                            : ""
                        }

                    </div>


                    <div class="article-actions">

                        <button
                            class="edit-button"
                            onclick="icerikDuzenle('${article.id}')"
                        >
                            DÜZENLE
                        </button>


                        <button
                            class="delete-button"
                            onclick="icerikSil('${article.id}')"
                        >
                            SİL
                        </button>

                    </div>

                </div>

            `;


            list.appendChild(
                card
            );

        }
    );

}


/* ==================================================
   İÇERİK DÜZENLE
================================================== */

async function icerikDuzenle(
    id
) {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from(
                    "karsi_gundem"
                )
                .select(
                    "*"
                )
                .eq(
                    "id",
                    id
                )
                .single();


        if (error) {

            throw error;

        }


        duzenlenenIcerikId =
            id;


        document
            .getElementById(
                "articleTitle"
            )
            .value =
                data.baslik || "";


        document
            .getElementById(
                "articleSummary"
            )
            .value =
                data.ozet || "";


        document
            .getElementById(
                "articleContent"
            )
            .value =
                data.icerik || "";


        document
            .getElementById(
                "articleCategory"
            )
            .value =
                data.kategori || "";


        document
            .getElementById(
                "articleStatus"
            )
            .value =
                data.durum || "taslak";


        authorSelect.value =
            data.yazar_id || "";


        if (
            data.kapak_fotografi_url
        ) {

            photoPreview.innerHTML = `

                <img
                    src="${guvenliMetin(
                        data.kapak_fotografi_url
                    )}"
                    alt="Kapak fotoğrafı"
                >

            `;

        }

        else {

            photoPreview.innerHTML =
                "KARŞIDAN";

        }


        photoInput.value =
            "";


        formTitle.textContent =
            "KARŞIDAN Gündem İçeriğini Düzenle";


        saveButton.textContent =
            "DEĞİŞİKLİKLERİ KAYDET";


        cancelButton.style.display =
            "block";


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }


    catch (error) {

        console.error(
            "İçerik düzenleme hatası:",
            error
        );


        mesajGoster(
            "İçerik bilgileri alınamadı: " +
            error.message,
            "error"
        );

    }

}


/* ==================================================
   İÇERİK SİL
================================================== */

async function icerikSil(
    id
) {

    const onay =
        confirm(

            "Bu KARŞIDAN Gündem içeriğini silmek istediğine emin misin?\n\nİçerik ve kapak fotoğrafı silinecek."

        );


    if (!onay) {
        return;
    }


    try {

        const {
            data,
            error: getError
        } =
            await supabaseClient
                .from(
                    "karsi_gundem"
                )
                .select(
                    "kapak_fotografi_url"
                )
                .eq(
                    "id",
                    id
                )
                .single();


        if (getError) {

            throw getError;

        }


        const {
            error: deleteError
        } =
            await supabaseClient
                .from(
                    "karsi_gundem"
                )
                .delete()
                .eq(
                    "id",
                    id
                );


        if (deleteError) {

            throw deleteError;

        }


        if (
            data &&
            data.kapak_fotografi_url
        ) {

            await fotografSil(
                data.kapak_fotografi_url
            );

        }


        mesajGoster(
            "KARŞIDAN Gündem içeriği silindi.",
            "success"
        );


        await icerikleriGetir();

    }


    catch (error) {

        console.error(
            "İçerik silme hatası:",
            error
        );


        mesajGoster(
            "İçerik silinemedi: " +
            error.message,
            "error"
        );

    }

}

   FORM TEMİZLE
================================================== */

    duzenlenenIcerikId =

    document

        .getElementById(

        )
        .value =

    document
        .getElementById(
            "articleContent"
        )
        .value =
            "";


    document
        .getElementById(
            "articleCategory"
        )
        .value =
            "";


    authorSelect.value =
        "";


    document
        .getElementById(
            "articleStatus"
        )
        .value =
            "taslak";


    photoInput.value =
        "";


    photoPreview.innerHTML =
        "KARŞIDAN";


    formTitle.textContent =
        "Yeni KARŞIDAN Gündem İçeriği";


    saveButton.textContent =
        "İÇERİĞİ KAYDET";


    cancelButton.style.display =

}


/* ==================================================

================================================== */

function duzenlemeyiIptalEt() {

    formuTemizle();

}


/* ==================================================
   BAŞLAT
================================================== */

async function baslat() {

    await yazarlariGetir();

    await icerikleriGetir();

}


baslat();
